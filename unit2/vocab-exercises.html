inal number + left</b> <b>/</b> <b>right</b> <i class=\"ph\">/teɪk ðə … left / raɪt/</i> (v.phr): rẽ trái / phải ở ngã rẽ thứ</div><div class=\"vi\"><span class=\"vn\">30.</span> <b>gift and souvenir</b> <i class=\"ph\">/ɡɪft ænd ˌsuːvəˈnɪr/</i> (n.phr): quà tặng và quà lưu niệm</div><div class=\"vi\"><span class=\"vn\">31.</span> <b>navigate</b> <i class=\"ph\">/ˈnævɪɡeɪt/</i> (v): tìm đường, định hướng</div><div class=\"vi sub\"><b>– navigation app</b> <i class=\"ph\">/ˌnævɪˈɡeɪʃn æp/</i> (c.n): ứng dụng chỉ đường, ứng dụng định vị (như google maps)</div><div class=\"vi\"><span class=\"vn\">32.</span> <b>get lost</b> <i class=\"ph\">/ɡet lɒst/</i> (v.phr): bị lạc</div><div class=\"vi\"><span class=\"vn\">33.</span> <b>punctual</b> <i class=\"ph\">/ˈpʌŋktʃuəl/</i> (adj): đúng giờ</div><div class=\"vi sub\"><b>– punctuality</b> <i class=\"ph\">/ˌpʌŋktʃuˈæləti/</i> (u.n): tính đúng giờ, sự đúng giờ</div><div class=\"vi\"><span class=\"vn\">34.</span> <b>delay</b> <i class=\"ph\">/dɪˈleɪ/</i> = <b>postpone</b> <i class=\"ph\">/pəˈspəʊn/</i> (v) = <b>put off</b> <i class=\"ph\">/pʊt ɒf/</i> (v.phr): trì hoãn, làm chậm trễ</div><div class=\"vi\"><span class=\"vn\">35.</span> <b>means / mode of transportation</b> <i class=\"ph\">/miːnz / məʊd əv ˌtrænspɔːrˈteɪʃn/</i> (c.n): phương tiện giao thông</div><div class=\"vi sub\"><b>– public transport</b> <i class=\"ph\">/ˈpʌblɪk ˈtrænspɔːrt/</i> (c.n): phương tiện giao thông công cộng</div><div class=\"vi sub\"><b>– private transport</b> <i class=\"ph\">/ˈpraɪvət ˈtrænspɔːrt/</i> = <b>personal vehicle</b> <i class=\"ph\">/ˈpɜːrsənl ˈviːəkl/</i> (c.n): phương tiện giao thông cá nhân</div><div class=\"vi sub\"><b>– significant travel demand</b> <i class=\"ph\">/sɪɡˈnɪf.ə.kənt ˈtræv.əl dɪˈmænd/</i> (u.n) = <b>high transportation needs</b> <i class=\"ph\">/haɪ ˌtræn.spɚˈteɪ.ʃən niːdz/</i> (p.n): nhu cầu giao thông cao</div><div class=\"vi\"><span class=\"vn\">36.</span> <b>travel by air </b><i class=\"ph\">/ˈtrævl baɪ er/</i> <b>/  trung tâm</div><div class=\"vi\"><span class=\"vn\">54.</span> <b>construct</b> <i class=\"ph\">/kənˈstrʌkt/</i> = <b>build</b> <i class=\"ph\">/bɪld/</i> (v): xây dựng, xây mới</div><div class=\"vi sub\"><b>– construction</b> <i class=\"ph\">/kənˈstrʌkʃn/</i> (c.n): sự xây dựng, công trình</div><div class=\"vi sub\"><b>– newly built / constructed</b> <i class=\"ph\">/ˈnjuːli bɪlt/</i> / <i class=\"ph\">/kənˈstrʌktɪd/</i> (adj): mới được xây dựng</div><div class=\"vi\"><span class=\"vn\">55.</span> <b>extend</b> <i class=\"ph\">/ɪkˈstend/</i> = <b>enlarge</b> <i class=\"ph\">/ɪnˈlɑːdʒ/</i> = <b>expand</b> <i class=\"ph\">/ɪkˈspænd/</i> = <b>grow in size</b> <i class=\"ph\">/ɡrəʊ ɪn saɪz/</i> (v): mở rộng (diện tích)</div><div class=\"vi sub\"><b>– extension</b> <i class=\"ph\">/ɪkˈstenʃn/</i> = <b>enlargement</b> <i class=\"ph\">/ɪnˈlɑːdʒmənt/</i> = <b>expansion</b> <i class=\"ph\">/ɪkˈspæn.ʃən/</i> = <b>growth in size</b> <i class=\"ph\">/ɡrəʊθ ɪn saɪz/</i> (c.n): sự mở rộng</div><div class=\"vi\"><span class=\"vn\">56.</span> <b>remain unchanged</b> <i class=\"ph\">/rɪˈmeɪn ʌnˈtʃeɪndʒd/</i> = <b>stay the same</b> <i class=\"ph\">/steɪ ðə seɪm/</i> (v.phr): giữ nguyên không đổi</div><div class=\"vi\"><span class=\"vn\">57.</span> <b>demolish</b> <i class=\"ph\">/dɪˈmɒlɪʃ/</i> = <b>remove</b> <i class=\"ph\">/rɪˈmuːv/</i> (v): loại bỏ, phá dỡ</div><div class=\"vi sub\"><b>– demolition</b> <i class=\"ph\">/ˌdeməˈlɪʃn/</i> = <b>removal</b> <i class=\"ph\">/rɪˈmuːvl/</i> (c.n): sự xoá bỏ, phá dỡ</div><div class=\"vi\"><span class=\"vn\">58.</span> <b>infrastructure</b> <i class=\"ph\">/ˈɪnfrəstrʌktʃə(r)/</i> (u.n/c.n): cơ sở hạ tầng</div><div class=\"vi\"><span class=\"vn\">59.</span> <b>modification</b> <i class=\"ph\">/ˌmɒdɪfɪˈkeɪʃn/</i> = <b>change</b> <i class=\"ph\">/tʃeɪndʒ/</i> (c.n): sự thay đổi, sửa đổi</div><div class=\"vi sub\"><b>– undergo change</b> <i class=\"ph\">/ˌʌndəˈɡəʊ tʃeɪndʒ/</i> = <b>experience modification</b> <i class=\"ph\">/ɪkˈspɪəriəns ˌmɒdɪfɪˈkeɪʃn/</i> (v.phr): trải qua sự thay đổi</div><div class=\"vi\"><span class=\"vn\">60.</span> <b>minor</b> <i class=\"ph\">/ˈmaɪnə(r)/</i> (adj): nhỏ, không đáng kể</div><div class=\"vi\"><span class=\"vn\">61.</span> <b>major</b> <i class=\"ph\">/ˈmeɪdʒə(r)/</i> (adj): lớn, chủ yếu, quan trọng</div><div class=\"vi\"><span class=\"vn\">62.</span> <b>split</b> <b>/ divide sth into … (smaller) parts</b> <i class=\"ph\">/splɪt / dɪˈvaɪd ˈɪntə pɑːts/</i> (v.phr): chia / tách cái gì thành các phần (nhỏ hơn)</div><div class=\"vi\"><span class=\"vn\">63.</span> <b>branch off</b> <i class=\"ph\">/brɑːntʃ ɒf/</i> (v.phr): rẽ nhánh, tách nhánh</div><div class=\"vi\"><span class=\"vn\">64.</span> <b>replace</b> <i class=\"ph\">/rɪˈpleɪs/</i> (v): thay thế</div><div class=\"vi sub\"><b>– replacement</b> <i class=\"ph\">/rɪˈpleɪsmənt/</i> (c.n): sự thay thế</div><div class=\"vi sub\"><b>– in place of sth </b><i class=\"ph\">/ɪn pleɪs əv/</i> (prep.phr): thay cho, thế vào chỗ</div><div class=\"vi\"><span class=\"vn\">65.</span> <b>lane</b> <i class=\"ph\">/leɪn/</i> (c.n): làn đường</div><div class=\"vi\"><span class=\"vn\">66.</span> <b>block / row of sth</b> <i class=\"ph\">/blɒk / rəʊ əv ˈsʌmθɪŋ/</i> (c.n): dãy / khối cái gì (nhà, cây...)</div><div class=\"vi\"><span class=\"vn\">67.</span> <b>traffic light</b> <i class=\"ph\">/ˈtræfɪk laɪt/</i> (c.n): đèn giao thông</div><div class=\"vi\"><span class=\"vn\">68.</span> <b>pedestrian crosswalk</b> <i class=\"ph\">/pəˈdestriən ˈkrɒswɔːk/</i> = <b>zebra crossing</b> <i class=\"ph\">/ˌzebrə ˈkrɒsɪŋ/</i> (c.n): vạch sang đường cho người đi bộ</div><div class=\"vi\"><span class=\"vn\">69.</span> <b>intersection</b> <i class=\"ph\">/ˌɪntəˈsekʃn/</i> = <b>junction</b> <i class=\"ph\">/ˈdʒʌŋkʃn/</i> = <b>crossroad</b> (c.n): ngã tư, điểm giao nhau</div><div class=\"vi\"><span class=\"vn\">70.</span> <b>roundabout</b> <i class=\"ph\">/ˈraʊndəbaʊt/</i> (c.n): vòng xoay, bùng binh</div><div class=\"vi\"><span class=\"vn\">71.</span> <b>upgrade</b> <i class=\"ph\">/ˌʌpˈɡreɪd/</i> = <b>renovate</b> <i class=\"ph\">/ˈren.ə.veɪt/</i> (v): nâng cấp, cải tạo</div><div class=\"vi sub\"><b>– upgrade</b> <i class=\"ph\">/ˈʌpɡreɪd/</i> = <b>renovation</b> <i class=\"ph\">/ˌren.əˈveɪ.ʃən/</i> (c.n): sự nâng cấp, sự cải tạo</div><div class=\"vi\"><span class=\"vn\">72.</span> <b>connect directly to sth</b> /kəˈnekt dəˈrektli tuː / (v.phr): nối trực tiếp với</div><div class=\"vi\"><span class=\"vn\">73.</span> <b>adjacent to</b> <b>sth</b> <i class=\"ph\">/əˈdʒeɪsnt tuː/</i> (prep): ngay bên cạnh, liền kề</div><div class=\"vi\"><span class=\"vn\">74.</span> <b>opposite</b> <i class=\"ph\">/ˈɒpəzɪt/</i> (prep): đối diện = <b>facing</b> /ˈfeɪsɪŋ/ (prep): đối diện, hướng về</div><div class=\"vi sub\"><b>– across the street</b> <i class=\"ph\">/əˈkrɑːs ðə striːt/</i> = <b>on the other / opposite side of the street</b> <i class=\"ph\">/ɑːn ði ˈʌð.ɚ / ˈɑː.pə.zət saɪd əv ðə striːt/</i> (prep.phr): ở phía bên kia đường</div><div class=\"vi\"><span class=\"vn\">75.</span> <b>pavement</b> <i class=\"ph\">/ˈpeɪvmənt/</i> (u.n) = <b>sidewalk</b> <i class=\"ph\">/ˈsaɪdwɔːk/</i> (c.n): vỉa hè, đường dành cho người đi bộ</div><div class=\"vi\"><span class=\"vn\">76.</span> <b>feature</b> <i class=\"ph\">/ˈfiː.tʃɚ/</i> (v): bao gồm (tiện ích, tính năng)</div><div class=\"vi\"><span class=\"vn\">77.</span> <b>entrance</b> <i class=\"ph\">/ˈen.trəns/</i> (n): lối vào, cổng vào</div><div class=\"vi sub\"><b>– free entry</b> <i class=\"ph\">/friː ˈen.tri/</i> = <b>complimentary entry</b> <i class=\"ph\">/ˌkɑːm.pləˈmen.t̬ɚ.i ˈen.tri/</i> (n.phr): vé vào cửa miễn phí</div><div class=\"vi\"><span class=\"vn\">78.</span> <b>install</b> <i class=\"ph\">/ɪnˈstɑːl/</i> (v) = <b>set up</b> <i class=\"ph\">/ˈset.ʌp/</i> (v.phr): lắp đặt</div><div class=\"vi\"><span class=\"vn\">79.</span> <b>square</b> <i class=\"ph\">/skwer/</i> (c.n): quảng trường</div><div class=\"vi\"><span class=\"vn\">80.</span> <b>car lot</b> <i class=\"ph\">/ˈkɑːr lɑːt/</i> = <b>car park</b> <i class=\"ph\">/ˈkɑːr pɑːrk/</i> (n.phr): bãi đỗ xe</div>"}, {"t": "Listening", "i": "II. Vocabulary for Listening (32 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>ancient town</b> <i class=\"ph\">/ˈeɪnʃənt taʊn/</i> (c.n): phố cổ, thị trấn cổ kính</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>ruins</b> <i class=\"ph\">/ˈruːɪnz/</i> (pl.n): tàn tích, phế tích</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>catch a boat</b> <i class=\"ph\">/kætʃ ə boʊt/</i> (v.phr): bắt tàu, đi thuyền</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>steep and rocky path</b> <i class=\"ph\">/stiːp ænd ˈrɑːki pæðz/</i> (n.phr): con đường dốc và nhiều đá</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>get</b> <b>lost</b> <i class=\"ph\">/ˈɡetɪŋ lɔːst/</i> (v.phr): bị lạc đường</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>circular</b> <i class=\"ph\">/ˈsɜːrkjələr/</i> (adj): có hình tròn, hình vòng cung</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>vehicle</b> <i class=\"ph\">/ˈviːəkl/</i> (c.n): phương tiện giao thông, xe cộ</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>region</b> <i class=\"ph\">/ˈriːdʒən/</i> (c.n): vùng, miền, khu vực</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>signpost</b> <i class=\"ph\">/ˈsaɪnpoʊst/</i> (c.n): biển chỉ dẫn, cột mốc chỉ đường</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>take in the views</b> <i class=\"ph\">/teɪk ɪn ðə vjuːz/</i> (v.phr): ngắm cảnh, thưởng ngoạn cảnh đẹp</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>be situated</b> <i class=\"ph\">/bi ˈsɪtʃueɪtɪd/</i> (v.phr): nằm ở vị trí, tọa lạc tại</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>hunting lodge</b> <i class=\"ph\">/ˈhʌntɪŋ lɑːdʒ/</i> (c.n): nhà nghỉ săn bắn</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>convert into</b> <i class=\"ph\">/kənˈvɜːrt ˈɪntə/</i> (v.phr): chuyển đổi thành, biến thành</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>to the + direction + of sth</b> <i class=\"ph\">/tu ðə daɪˈrekʃn əv ˈsʌmθɪŋ/</i> (prep.phr): về phía [hướng] của cái gì</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>boundary</b> <i class=\"ph\">/ˈbaʊndri/</i> (c.n): ranh giới, đường biên giới</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>in the + direction + corner</b> <i class=\"ph\">/ɪn ðə daɪˈrekʃn ˈkɔːrnər/</i> (prep.phr): ở góc phía [hướng]</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>approach</b> <i class=\"ph\">/əˈproʊtʃ/</i> = <b>access</b> <i class=\"ph\">/ˈækses/</i> (v): tiếp cận</div><div class=\"vi sub\"><b>– accessible</b> <i class=\"ph\">/əkˈsesəbl/</i> (adj): có thể tiếp cận được</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>be connected to sth</b> <i class=\"ph\">/bi kəˈnektɪd tu ˈsʌmθɪŋ/</i> (v.phr): được kết nối với cái gì, nối liền với cái gì</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>castle</b> <i class=\"ph\">/ˈkæsl/</i> (c.n): lâu đài</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>carry out</b> <i class=\"ph\">/ˌkæri ˈaʊt/</i> (v.phr): tiến hành, thực hiện</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>construct</b> <i class=\"ph\">/kənˈstrʌkt/</i> (v): xây dựng</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>historical figure</b> <i class=\"ph\">/hɪˈstɔːrɪkl ˈfɪɡjər/</i> (c.n): nhân vật lịch sử</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>conservatory</b> <i class=\"ph\">/kənˈsɜːrvətɔːri/</i> (c.n): nhà kính trồng cây, nhạc viện</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>run down</b> <i class=\"ph\">/ˌrʌn ˈdaʊn/</i> (adj / v.phr): xuống cấp, xập xệ</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>enlarge</b> <i class=\"ph\">/ɪnˈlɑːrdʒ/</i> (v) = <b>extend</b> <i class=\"ph\">/ɪkˈstend/</i> (v): mở rộng, nới rộng</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>put sth on the market</b> <i class=\"ph\">/pʊt ˈsʌmθɪŋ ɑːn ðə ˈmɑːrkɪt/</i> (v.phr): rao bán cái gì trên thị trường</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>take over</b> <i class=\"ph\">/ˌteɪk ˈoʊvər/</i> (v.phr): tiếp quản, nắm quyền</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>furniture</b> <i class=\"ph\">/ˈfɜːrnɪtʃər/</i> (u.n): đồ nội thất, đồ đạc</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>wander around</b> <i class=\"ph\">/ˈwɑːndər əˈraʊnd/</i> (v.phr): đi lang thang, đi dạo quanh</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>tower</b> <i class=\"ph\">/ˈtaʊər/</i> (c.n): tòa tháp</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>take the + ordinal number + left</b> <b>/</b> <b>right</b> <i class=\"ph\">/teɪk ðə … left / raɪt/</i> (v.phr): rẽ trái / phải ở ngã rẽ thứ</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>gift and souvenir</b> <i class=\"ph\">/ɡɪft ænd ˌsuːvəˈnɪr/</i> (n.phr): quà tặng và quà lưu niệm</div>"}, {"t": "Reading", "i": "III. Vocabulary for Reading (33 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>located</b> <i class=\"ph\">/loʊˈkeɪtɪd/</i> (adj): được đặt tại, tọa lạc ở</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>inaccessibility</b> <i class=\"ph\">/ˌɪnəkˌsesəˈbɪləti/</i> (n): sự khó tiếp cận, tính không thể tiếp cận</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>plateau</b> <i class=\"ph\">/plæˈtoʊ/</i> (n): cao nguyên</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>enclosure</b> <i class=\"ph\">/ɪnˈkloʊʒər/</i> (n): khu vực có tường / hàng rào bao quanh</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>dwelling</b> <i class=\"ph\">/ˈdwelɪŋ/</i> (n): nơi ở, chỗ ở</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>residence</b> <i class=\"ph\">/ˈrezɪdəns/</i> (n): nơi cư trú, dinh thự, nhà ở (trang trọng)</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>housing</b> <i class=\"ph\">/ˈhaʊzɪŋ/</i> (n): nhà ở (nói chung, không đếm được)</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>settlement</b> <i class=\"ph\">/ˈsetəlmənt/</i> (n): khu định cư</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>site </b><i class=\"ph\">/saɪt/</i> (n): địa điểm, di chỉ, khu vực</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>occupation</b> <i class=\"ph\">/ˌɒkjuˈpeɪʃn/</i> (u.n): sự cư trú, sự chiếm cứ (một khu vực) / (c.n): nghề nghiệp</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>coastal</b> <i class=\"ph\">/ˈkoʊstl/</i> (adj): thuộc về / nằm ven biển</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>trade route</b> <i class=\"ph\">/treɪd ruːt/</i> (n.phr): tuyến đường thương mại</div><div class=\"vi sub\"><b>–</b> <b>trade routes shifted northwards = trading paths moved northwards</b> (các con đường buôn bán dịch chuyển về phía bắc)</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>palisade</b> <i class=\"ph\">/ˌpæləˈseɪd/</i> (n): hàng rào cọc (gỗ hoặc sắt) dùng để phòng thủ</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>structure</b> <i class=\"ph\">/ˈstrʌktʃər/</i> (n): công trình, kiến trúc, cấu trúc xây dựng</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>staircase</b> <i class=\"ph\">/ˈsterkeɪs/</i> (n): cầu thang</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>the outskirts</b> <i class=\"ph\">/ˈaʊtskɜːrts/</i> (n): vùng ven, ngoại vi (của một khu vực/thành phố)</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>hilltop</b> <i class=\"ph\">/ˈhɪltɒp/</i> (n): đỉnh đồi</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>automotive</b> <i class=\"ph\">/ˌɔːtəˈmoʊtɪv/</i> (adj): thuộc về (ngành) ô tô</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>vehicle</b> <i class=\"ph\">/ˈviːəkl/</i> (c.n): phương tiện, xe cộ</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>mass production</b> <i class=\"ph\">/mæs prəˈdʌkʃn/</i> (n.phr): sản xuất hàng loạt</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>self-driving</b> <i class=\"ph\">/ˌself ˈdraɪvɪŋ/</i> (adj): tự lái, tự hành</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>driver assistance</b> <i class=\"ph\">/ˈdraɪvər əˈsɪstəns/</i> (n.phr): hệ thống hỗ trợ lái xe</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>road collision</b> <i class=\"ph\">/roʊd kəˈlɪʒn/</i> (n.phr): va chạm/tai nạn giao thông</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>mobility</b> <i class=\"ph\">/moʊˈbɪləti/</i> (u.n): khả năng di chuyển, tính di động</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>travel autonomy</b> <i class=\"ph\">/ˈtrævl ɔːˈtɒnəmi/</i> (n.phr): quyền tự chủ trong việc di chuyển</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>car-sharing</b> <i class=\"ph\">/kɑːr ˈʃerɪŋ/</i> (n): (việc) dùng chung xe</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>urban area</b> <i class=\"ph\">/ˈɜːrbən ˈeriə/</i> (n.phr): khu vực đô thị, thành thị</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>travel demand</b> <i class=\"ph\">/ˈtrævl dɪˈmɑːnd/</i> (n.phr): nhu cầu đi lại</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>vehicle ownership</b> <i class=\"ph\">/ˈviːəkl ˈoʊnərʃɪp/</i> (n.phr): quyền sở hữu xe (cá nhân)</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>mileage</b> <i class=\"ph\">/ˈmaɪlɪdʒ/</i> (u.n): quãng đường đã đi (tính theo dặm)</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>journey</b> <i class=\"ph\">/ˈdʒɜːrni/</i> (c.n): hành trình, chuyến đi</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>traffic</b> <i class=\"ph\">/ˈtræfɪk/</i> (u.n): giao thông, lưu lượng xe cộ</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>trip</b> <i class=\"ph\">/trɪp/</i> (c.n): chuyến đi (thường ngắn)</div>"}, {"t": "Speaking", "i": "III. Vocabulary for Speaking (40 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>travel by air </b><i class=\"ph\">/ˈtrævl baɪ er/</i> <b>/ road </b><i class=\"ph\">/rəʊd/</i><b> / sea </b><i class=\"ph\">/siː/</i> (V.phr): du lịch bằng đường hàng không / đường bộ / đường thủy</div><div class=\"vi sub\"><b>–</b> <b>traveler </b><i class=\"ph\">/ˈtrævlər/</i> = <b>visitor </b><i class=\"ph\">/ˈvɪzɪtər/</i> = <b>tourist </b><i class=\"ph\">/ˈtʊərɪst/</i> (c.n): khách du lịch</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>tourism </b><i class=\"ph\">/ˈtʊərɪzəm/</i>(u.n): ngành du lịch</div><div class=\"vi sub\"><b>– tourist attraction </b><i class=\"ph\">/ˈvɪzɪt ˈtʊərɪst əˈtrækʃn/</i> <b>/ destination </b><i class=\"ph\">/ˌdestɪˈneɪʃn/</i><b> / spot </b><i class=\"ph\">/spɑːt/</i><b> / site </b><i class=\"ph\">/saɪt/</i> (c.n): địa điểm du lịch</div><div class=\"vi sub\"><b>– go on a tour </b><i class=\"ph\">/ɡəʊ ɑːn ə tʊər/</i> (v.phr): đi theo tour</div><div class=\"vi sub\"><b>– package tour </b><i class=\"ph\">/ˈpækɪdʒ tʊər/</i><b> / self-guided tour </b><i class=\"ph\">/ˌself ˈɡaɪdɪd tʊər/</i> (c.n): tour trọn gói / tự túc</div><div class=\"vi sub\"><b>– touristy </b><i class=\"ph\">/ˈtʊərɪsti/</i> (adj): hút khách du lịch</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>field trip</b> <i class=\"ph\">/ˈfiːld trɪp/</i> = <b>excursion</b> <i class=\"ph\">/ɪkˈskɜːrʒn/</i> (c.n): chuyến đi dã ngoại</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>take the bus</b> <i class=\"ph\">/teɪk ðə bʌs/</i> / <b>train</b> <i class=\"ph\">/treɪn/</i> / <b>taxi</b> <i class=\"ph\">/ˈtæksi/</i> (V.phr): bắt xe buýt / tàu / taxi</div><div class=\"vi sub\"><b>–</b> <b>bus passenger</b> <i class=\"ph\">/ˈbʌs pæsɪndʒər/</i> / <b>train passenger</b> <i class=\"ph\">/ˈtreɪn pæsɪndʒər/</i> (c.n): hành khách đi xe buýt / tàu</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>get seasick</b> <i class=\"ph\">/ɡet ˈsiːsɪk/</i> / <b>get carsick</b> <i class=\"ph\">/ɡet ˈkɑːrsɪk/</i> (v.phr): bị say sóng / bị say xe</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>wander around</b> <i class=\"ph\">/ˈwɑːndər əˈraʊnd/</i> (v.phr): đi lang thang, đi dạo quanh</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>enjoy the local cuisine</b> <i class=\"ph\">/ɪnˈdʒɔɪ ðə ˈləʊkl kwɪˈziːn/</i> / <b>local delicacies</b> <i class=\"ph\">/ˈləʊkl ˈdelɪkəsiz/</i> / <b>culinary delights</b> <i class=\"ph\">/ˈkʌlɪnəri dɪˈlaɪts/</i> (v.phr): thưởng thức ẩm thực / đặc sản / món ngon địa phương</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>visit iconic landmarks</b> <i class=\"ph\">/ˈvɪzɪt aɪˈkɒnɪk ˈlændmɑːrks/</i> / <b>monuments</b> <i class=\"ph\">/ˈmɑːnjumənts/</i> (v.phr): ghé thăm các danh lam thắng cảnh / đài tưởng niệm nổi tiếng</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>get away from it all </b><i class=\"ph\">/ɡet əˈweɪ frəm ɪt ɔːl/</i> (v.phr): thoát khỏi nhịp sống thường nhật / đi nghỉ xả stress</div><div class=\"vi sub\"><b>– a getaway </b><i class=\"ph\">/ə ˈɡetəweɪ/</i> (c.n): chuyến đi nghỉ ngắn ngày / nơi nghỉ dưỡng</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>off-the-beaten-track </b><i class=\"ph\">/ˌɒf ðə ˌbiːtn ˈtræk/</i> (adj): hẻo lánh, xa xôi, ít người biết đến</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>soak up the atmosphere </b><i class=\"ph\">/səʊk ʌp ðə ˈætməsfɪər/</i><b> / local culture</b> <i class=\"ph\">/ˈləʊkl ˈkʌltʃər/</i> (v.phr): đắm mình vào không khí / văn hóa địa phương</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>spontaneous </b><i class=\"ph\">/spɒnˈteɪniəs/</i> (adj): tự phát, ngẫu hứng, không lên kế hoạch trước</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>arrive </b><i class=\"ph\">/əˈraɪv/</i><b> in + a city / a country </b>(v): đến</div><div class=\"vi sub\"><b>– arrive </b><i class=\"ph\">/əˈraɪv/</i><b> at + a place </b>(v): đến</div><div class=\"vi sub\"><b>– arrival </b><i class=\"ph\">/əˈraɪvl/</i> (u.n / c.n): sự đến, sự cập bến (hoặc khu vực sảnh đến ở sân bay/nhà ga)</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>depart from... to... </b><i class=\"ph\">/dɪˈpɑːrt frəm... tuː.../</i> (v): khởi hành/rời từ... đến…</div><div class=\"vi sub\"><b>– departure</b> <i class=\"ph\">/dɪˈpɑːrtʃər/</i> (u.n / c.n): sự khởi hành, sự ra đi (hoặc khu vực sảnh đi ở sân bay/nhà ga)</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>navigate</b> <i class=\"ph\">/ˈnævɪɡeɪt/</i> (v): tìm đường, định hướng</div><div class=\"vi sub\"><b>– navigation app</b> <i class=\"ph\">/ˌnævɪˈɡeɪʃn æp/</i> (c.n): ứng dụng chỉ đường, ứng dụng định vị (như google maps)</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>get lost</b> <i class=\"ph\">/ɡet lɒst/</i> (v.phr): bị lạc</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>the countryside </b><i class=\"ph\">/ðə ˈkʌn.tri.saɪd/</i> =<b> rural area </b><i class=\"ph\">/ˈrʊr.əl ˈer.i.ə/</i> (n.phr): vùng nông thôn, miền quê</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>punctual</b> <i class=\"ph\">/ˈpʌŋktʃuəl/</i> (adj): đúng giờ</div><div class=\"vi sub\"><b>– punctuality</b> <i class=\"ph\">/ˌpʌŋktʃuˈæləti/</i> (u.n): tính đúng giờ, sự đúng giờ</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>delay</b> <i class=\"ph\">/dɪˈleɪ/</i> = <b>postpone</b> <i class=\"ph\">/pəˈspəʊn/</i> (v) = <b>put off</b> <i class=\"ph\">/pʊt ɒf/</i> (v.phr): trì hoãn, làm chậm trễ</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>means / mode of transportation</b> <i class=\"ph\">/miːnz / məʊd əv ˌtrænspɔːrˈteɪʃn/</i> (c.n): phương tiện giao thông</div><div class=\"vi sub\"><b>– public transport</b> <i class=\"ph\">/ˈpʌblɪk ˈtrænspɔːrt/</i> (c.n): phương tiện giao thông công cộng</div><div class=\"vi sub\"><b>– private transport</b> <i class=\"ph\">/ˈpraɪvət ˈtrænspɔːrt/</i> = <b>personal vehicle</b> <i class=\"ph\">/ˈpɜːrsənl ˈviːəkl/</i> (c.n): phương tiện giao thông cá nhân</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>holiday</b> <i class=\"ph\">/ˈhɒlədeɪ/</i> (c.n): kỳ nghỉ lễ</div><div class=\"vi sub\"><b>– go on holiday</b> <i class=\"ph\">/ɡəʊ ɒn ˈhɒlədeɪ/</i> (V.phr): đi nghỉ lễ</div><div class=\"vi sub\"><b>– public holiday</b> <i class=\"ph\">/ˈpʌblɪk ˈhɒlədeɪ/</i> / <b>national holiday</b> <i class=\"ph\">/ˈnæʃnəl ˈhɒlədeɪ/</i> (c.n): ngày lễ công cộng / quốc lễ</div><div class=\"vi sub\"><b>– holiday season</b> <i class=\"ph\">/ˈhɒlədeɪ ˈsiːzn/</i> (c.n): mùa nghỉ lễ, mùa du lịch</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>housing</b> <i class=\"ph\">/ˈhaʊzɪŋ/</i> (u.n) = <b>accommodation</b> <i class=\"ph\">/əˌkɒməˈdeɪʃn/</i> (u.n): nhà ở, chỗ ở</div><div class=\"vi sub\"><b>– townhouse</b> <i class=\"ph\">/ˈtaʊnhaʊs/</i> (c.n): nhà phố</div><div class=\"vi sub\"><b>– subpar accommodation</b> <i class=\"ph\">/ˌsʌbˈpɑːr əˌkɒməˈdeɪʃn/</i> (n): chỗ ở kém chất lượng, không đạt tiêu chuẩn</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>home appliances</b> <i class=\"ph\">/həʊm əˈplaɪəns/</i> / <b>amenities</b> <i class=\"ph\">/əˈmiːnəti/</i> (c.n): thiết bị, đồ gia dụng</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>spacious</b> <i class=\"ph\">/ˈspeɪʃəs/</i> = <b>roomy</b> <i class=\"ph\">/ˈruːmi/</i> (adj): rộng rãi</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>cozy</b> <i class=\"ph\">/ˈkəʊzi/</i> (adj) = <b>snug and comfy</b> <i class=\"ph\">/snʌɡ ænd ˈkʌmfi/</i> (adj): ấm cúng và thoải mái</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>be born and bred</b> <i class=\"ph\">/biː bɔːrn ənd bred/</i> (V.phr): sinh ra và lớn lên (ở một nơi nào đó)</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>furniture</b> <i class=\"ph\">/ˈfɜːrnɪtʃər/</i> (u.n): nội thất, đồ đạc</div><div class=\"vi sub\"><b>– fully-furnished</b> <i class=\"ph\">/ˌfʊli ˈfɜːrnɪʃt/</i> (adj): được trang bị đầy đủ nội thất</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>in the heart of the city</b> <i class=\"ph\">/ɪn ðə hɑːrt əv ðə ˈsɪti/</i> (prep) = <b>downtown</b> <i class=\"ph\">/ˌdaʊnˈtaʊn/</i> (adj / adv): ở trung tâm thành phố</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>sanctuary </b><i class=\"ph\">/ˈsæŋktʃuəri/</i>(c.n): nơi trú ẩn, nơi bình yên</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>available</b> <i class=\"ph\">/əˈveɪləbl/</i> (adj): có sẵn, sẵn có, khả dụng</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>unfortunately</b> <i class=\"ph\">/ʌnˈfɔːrtʃənətli/</i> (adv): xui xẻo thay, không may thay, thật đáng tiếc</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>overbooked</b> <i class=\"ph\">/ˌəʊvərˈbʊkt/</i> (adj): bị đặt quá số lượng phòng sẵn có</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>meet hygiene standards</b> / miːt ˈhaɪdʒiːn ˈstændərdz/ (c.n): tiêu chuẩn vệ sinh</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>unprofessional service </b><i class=\"ph\">/ˌʌnpɾəˈfeʃənl ˈsɜːrvɪs/</i> (u.n): dịch vụ thiếu chuyên nghiệp</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>poor customer care </b><i class=\"ph\">/pʊr ˈkʌstəmər ker/</i> (u.n): chăm sóc khách hàng kém</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>demand a full refund</b> <i class=\"ph\">/dɪˈmænd ə fʊl ˈriːfʌnd/</i> / <b>compensation /</b>ˌkɑːmpenˈseɪʃn/ (v.phr): yêu cầu hoàn tiền toàn bộ / bồi thường</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>ruin the mood</b> <i class=\"ph\">/ˈruːɪn ðə muːd/</i> (v.phr): làm hỏng tâm trạng / tụt mood</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>a blessing in disguise</b> <i class=\"ph\">/ə ˈblesɪŋ ɪn dɪsˈɡaɪz/</i> (idm): trong cái rủi có cái may</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>take something with a grain of salt</b> <i class=\"ph\">/teɪk wɪð ə ɡreɪn əv sɔːlt/</i> (idm): tiếp nhận thông tin một cách bán tin bán nghi (không tin hoàn toàn, ví dụ như review trên mạng)</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>word-of-mouth recommendation</b> <i class=\"ph\">/wɜːrd əv maʊθ ˌrekəmənˈdeɪʃn/</i> (c.n): lời giới thiệu truyền miệng (từ người thân, bạn bè)</div>"}, {"t": "Writing", "i": "IV. Vocabulary for Writing (51 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>common room</b> <i class=\"ph\">/ˈkɑː.mən ruːm/</i> (n.phr): phòng sinh hoạt chung</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>cupboard</b> <i class=\"ph\">/ˈkʌb.ɚd/</i> (c.n): tủ chén bát, tủ chạn</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>sink</b> <i class=\"ph\">/sɪŋk/</i> (c.n): bồn rửa</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>bench</b> <i class=\"ph\">/bentʃ/</i> (c.n): ghế dài, bàn làm việc dài</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>refrigerator</b> <i class=\"ph\">/rɪˈfrɪdʒ.ə.reɪ.t̬ɚ/</i> = <b>fridge</b> <i class=\"ph\">/frɪdʒ/</i> (c.n): tủ lạnh</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>entrance</b> <i class=\"ph\">/ˈen.trəns/</i> (n): lối vào, cổng vào</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>closet</b> <i class=\"ph\">/ˈklɑː.zət/</i> (c.n): tủ quần áo, tủ âm tường</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>locker</b> <i class=\"ph\">/ˈlɑː.kɚ/</i> (c.n): tủ có khóa (dành cho cá nhân)</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>remain unchanged</b> <i class=\"ph\">/rɪˈmeɪn ʌnˈtʃeɪndʒd/</i> = <b>stay the same</b> <i class=\"ph\">/steɪ ðə seɪm/</i> (v.phr): giữ nguyên không đổi</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>upgrade</b> <i class=\"ph\">/ˌʌpˈɡreɪd/</i> = <b>renovate</b> <i class=\"ph\">/ˈren.ə.veɪt/</i> (v): nâng cấp, cải tạo</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>kitchen unit</b> <i class=\"ph\">/ˈkɪtʃ.ən ˌjuː.nɪt/</i> (n.phr): bộ tủ kệ bếp</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>line up in succession</b> <i class=\"ph\">/laɪn ʌp ɪn səkˈseʃ.ən/</i> (v.phr): xếp hàng nối tiếp nhau</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>original</b> <i class=\"ph\">/əˈrɪdʒ.ən.əl/</i> (adj): ban đầu, gốc</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>install</b> <i class=\"ph\">/ɪnˈstɑːl/</i> (v): lắp đặt</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>replace</b> <i class=\"ph\">/rɪˈpleɪs/</i> = <b>substitute</b> <i class=\"ph\">/ˈsʌb.stə.tuːt/</i> (v): thay thế</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>feature</b> <i class=\"ph\">/ˈfiː.tʃɚ/</i> (v): bao gồm (tiện ích, tính năng)</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>expand</b> <i class=\"ph\">/ɪkˈspænd/</i> (v): mở rộng (diện tích)</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>in the north / south / east / west / center</b> /ɪn ðə nɔːθ /saʊθ /iːst /west <i class=\"ph\">/ˈsentə(r)/</i> (prep.phr): ở phía bắc / nam / đông / tây / trung tâm</div><div class=\"vi sub\"><b>– northern </b><i class=\"ph\">/ˈnɔːðən/</i> <b>/ southern </b><i class=\"ph\">/ˈsʌðən/</i> <b>/ eastern </b><i class=\"ph\">/ˈiːstən/</i><b>/ western </b><i class=\"ph\">/ˈwestən/</i><b>/ central</b> <i class=\"ph\">/ˈsentrəl/</i> (adj): thuộc về phía bắc / nam / đông / tây / trung tâm</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>along</b> <i class=\"ph\">/əˈlɒŋ/</i> (prep): dọc theo</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>construct</b> <i class=\"ph\">/kənˈstrʌkt/</i> = <b>build</b> <i class=\"ph\">/bɪld/</i> (v): xây dựng, xây mới</div><div class=\"vi sub\"><b>– construction</b> <i class=\"ph\">/kənˈstrʌkʃn/</i> (c.n): sự xây dựng, công trình</div><div class=\"vi sub\"><b>– newly built / constructed</b> <i class=\"ph\">/ˈnjuːli bɪlt/</i> / <i class=\"ph\">/kənˈstrʌktɪd/</i> (adj): mới được xây dựng</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>extend</b> <i class=\"ph\">/ɪkˈstend/</i> = <b>enlarge</b> <i class=\"ph\">/ɪnˈlɑːdʒ/</i> = <b>grow in size</b> <i class=\"ph\">/ɡrəʊ ɪn saɪz/</i> (v): mở rộng (diện tích)</div><div class=\"vi sub\"><b>– extension</b> <i class=\"ph\">/ɪkˈstenʃn/</i> = <b>enlargement</b> <i class=\"ph\">/ɪnˈlɑːdʒmənt/</i> = <b>growth in size</b> <i class=\"ph\">/ɡrəʊθ ɪn saɪz/</i> (c.n): sự mở rộng</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>demolish</b> <i class=\"ph\">/dɪˈmɒlɪʃ/</i> = <b>remove</b> <i class=\"ph\">/rɪˈmuːv/</i> (v): loại bỏ, phá dỡ</div><div class=\"vi sub\"><b>– demolition</b> <i class=\"ph\">/ˌdeməˈlɪʃn/</i> = <b>removal</b> <i class=\"ph\">/rɪˈmuːvl/</i> (c.n): sự xoá bỏ, phá dỡ</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>infrastructure</b> <i class=\"ph\">/ˈɪnfrəstrʌktʃə(r)/</i> (u.n/c.n): cơ sở hạ tầng</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>modification</b> <i class=\"ph\">/ˌmɒdɪfɪˈkeɪʃn/</i> = <b>change</b> <i class=\"ph\">/tʃeɪndʒ/</i> (c.n): sự thay đổi, sửa đổi</div><div class=\"vi sub\"><b>– undergo change</b> <i class=\"ph\">/ˌʌndəˈɡəʊ tʃeɪndʒ/</i> = <b>experience modification</b> <i class=\"ph\">/ɪkˈspɪəriəns ˌmɒdɪfɪˈkeɪʃn/</i> (v.phr): trải qua sự thay đổi</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>minor</b> <i class=\"ph\">/ˈmaɪnə(r)/</i> (adj): nhỏ, không đáng kể</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>major</b> <i class=\"ph\">/ˈmeɪdʒə(r)/</i> (adj): lớn, chủ yếu, quan trọng</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>split</b> <b>/ divide sth into … (smaller) parts</b> <i class=\"ph\">/splɪt / dɪˈvaɪd ˈɪntə pɑːts/</i> (v.phr): chia / tách cái gì thành các phần (nhỏ hơn)</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>accommodate</b> <i class=\"ph\">/əˈkɒmədeɪt/</i> (v): chứa, cung cấp chỗ ở / không gian cho</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>body of water</b> <i class=\"ph\">/ˈbɒdi əv ˈwɔːtə(r)/</i> (c.n): vùng nước (hồ, sông, biển...)</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>branch off</b> <i class=\"ph\">/brɑːntʃ ɒf/</i> (v.phr): rẽ nhánh, tách nhánh</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>dam</b> <i class=\"ph\">/dæm/</i> (c.n): đập thủy điện / đập ngăn nước</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>the outskirts</b> <i class=\"ph\">/ðə ˈaʊtskɜːts/</i> = <b>the suburbs </b><i class=\"ph\">/ðə ˈsʌbɜːbz/</i> = <b>suburban area / region</b> <i class=\"ph\">/səˈbɜːbən ˈeəriə/</i> / <i class=\"ph\">/ˈriːdʒən/</i> (n.phr): vùng ngoại ô, khu vực ven thành phố</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>road system</b> <i class=\"ph\">/rəʊd ˈsɪstəm/</i> (c.n): hệ thống giao thông đường bộ</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>in the vicinity of sth</b> <i class=\"ph\">/ɪn ðə vəˈsɪnəti əv/</i> (prep.phr): ở khu vực lân cận, gần kề</div><h3>PRACTICE 3</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>stable</b> <i class=\"ph\">/ˈsteɪbl/</i> (c.n): chuồng ngựa</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>square</b> <i class=\"ph\">/skwer/</i> (c.n): quảng trường</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>replacement</b> <i class=\"ph\">/rɪˈpleɪsmənt/</i> (c.n): sự thay thế</div><div class=\"vi sub\"><b>– in place of sth </b><i class=\"ph\">/ɪn pleɪs əv/</i> (prep.phr): thay cho, thế vào chỗ</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>upgrade</b> <i class=\"ph\">/ˈʌpɡreɪd/</i> = <b>renovation</b> <i class=\"ph\">/ˌren.əˈveɪ.ʃən/</i> (c.n): sự nâng cấp, sự cải tạo</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>the others</b> <i class=\"ph\">/ði ˈʌðəz/</i> = <b>the other parts / regions / areas</b> <i class=\"ph\">/ði ˈʌðə pɑːts/</i> <i class=\"ph\">/ˈriːdʒənz/</i> <i class=\"ph\">/ˈeəriəz/</i> (n.phr): những phần / khu vực còn lại</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>lane</b> <i class=\"ph\">/leɪn/</i> (c.n): làn đường</div><div clas
