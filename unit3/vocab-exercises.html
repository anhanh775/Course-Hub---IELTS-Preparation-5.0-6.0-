n[[A close circle of friends]] usually consists of people who know and trust one another well.|a strong social network|a wide network of acquaintances|a close-knit group|a meaningful friendship|1\nIf two people [[have a lot in common]], they share similar interests, experiences, or characteristics.|have a strong bond|have nothing in common|get along well|enjoy each other's company|1"}, {"t": "Exercise 3", "k": "w", "i": "Complete the crossword using the clues below.", "w": [["support", 0, 0, "A", 8], ["robot", 0, 5, "D", 3], ["selfish", 1, 8, "A", 10], ["social", 1, 8, "D", 4], ["bond", 3, 3, "D", 2], ["reliable", 3, 10, "A", 9], ["optimize", 4, 3, "A", 1], ["restrict", 3, 10, "D", 5], ["exploit", 8, 5, "A", 6], ["ethical", 10, 9, "A", 7]], "cl": ["<div style=\"margin:3px 0\">1. To make something work as effectively as possible or to improve its performance.</div><div style=\"margin:3px 0\">6. To use something, especially a resource or situation, in order to gain a benefit from it.</div><div style=\"margin:3px 0\">7. Related to principles of what is right and wrong, especially in the way people behave or use technology.</div><div style=\"margin:3px 0\">8. Help or assistance given to someone who needs it.</div><div style=\"margin:3px 0\">9. Able to be trusted to work well or behave consistently.</div><div style=\"margin:3px 0\">10. Caring mainly about your own needs and interests rather than those of other people.</div>", "<div style=\"margin:3px 0\">2. A strong emotional or social connection that develops between people through shared experiences, trust, or mutual understanding.</div><div style=\"margin:3px 0\">3. A programmable machine designed to carry out tasks automatically, often performing actions that would otherwise require human effort.</div><div style=\"margin:3px 0\">4. Related to society, interaction with other people, or community life.</div><div style=\"margin:3px 0\">5. To limit or control something, especially by setting rules or restrictions.</div>"]}, {"t": "Exercise 4 (A)", "k": "m", "i": "Choose the word or phrase CLOSEST in meaning to the underlined text.", "d": "Some futurologists [[envisage]] a future in which autonomous cars completely replace human drivers, but I think that is still a long way off.|rule out|design|predict|envy|2\nIn some areas, machine intelligence has already [[outstripped]] human ability, for example in playing chess or processing huge amounts of data.|fallen behind|copied|stripped|gone beyond|3\nMy grandparents are rather [[skeptical]] about online friendships because they believe you can't build a deep connection without face-to-face contact.|enthusiastic|doubtful|careless|jealous|1\nSome teenagers post photos constantly because they seek [[affirmation]] from their followers, which can boost their self-esteem in the short term.|approval|criticism|privacy|confirmation|0\nParents should restrict access to certain websites because [[malicious]] software can steal personal data without users even noticing.|harmless|outdated|harmful|unknown|2\nMy sister is very [[tolerant]] of other people's habits, so she rarely falls out with her roommates even when they are messy.|accepting|critical|envious|fond|0\nMany science fiction films show a [[dystopian]] future in which robots gain supremacy over humans and people lose their freedom.|perfect and peaceful|very bad and frightening|highly advanced|distant|1\nChildren who receive enough parental attention tend to become [[well-adjusted]] adults who can handle stress and get along with others easily.|anxious and insecure|highly educated|well-dressed|emotionally stable|3\nModern smartphones have become so [[sophisticated]] that older users often struggle to exploit all their facilities.|simple|portable|complex and advanced|fashionable|2\nAlthough my roommate and I have very different personality traits, we have learned to co-exist [[amicably]] by respecting each other's space.|aggressively|peacefully|independently|admirably|1"}, {"t": "Exercise 4 (B)", "k": "t", "i": "Write the word OPPOSITE in meaning to the underlined text (the first letter is given).", "d": "My younger brother is quite <u>extroverted</u>, just like our father.<br>→ i_ __ __ __ __ _|-|introverted\nThe article discusses the <u>ethical</u> use of artificial intelligence in schools.<br>→ u_ __ __ __ _|-|unethical\nEveryone in my class knows that he is <u>unreliable</u> when it comes to group projects.<br>→ d_ __ __ __ _ _|-|dependable\nThe long-term effects of AI on the job market are fairly <u>predictable</u>.<br>→ u_ __ __ __ __ __ _|-|unpredictable\nMost of the contacts on my Facebook account are <u>close friends</u>.<br>→ w_ _ _  t_ _ _|-|weak ties\nFree users have <u>unlimited</u> access to all of the app's features.<br>→ r_ __ __ __ _ _|-|restricted\nMy manager has a very <u>flexible</u> attitude towards working from home.<br>→ i_ __ __ __ _ _|-|inflexible\nYoung children often treat their toys as <u>living things</u>.<br>→ i_ __ __ _ _  o_ __ __ _ _|-|inanimate objects\nOur teacher encourages us to <u>compete</u> with each other during group activities.<br>→ c_ __ __ __ __ _|-|collaborate/cooperate/co-operate\nMost of the videos my brother watches online are quite <u>serious</u>.<br>→ f_ __ __ __ _|-|frivolous"}, {"t": "Exercise 5", "k": "t", "err": 1, "i": "Find the error (spelling, word use, word form) in each sentence and type the corrected word/phrase.", "d": "Many teenagers today are addicted with online games and spend hours playing them every night.|addicted with|addicted to/to\nI have known my best friend for ten years, and our friendship is based on mutually respect.|mutually respect|mutual respect/mutual\nMy grandparents still use an obselete mobile phone that can only make calls and send texts.|obselete|obsolete\nTalking to close friends helps me win personal hardships and feel less stressed.|win|overcome/get over/get through\nYoung children who are exposed with screens too early may find it hard to concentrate, especially when games are so addictive.|exposed with|exposed to/to\nI think reliable is the most important quality in a true friend because I need someone I can turn to when things go wrong.|reliable|reliability\nThanks to instant messaging, I no longer miss touch with my friends from high school, even though we now live in different cities.|miss touch|lose touch/lose\nWith a smartphone, I can access to information in real time wherever I am, which is really useful for my studies at university.|access to information|access information/access\nMy younger brother and I used to argue a lot, but now we get on well to each other and rarely fall out with each other.|get on well to each other|get on well with each other/with\nLast summer, I decided to make a digital detox for a week, and I was surprised by how much time I used to waste on frivolous videos.|make a digital detox|do a digital detox/go on a digital detox/have a digital detox/take a digital detox/do/go on/have/take\nIn a close-knit family like mine, everyone cherishes each other, so when my father lost his job, we could rely on relatives who provided us with finance support.|finance support|financial support/financial\nAlthough I'm not very technology-literate, I've gradually got used with smartphones, and now I use a range of user-friendly apps to optimize my daily schedule.|got used with|got used to/used to/to\nSocial media makes it easy to stay in touch with a large social circle, but in-person interaction is still essential if you want to build a meaningless relationship with someone.|meaningless relationship|meaningful relationship/meaningful\nMy roommate is quite selfish, but I've learned to be tolerant and put up for his bad habits, so we now co-exist amicably in our small apartment.|put up for|put up with/with\nMany people worry that artificial intelligence will take over their jobs, but I believe it can also offer cost-effective and innovation solutions to everyday problems, as long as people know how to use it wisely.|innovation solutions|innovative solutions/innovative"}, {"t": "Exercise 6 (P1)", "k": "b", "box": "addictive/all-purpose/in real time/latest/old-fashioned/store/take over/tech-savvy/user-friendly/virtual reality", "i": "Fill in the blank with the correct word from the box.", "d": "<b>What piece of technology do you use most often?</b><br>It's definitely my smartphone. It's an _____ device because I use it for studying, online banking, taking photos and even paying for my coffee.|all-purpose\n<b>How easy is it for you to learn new features?</b><br>Pretty straigtforward, actually. I'm quite _____, so I can usually figure out all the new features within a day without reading any instructions.|tech-savvy\n<b>What do you like about reading on a digital device?</b><br>I prefer e-readers because they can _____ hundreds of books, so I don't have to carry a heavy bag full of books when I travel.|store\n<b>Have you ever spent a whole day without your phone/computer?</b><br>Yes, once. I turned off my phone for a whole weekend and realised how _____ social media is, because I kept reaching for my phone every few minutes.|addictive\n<b>Why would you like technology or AI to handle housework for you?</b><br>I'd love a robot to _____ all my household chores, like cooking and cleaning, so I could spend more time on my hobbies.|take over\n<b>Are your parents good at using new apps?</b><br>Not really. They find new apps quite confusing, so I always install ones that are _____, with large icons and simple menus.|user-friendly\n<b>Do you still keep any old gadgets at home?</b><br>Yes, I still keep my grandfather's radio. It looks a bit _____ now, but it still works perfectly, so I sometimes listen to the news on it.|old-fashioned\n<b>How do you usually keep up with the news?</b><br>I mostly read the news on my phone because I can get updates _____, so I know what's happening almost as soon as it happens.|in real time\n<b>Do you like buying new gadgets?</b><br>Not really. I don't think I need the _____ phone model every year, especially when my current one still works well and does everything I need.|latest\n<b>Is there any new technology you'd like to try?</b><br>Yes, I'd love to try _____ games because they make you feel like you're actually inside the game world, which sounds really exciting.|virtual reality"}, {"t": "Exercise 6 (P2)", "k": "b", "box": "a lot in common/close circle/close-knit/face-to-face/fell out with/lost touch/open up to/reliable/sibling rivalry/turn to", "i": "Fill in the blank with the correct word from the box.", "d": "<b>Do you prefer talking in-person or texting?</b><br>I prefer talking _____ because I can understand people's feelings and reactions better. However, I often text when my friends are not nearby.|face-to-face\n<b>What do you usually do when you spend time with your close friends?</b><br>I usually go out for coffee, chat, or watch movies with my friends. Since we have _____, we rarely run out of things to talk about.|a lot in common\n<b>Is it easy for you to make friends with new people?</b><br>Not really, because I tend to have a _____ of friends rather than meet lots of new people. However, I can become quite sociable once I get to know someone.|close circle\n<b>How important is honesty in maintaining a good relationship?</b><br>I think honesty is essential because it helps people trust each other. A _____ friend should be honest, even when the truth is difficult to hear.|reliable\n<b>What can cause friendships to become stronger?</b><br>I think going through difficult experiences together can make friendships stronger. When problems arise, people often _____ their close friends for support.|turn to\n<b>Do you often argue with your friends?</b><br>Not often. Last year I _____ my best friend over a small misunderstanding, but we made up after a few days.|fell out with\n<b>Do you find it easy to share your feelings?</b><br>Not really. I find it hard to _____ other people about my feelings, so I usually icism about sth</b> <i class=\"ph\">/ˈskeptɪsɪzəm əˈbaʊt/</i> (u.n): sự nghi ngờ, hoài nghi</div><div class=\"vi sub\"><b>– doubt</b> <i class=\"ph\">/daʊt/</i> (v): nghi ngờ</div><div class=\"vi sub\"><b>– raise doubts</b> <i class=\"ph\">/reɪz daʊts/</i> = <b>cast doubt on</b> <b>sth</b> <i class=\"ph\">/kɑːst daʊt ɒn/</i> (v.phr): gây ra, làm dấy lên sự nghi ngờ</div><div class=\"vi sub\"><b>– have doubts about sth</b> <i class=\"ph\">/hæv daʊts əˈbaʊt ˈsʌmθɪŋ/</i> (v.phr): = <b>skeptical about / of sth</b> /bi ˈskeptɪkl əˈbaʊt/ (adj): nghi ngờ, không chắc chắn về điều gì đó</div><div class=\"vi sub\"><b>–</b> <b>take a skeptical line</b> <i class=\"ph\">/teɪk ə ˈskeptɪkl laɪn/</i> (v.phr): giữ lập trường hoài nghi</div><div class=\"vi sub\"><b>– there is little doubt that </b><i class=\"ph\">/daʊt/</i>:hầu như chắc chắn rằng</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>tolerant </b><i class=\"ph\">/ˈtɒlərənt/</i> (adj) = <b>put up with sb </b><i class=\"ph\">/pʊt ʌp wɪð/</i> (v.phr):khoan dung, biết chịu đựng</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>envious of sb / sth </b><i class=\"ph\">/ˈenviəs əv/</i> = <b>jealous of sb / sth </b>/ˈdʒeləs əv / (adj.phr):ghen tị với</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>loner </b><i class=\"ph\">/ˈləʊnə/</i> (c.n): người khép mình, thích ở một mình</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>nature versus nurture </b><i class=\"ph\">/ˈnɜːtʃə ˈvɜːsəs ˈneɪtʃə/</i> (n.phr):môi trường nuôi dạy so với yếu tố bẩm sinh</div><div class=\"vi\"><span class=\"vn\">27.</span> <b>weak tie</b> <b>(contact)</b> <i class=\"ph\">/wiːk taɪ (ˈkɒntækt)/</i> (n.phr) = <b>(casual / loose) acquaintance</b> <i class=\"ph\">/( ˈkæʒuəl/</i> luːs) əˈkweɪntəns/ (n.phr): người quen qua loa, không thân thiết</div><div class=\"vi sub\"><b>– get used to V-ing</b> <i class=\"ph\">/ɡet juːst tuː/</i> = <b>get acquainted with sb / sth <i class=\"ph\">/ɡet əˈkweɪntɪd wɪð/</i> </b>= <b>get accustomed to</b> </i> = <b>limit </b><i class=\"ph\">/ˈlɪmɪt/</i> = <b>hinder</b> <i class=\"ph\">/ˈhɪndə/</i> = <b>impede</b> <i class=\"ph\">/ɪmˈpiːd/</i> = <b>obstruct</b> <i class=\"ph\">/əbˈstrʌkt/</i> (v): hạn chế, cản trở</div><div class=\"vi sub\"><b>– restriction</b> <i class=\"ph\">/rɪˈstrɪkʃn/</i> (c.n): sự hạn chế</div><div class=\"vi sub\"><b>– restricted</b> <i class=\"ph\">/rɪˈstrɪktɪd/</i> (adj): bị hạn chế</div><div class=\"vi sub\"><b>– limitation</b> <i class=\"ph\">/ˌlɪmɪˈteɪʃn/</i> (c.n): sự giới hạn</div><div class=\"vi sub\"><b>– limited</b> <i class=\"ph\">/ˈlɪmɪtɪd/</i> (adj): có giới hạn</div><div class=\"vi sub\"><b>– restrict access to sth </b><i class=\"ph\">/rɪˈstrɪkt ˈækses tuː/</i> (v.phr): hạn chế quyền truy cập vào cái gì</div><div class=\"vi\"><span class=\"vn\">56.</span> <b>envisage</b> <i class=\"ph\">/ɪnˈvɪzɪdʒ/</i> (v) = <b>predict</b> <i class=\"ph\">/prɪˈdɪkt/</i> = <b>anticipate </b><i class=\"ph\">/ænˈtɪsɪpeɪt/</i> =<b> expect </b><i class=\"ph\">/ɪkˈspekt/</i>(v): tiên đoán, hình dung trước</div><div class=\"vi sub\"><b>– prediction</b> <i class=\"ph\">/prɪˈdɪkʃn/</i> = <b>expectation</b> <i class=\"ph\">/ˌekspekˈteɪʃn/</i> = <b>forecast</b> <i class=\"ph\">/ˈfɔːkɑːst/</i> = <b>anticipation</b> <i class=\"ph\">/ænˌtɪsɪˈpeɪʃn/</i> (u.n): sự dự đoán, sự dự liệu</div><div class=\"vi sub\"><b>– predictable </b><i class=\"ph\">/prɪˈdɪktəbl/</i> =<b> expected </b><i class=\"ph\">/ɪkˈspektɪd/</i> (adj): có thể đoán trước; được dự kiến</div><div class=\"vi sub\"><b>– unpredictable </b><i class=\"ph\">/ˌʌnprɪˈdɪktəbl/</i> =<b> unexpected </b><i class=\"ph\">/ˌʌnɪkˈspektɪd/</i> = surprising <i class=\"ph\">/səˈpraɪzɪŋ/</i> (adj): không thể đoán trước, bất ngờ</div><div class=\"vi sub\"><b>– as predicted / expected / anticipated </b><i class=\"ph\">/əz prɪˈdɪktɪd / ɪkˈspektɪd / ænˈtɪsɪpeɪtɪd/</i> (adv.phr): như dự đoán, như mong đợi</div><div class=\"vi sub\"><b>– in the foreseeable future </b><i class=\"ph\">/ɪn ðə fɔːˈsiːəbl ˈfjuːtʃə/</i> (prep.phr): trong tương lai gần; trong tương lai có thể dự đoán được</div><div class=\"vi\"><span class=\"vn\">57.</span> <b>ethical</b> <i class=\"ph\">/ˈeθɪkl/</i> (adj): mang tính đạo đức</div><div class=\"vi sub\"><b>– unethical</b> <i class=\"ph\">/ʌnˈeθɪkl/</i> (adj): không mang tính đạo đức</div><div class=\"vi sub\"><b>– an ethical issue </b><i class=\"ph\">/ən ˈeθɪkl ˈɪʃuː/</i> (n.phr) = <b>an ethical concern </b><i class=\"ph\">/ən ˈeθɪkl kənˈsɜːn/</i> (n.phr): một vấn đề đạo đức</div><div class=\"vi sub\"><b>– a code of ethics</b> (n.phr): bộ quy tắc đạo đức</div><div class=\"vi\"><span class=\"vn\">58.</span> <b>communicate</b> <i class=\"ph\">/kəˈmjuːnɪkeɪt/</i> (v): giao tiếp</div><div class=\"vi sub\"><b>– change in communication </b><i class=\"ph\">/tʃeɪndʒ ɪn kəˌmjuːnɪˈkeɪʃn/</i> (n.phr): sự thay đổi trong giao tiếp</div><div class=\"vi\"><span class=\"vn\">59.</span> <b>store</b> <i class=\"ph\">/stɔːr/</i> (v): lưu trữ</div><div class=\"vi sub\"><b>– cloud storage </b><i class=\"ph\">/klaʊd ˈstɔːrɪdʒ/</i> (u.n): lưu trữ đám mây, bộ nhớ đám mây</div><div class=\"vi sub\"><b>– store data in the cloud </b><i class=\"ph\">/stɔː deɪtə ɪn ðə klaʊd/</i> (v.phr): lưu trữ dữ liệu trên đám mây</div><div class=\"vi sub\"><b>– cloud-based storage </b><i class=\"ph\">/klaʊd beɪst ˈstɔːrɪdʒ/</i> (n.phr): hệ thống lưu trữ dựa trên nền tảng đám mây</div><div class=\"vi\"><span class=\"vn\">60.</span> <b>approve of sth </b>/əˈpruːv əv / = <b>agree with sh</b> <i class=\"ph\">/əˈɡriː wɪð/</i> = <b>support</b> <i class=\"ph\">/səˈpɔːrt/</i> (v): tán thành, đồng ý, ủng hộ</div><div class=\"vi sub\"><b>– disapprove of sth </b>/ˌdɪsəˈpruːv əv / = <b>disagree</b> <b>with sth</b> <i class=\"ph\">/ˌdɪsəˈɡriː wɪð/</i> = <b>object to sth</b> <i class=\"ph\">/ˈɒbdʒɪkt tə/</i> (v): không tán thành, phản đối</div><div class=\"vi sub\"><b>– There are many reasons why people approve / disapprove of N. </b>(sentence): Có nhiều lý do tại sao mọi người tán thành / phản đối</div><div class=\"vi sub\"><b>– I am a supporter / an objector of the view that S + V. </b>(sentence): Tôi là người ủng hộ / phản đối</div><div class=\"vi\"><span class=\"vn\">60.</span> <b>One of the key / primary reasons is</b> <b>S + V.</b> (sentence): Một trong những lí do chính là …</div><div class=\"vi\"><span class=\"vn\">61.</span> <b>One more / Another possible reason is S + V.</b> (sentence): Một lời giải thích khả dĩ khác là …</div><div class=\"vi\"><span class=\"vn\">63.</span> <b>lead to</b> <i class=\"ph\">/liːd tuː/</i> = <b>result in</b> <i class=\"ph\">/rɪˈzʌlt ɪn/</i> = <b>bring about</b> <i class=\"ph\">/brɪŋ əˈbaʊt/</i> = <b>contribute to</b> <i class=\"ph\">/kənˈtrɪbjuːt tuː/</i> (phr.v): dẫn đến, gây ra, góp phần vào</div><div class=\"vi\"><span class=\"vn\">64.</span> <b>stem from</b> <i class=\"ph\">/stem frəm/</i> = <b>originate from</b> <i class=\"ph\">/əˈrɪdʒɪneɪt frəm/</i> (v.phr): bắt nguồn từ, xuất phát từ</div><div class=\"vi\">= <b>because of</b> <i class=\"ph\">/biː bɪˈkɒz əv/</i> = <b>due to</b> <i class=\"ph\">/biː djuː tuː/</i> = <b>on account of</b> <i class=\"ph\">/biː ɒn əˈkaʊnt əv/</i> (phr.v): là do, bởi vì</div><div class=\"vi\"><span class=\"vn\">65.</span> <b>Compared with / to</b> A, B … = <b>In comparison with / to</b> A, B … (sentence): So với A, B…</div><div class=\"vi\"><span class=\"vn\">66.</span> <b>gadget</b> <i class=\"ph\">/ˈɡædʒɪt/</i> = <b>electronic device </b><i class=\"ph\">/ɪˌlekˈtrɒnɪk dɪˈvaɪs/</i> (c.n): thiết bị điện tử</div><div class=\"vi\"><span class=\"vn\">67.</span> <b>technology-literate </b><i class=\"ph\">/tekˈnɒlədʒi ˈlɪtərət/</i> (adj): biết dùng công nghệ</div><div class=\"vi sub\"><b>– technological advancement</b> <i class=\"ph\">/ˌteknəˈlɒdʒɪkəl ədˈvɑːnsmənt/</i> (u.n): tiến bộ về công nghệ</div><div class=\"vi sub\"><b>– tech-savvy </b><i class=\"ph\">/ˌtek ˈsævi/</i> (adj): am hiểu về công nghệ</div><div class=\"vi sub\"><b>– high-tech </b><i class=\"ph\">/ˌhaɪ ˈtek/</i> (adj): công nghệ cao, tiên tiến</div><div class=\"vi\"><span class=\"vn\">68.</span> <b>virtual </b><i class=\"ph\">/ˈvɜːrtʃuəl/</i> = <b>digital </b><i class=\"ph\">/ˈdɪdʒɪtəl/</i> = <b>online </b><i class=\"ph\">/ˈɒnlaɪn/</i> (adj): ảo</div><div class=\"vi sub\"><b>– virtual friend </b><i class=\"ph\">/ˈvɜːrtʃuəl frend/</i> (c.n): bạn trên mạng</div><div class=\"vi sub\"><b>– virtual reality </b><i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i> (u.n): thực tế ảo</div><div class=\"vi sub\"><b>– digital era</b> <i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i> (c.n): kỉ nguyên số</div><div class=\"vi sub\"><b>– digital detox </b><i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i>(c.n): cai nghiện kỹ thuật số, hạn chế sử dụng công nghệ số</div><div class=\"vi\"><span class=\"vn\">69.</span> <b>be exposed to sth</b> <i class=\"ph\">/bi ɪkˈspəʊzd tə/</i> (V.phr): được tiếp xúc</div><div class=\"vi sub\"><b>– heavy exposure to sth </b><i class=\"ph\">/ˌhevi ɪkˈspəʊʒər tə/</i> (u.n): sự tiếp xúc</div><div class=\"vi\"><span class=\"vn\">70.</span> <b>sophisticated </b><i class=\"ph\">/səˈfɪstɪkeɪtɪd/</i> = <b>complex </b><i class=\"ph\">/ˈkɒmpleks/</i> = <b>complicated</b> <i class=\"ph\">/ˈkɒmplɪkeɪtɪd/</i>(adj): tinh vi, phức tạp, công phu</div><div class=\"vi\"><span class=\"vn\">71.</span> <b>simple </b><i class=\"ph\">/ˈsɪmpəl/</i> = <b>straightforward </b><i class=\"ph\">/ˌstreɪtˈfɔːwəd/</i> (adj): đơn giản</div><div class=\"vi\"><span class=\"vn\">72.</span> <b>Internet addict</b> <i class=\"ph\">/ˈɪntənet ˈædɪkt/</i>(c.n): người nghiện internet</div><div class=\"vi sub\"><b>– addiction</b> <i class=\"ph\">/əˈdɪkʃən/</i>(c.n): bệnh nghiện</div><div class=\"vi sub\"><b>– be addicted to sth </b><i class=\"ph\">/bi əˈdɪktɪd tə/</i> (V.phr): bị nghiện</div><div class=\"vi sub\"><b>– addictive</b> (adj) <i class=\"ph\">/əˈdɪktɪv/</i>: gây nghiện</div><div class=\"vi\"><span class=\"vn\">73.</span> <b>innovate</b> <i class=\"ph\">/ˈɪnəveɪt/</i> (v): cải tiến, đổi mới, cách tân</div><div class=\"vi sub\"><b>– technological innovation </b><i class=\"ph\">/ˌteknəˈlɒdʒɪkəl ˌɪnəˈveɪʃən/</i> (c.n): đổi mới công nghệ</div><div class=\"vi sub\"><b>– innovative </b><i class=\"ph\">/ˈɪnəveɪtɪv/</i> (adj): cải tiến</div><div class=\"vi\"><span class=\"vn\">74.</span> <b>cost-effective </b><i class=\"ph\">/ˌkɒst ɪˈfektɪv/</i> = <b>cost-efficient </b><i class=\"ph\">/ˌkɒst ɪˈfɪʃənt/</i> = <b>money-saving </b><i class=\"ph\">/ˈmʌni ˌseɪvɪŋ/</i> (adj): tiết kiệm chi phí</div><div class=\"vi\"><span class=\"vn\">75.</span> <b>latest </b><i class=\"ph\">/ˈleɪtɪst/</i> = <b>newest </b><i class=\"ph\">/ˈnjuːɪst/</i> = <b>recent </b><i class=\"ph\">/ˈriːsənt/</i>(adj): gần đây, mới nhất</div><div class=\"vi\"><span class=\"vn\">76.</span> <b>old-fashioned </b><i class=\"ph\">/ˌəʊld ˈfæʃənd/</i> = <b>obsolete </b><i class=\"ph\">/ˌɒbsəˈliːt/</i> = <b>outdated </b><i class=\"ph\">/ˌaʊtˈdeɪtɪd/</i>(adj): lỗi thời</div><div class=\"vi\"><span class=\"vn\">77.</span> <b>take over </b><i class=\"ph\">/teɪk ˈəʊvə/</i>(phr.V) = <b>replace A with B </b><i class=\"ph\">/rɪˈpleɪs wɪð/</i>(v): tiếp quản, thay thế</div><div class=\"vi\"><span class=\"vn\">78.</span> <b>user </b><i class=\"ph\">/ˈjuːzə/</i> (c.n): người dùng</div><div class=\"vi sub\"><b>– user-friendly </b><i class=\"ph\">/ˌjuːzə ˈfrendli/</i> (adj): dễ sử dụng</div><div class=\"vi\"><span class=\"vn\">79.</span> <b>mutually </b><i class=\"ph\">/ˈmjuːtʃuəli/</i>(adv): qua lại, lẫn nhau</div><div class=\"vi sub\"><b>– mutual affection </b><i class=\"ph\">/ˌmjuːtʃuəl əˈfekʃən/</i> (u.n): sự yêu mến lẫn nhau</div><div class=\"vi sub\"><b>– mutual understanding </b><i class=\"ph\">/ˌmjuːtʃuəl ˌʌndəˈstændɪŋ/</i>(u.n): sự thấu hiểu lẫn nhau</div><div class=\"vi sub\"><b>– mutual respect </b><i class=\"ph\">/ˌmjuːtʃuəl rɪˈspekt/</i>(u.n): sự tôn trọng lẫn nhau</div><div class=\"vi\"><span class=\"vn\">80.</span> <b>provide sb with support </b><i class=\"ph\">/prəˈvaɪd wɪð səˈpɔːt/</i>(v.phr): cung cấp hỗ trợ cho ai</div><div class=\"vi sub\"><b>–</b> <b>emotional support </b><i class=\"ph\">/ɪˈməʊʃənəl səˈpɔːt/</i>(u.n): hỗ trợ về mặt tinh thần</div><div class=\"vi sub\"><b>–</b> <b>financial support </b><i class=\"ph\">/faɪˈnænʃəl səˈpɔːt/</i>(u.n): hỗ trợ về mặt tài chính</div>"}, {"t": "Listening", "i": "II. Vocabulary for Listening (55 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>in real time</b> <i class=\"ph\">/ɪn ˈrɪəl taɪm/</i> (adv.phr): theo thời gian thực</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>inform sb about sth </b><i class=\"ph\">/ɪnˈfɔːm ... əˈbaʊt .../</i> (v.phr): thông báo cho ai về việc gì</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>transfer</b> <i class=\"ph\">/ˈtrænsfɜːr/</i> (v): chuyển, dời</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>access information</b> / <b>data</b> <i class=\"ph\">/ˈækses ˌɪnfəˈmeɪʃn / ˈdeɪtə/</i> (v.phr): truy cập thông tin / dữ liệu</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>stay in touch</b> <i class=\"ph\">/steɪ ɪn tʌtʃ/</i> (v.phr): giữ liên lạc</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>store</b> <i class=\"ph\">/stɔːr/</i> (v): lưu trữ</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>all-purpose system</b> <i class=\"ph\">/ˌɔːl ˈpɜːpəs ˈsɪstəm/</i> (c.n): hệ thống đa năng</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>a range of uses</b> <i class=\"ph\">/ə reɪndʒ əv ˈjuːsɪz/</i> (n.phr): nhiều công dụng</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>broadcast</b> <i class=\"ph\">/ˈbrɔːdkɑːst/</i> (v): phát sóng, truyền thanh</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>frivolous</b> <i class=\"ph\">/ˈfrɪvələs/</i> (adj): phù phiếm, vô bổ, thiếu nghiêm túc</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>practical usage</b> <i class=\"ph\">/ˈpræktɪkl ˈjuːsɪdʒ/</i> (c.n): ứng dụng thực tế</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>sort of data</b> <i class=\"ph\">/sɔːt əv ˈdeɪtə/</i> (n.phr): loại / dạng dữ liệu</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>an attempt to V0</b> <i class=\"ph\">/ən əˈtempt tuː/</i> (n.phr): một nỗ lực / sự cố gắng làm gì</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>set up connections</b> <i class=\"ph\">/set ʌp kəˈnekʃnz/</i> (v.phr): thiết lập / tạo các kết nối</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>overwhelmingly</b> <i class=\"ph\">/ˌəʊvəˈwelmɪŋli/</i> (adv): một cách áp đảo, phần lớn</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>method of contact</b> <i class=\"ph\">/ˈmeθəd əv ˈkɒntækt/</i> (c.n): phương thức liên lạc</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>exploit a facility</b> <i class=\"ph\">/ɪkˈsplɔɪt ə fəˈsɪləti/</i> (v.phr): khai thác/tận dụng một tính năng (facility: c.n)</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>associate A with B</b> <i class=\"ph\">/əˈsəʊʃieɪt ... wɪð .../</i> (v.phr): liên tưởng/gắn liền A với B</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>capture a moment</b> <i class=\"ph\">/ˈkæptʃər ə ˈməʊmənt/</i> (v.phr): lưu giữ/chụp lại một khoảnh khắc</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>personality trait</b> <i class=\"ph\">/ˌpɜːsəˈnæləti treɪt/</i> (c.n): nét tính cách</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>outgoing</b> <i class=\"ph\">/ˌaʊtˈɡəʊɪŋ/</i> (adj): hướng ngoại, cởi mở = <b>sociable</b> /ˈsəʊʃəbl/ (adj): hoà đồng, dễ kết bạn</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>selfish</b> <i class=\"ph\">/ˈselfɪʃ/</i> (adj): ích kỷ</div><div class=\"vi\">= <b>think the world revolves around you</b> <i class=\"ph\">/rɪˈvɒlvz/</i> (idm): nghĩ mình là trung tâm của mọi thứ</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>attention-seeking</b> <i class=\"ph\">/əˈtenʃn ˌsiːkɪŋ/</i> (adj): thích gây sự chú ý</div><div class=\"vi\">= <b>clamour for sth</b> <i class=\"ph\">/ˈklæmə fə/</i> (v.phr): đòi hỏi ầm ĩ cái gì</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>introverted</b> <i class=\"ph\">/ˈɪntrəvɜːtɪd/</i> (adj): hướng nội</div><div class=\"vi\">= <b>find it hard to engage with others</b> <i class=\"ph\">/ɪnˈɡeɪdʒ/</i> (v.phr): khó tương tác, giao lưu với người khác</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>co-operative</b> <i class=\"ph\">/kəʊˈɒpərətɪv/</i> (adj): biết hợp tác</div><div class=\"vi\">= <b>eager to please</b> <i class=\"ph\">/ˈiːɡə tə pliːz/</i> (adj.phr): luôn muốn làm vừa lòng người khác</div><div class=\"vi\">= <b>easy to get on with</b> (adj.phr): dễ hoà hợp, dễ chung sống</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>caring</b> <i class=\"ph\">/ˈkeərɪŋ/</i> (adj): chu đáo, biết quan tâm</div><div class=\"vi\">= <b>be good at nurturing</b> <i class=\"ph\">/nɜːtʃərɪŋ/</i> (v.phr): giỏi chăm sóc, nuôi dưỡng người khác</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>competitive</b> <i class=\"ph\">/kəmˈpetətɪv/</i> (adj): hiếu thắng, thích cạnh tranh</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>birth order</b> <i class=\"ph\">/ˈbɜːθ ˌɔːdə/</i> (u.n): thứ tự sinh trong gia đình</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>conflicting evidence</b> <i class=\"ph\">/kənˈflɪktɪŋ ˈevɪdəns/</i> (u.n): bằng chứng trái ngược nhau</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>there is little doubt that</b> <i class=\"ph\">/daʊt/</i>: hầu như chắc chắn rằng</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>have influence on sth</b> <i class=\"ph\">/hæv ˈɪnfluəns ɒn .../</i> (v.phr): có ảnh hưởng đến cái gì</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>socio-economic status</b> <i class=\"ph\">/ˌsəʊsiəʊ ˌiːkəˈnɒmɪk ˈsteɪtəs/</i> (u.n): địa vị kinh tế – xã hội</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>neglect to V0 </b><i class=\"ph\">/nɪˈɡlekt/</i> (v.phr): bỏ sót, không làm việc gì</div><div class=\"vi\">= <b>not take sth into consideration</b> <i class=\"ph\">/kənˌsɪdəˈreɪʃn/</i> (v.phr): không tính đến điều gì</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>slightly</b> <i class=\"ph\">/ˈslaɪtli/</i> (adv): hơi, một chút = <b>marginally</b> /ˈmɑːdʒɪnəli/ (adv): một chút, không đáng kể</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>parental attention</b> <i class=\"ph\">/pəˈrentl əˈtenʃn/</i> (u.n): sự quan tâm của cha mẹ</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>make little difference</b> <i class=\"ph\">/meɪk ˈlɪtl ˈdɪfrəns/</i> (v.phr): hầu như không tạo ra khác biệt</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>sibling rivalry</b> <i class=\"ph\">/ˈsɪblɪŋ ˈraɪvlri/</i> (u.n): sự ganh đua giữa anh chị em ruột</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>stand up for oneself</b> (v.phr) = <b>defend oneself </b><i class=\"ph\">/dɪˈfend/</i> (v.phr): tự đứng lên bảo vệ mình</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>be a good loser</b> <i class=\"ph\">/ˈluːzə/</i> (v.phr): biết chấp nhận thua cuộc</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>tolerant </b><i class=\"ph\">/ˈtɒlərənt/</i> (adj): khoan dung, biết chịu đựng = <b>put up with sb</b> (v.phr): chịu đựng ai</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>determine</b> <i class=\"ph\">/dɪˈtɜːmɪn/</i> (v): quyết định, định đoạt</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>stereotype</b> <i class=\"ph\">/ˈsteriətaɪp/</i> (c.n): định kiến, khuôn mẫu rập khuôn</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>robust evidence</b> <i class=\"ph\">/rəʊˈbʌst ˈevɪdəns/</i> (u.n): bằng chứng vững chắc</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>consensus</b> <i class=\"ph\">/kənˈsensəs/</i> (u.n): sự đồng thuận, quan điểm chung</div><div class=\"vi sub\"><b>– The consensus seems to be that...:</b> Mọi người dường như đều đồng ý rằng...</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>well-adjusted</b> <i class=\"ph\">/ˌwel əˈdʒʌstɪd/</i> (adj): cân bằng về tâm lý, thích nghi tốt</div><div class=\"vi\"><span class=\"vn\">27.</span> <b>get over sth</b> <i class=\"ph\">/ɡet ˈəʊvə .../</i> (v.phr): vượt qua, nguôi ngoai điều gì</div><div class=\"vi\"><span class=\"vn\">28.</span> <b>envious of sb/sth</b> <i class=\"ph\">/ˈenviəs əv .../</i> (adj.phr): ghen tị với ai/cái gì</div><div class=\"vi\"><span class=\"vn\">29.</span> <b>nurture versus nature</b> <i class=\"ph\">/ˈnɜːtʃə ˈvɜːsəs ˈneɪtʃə/</i> (n.phr): môi trường nuôi dạy so với yếu tố bẩm sinh</div><div class=\"vi\"><span class=\"vn\">30.</span> <b>have a bad press</b> (v.phr): bị nhìn nhận/đánh giá tiêu cực</div><div class=\"vi\"><span class=\"vn\">31.</span> <b>brand sb as sth</b> <i class=\"ph\">/brænd/</i> (v.phr): gán mác ai là</div><div class=\"vi\"><span class=\"vn\">32.</span> <b>loner </b><i class=\"ph\">/ˈləʊnə/</i> (c.n): người khép mình, thích ở một mình</div><div class=\"vi\"><span class=\"vn\">33.</span> <b>harsh</b> <i class=\"ph\">/hɑːʃ/</i> (adj): khắt khe, gay gắt</div><div class=\"vi\"><span class=\"vn\">34.</span> <b>account for sth</b> <i class=\"ph\">/əˈkaʊnt/</i> (v.phr): giải thích cho, là nguyên nhân của</div><div class=\"vi\"><span class=\"vn\">35.</span> <b>verbalise</b> <i class=\"ph\">/ˈvɜːbəlaɪz/</i> (v): diễn đạt thành lời</div><div class=\"vi\"><span class=\"vn\">36.</span> <b>co-exist amicably</b> <i class=\"ph\">/ˌkəʊɪɡˈzɪst ˈæmɪkəbli/</i> (v.phr): chung sống hoà thuận</div>"}, {"t": "Reading", "i": "III. Vocabulary for Reading (53 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>online social networking</b> <i class=\"ph\">/ˌɒnˈlaɪn ˈsəʊʃəl ˈnetˌwɜːkɪŋ/</i> (n.phr): mạng xã hội trực tuyến</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>weak ties</b> <i class=\"ph\">/wiːk taɪz/</i> (n.phr) = <b>loose acquaintances</b> <i class=\"ph\">/luːs əˈkweɪntənsɪz/</i> (n.phr): người quen qua loa, không thân thiết</div><div class=\"vi sub\"><b>–</b> <b>weak-tie contact</b> <i class=\"ph\">/wiːk taɪ ˈkɒntækt/</i> (n.phr): những người quen biết sơ</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>acquaintance</b> <i class=\"ph\">/əˈkweɪntəns/</i> (c.n): người quen</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>catalogue</b> <i class=\"ph\">/ˈkætəlɒɡ/</i> (v) = <b>categorize</b> <i class=\"ph\">/ˈkætəɡəraɪz/</i> (v): lập danh mục, phân loại</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>recommendation</b> <i class=\"ph\">/ˌrekəmenˈdeɪʃn/</i> (c.n): lời giới thiệu, sự đề xuất</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>social structure</b> <i class=\"ph\">/ˈsəʊʃəl ˈstrʊktʃə/</i> (n.phr): cấu trúc xã hội</div><div class=\"vi sub\"><b>–</b> <b>social sphere</b> <i class=\"ph\">/ˈsəʊʃəl sfɪə/</i> (n.phr): các phạm vi/lĩnh vực xã hội</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>trusted</b> <i class=\"ph\">/ˈtrʊstɪd/</i> (adj): đáng tin cậy</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>face-to-face contact</b> <i class=\"ph\">/ˌfeɪs tə ˈfeɪs ˈkɒntækt/</i> (n.phr): sự tương tác trực tiếp</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>instant messaging</b> <i class=\"ph\">/ˈɪnstənt ˈmesɪdʒɪŋ/</i> (n.phr): việc nhắn tin tức thời</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>profile</b> <i class=\"ph\">/ˈprəʊfaɪl/</i> (c.n): hồ sơ cá nhân</div><div class=\"vi sub\"><b>– view a profile</b> <i class=\"ph\">/vjuː ə ˈprəʊfaɪl/</i> (v.phr): xem hồ sơ cá nhân</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>self-esteem</b> <i class=\"ph\">/ˌself ɪˈstiːm/</i> (u.n): lòng tự trọng</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>affirmation</b> <i class=\"ph\">/ˌæfəˈmeɪʃn/</i> (u.n): sự công nhận, xác nhận</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>barrier</b> <i class=\"ph\">/ˈbæriər/</i> (c.n): rào cản, trở ngại</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>social support</b> <i class=\"ph\">/ˈsəʊʃəl səˈpɔːt/</i> (n.phr): sự hỗ trợ xã hội</div><div class=\"vi\">= <b>safety net</b> <i class=\"ph\">/ˈseɪfti net/</i> (n.phr): mạng lưới an toàn, chỗ dựa (nghĩa trong bài đọc)</div><div class=\"vi sub\"><b>– lack of social support</b> <i class=\"ph\">/læk əv ˈsəʊʃəl səˈpɔːt/</i> (n.phr): sự thiếu hụt hỗ trợ xã hội</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>visibility</b> <i class=\"ph\">/ˌvɪzəˈbɪləti/</i> (u.n): sự hiện diện, khả năng được nhìn thấy</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>well-connected</b> <i class=\"ph\">/ˌwel kəˈnektɪd/</i> (adj): có mạng lưới quan hệ rộng</div><div class=\"vi sub\"><b>– well-connected individual</b> <i class=\"ph\">/ˌwel kəˈnektɪd ˌɪndɪˈvɪdʒuəl/</i> (n.phr): cá nhân quen biết rộng</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>persuasive power</b> <i class=\"ph\">/pəˈsweɪsɪv ˈpaʊər/</i> (n.phr): khả năng thuyết phục</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>consensus</b> <i class=\"ph\">/kənˈsensəs/</i> (u.n): sự đồng thuận</div><div class=\"vi\"><b>reach a consensus</b> <i class=\"ph\">/riːtʃ ə kənˈsensəs/</i> (v.phr): đạt được sự đồng thuận</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>tangible effects</b> <i class=\"ph\">/ˈtændʒəbl ɪˈfekts/</i> (n.phr): những tác động rõ ràng, hữu hình</div><div class=\"vi sub\"><b>– have a tangible effect</b> <i class=\"ph\">/hæv ə ˈtændʒəbl ɪˈfekt/</i> (v.phr): có tác động rõ ràng</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>link</b> <i class=\"ph\">/lɪŋk/</i> (c.n): mối liên kết</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>networking</b> <i class=\"ph\">/ˈnetˌwɜːkɪŋ/</i> (u.n): việc xây dựng mạng lưới quan hệ</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>doubt</b> <b>about sth</b> <i class=\"ph\">/daʊt əˈbaʊt/</i> (u.n): nghi ngờ</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>socializing </b><i class=\"ph\">/ˈsəʊʃəlaɪzɪŋ/</i> (u.n): sự giao tiếp, giao lưu xã hội</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>exert pressure on</b> <b>sb</b> <i class=\"ph\">/ɪɡˈzɜːt ˈpreʃər/</i> (v.phr): gây áp lực lên ai đó</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>confide in sb </b><i class=\"ph\">/kənˈfaɪd ɪn/</i> (v.phr): tâm sự, thổ lộ với, tin tưởng ai đó</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>meaningful relationship </b><i class=\"ph\">/ˈmiːnɪŋfl rɪˈleɪʃnʃɪps/</i> (n.phr): mối quan hệ, kết nối có ý nghĩa</div><div class=\"vi\"><span class=\"vn\">27.</span> <b>maintain</b> <i class=\"ph\">/meɪnˈteɪn/</i> (v): duy trì</div><div class=\"vi\"><span class=\"vn\">28.</span> <b>social networking site</b> <i class=\"ph\">/ˈsəʊʃəl ˈnetˌwɜːkɪŋ saɪt/</i> (n.phr) (n.phr): các trang mạng xã hội</div><div class=\"vi\"><span class=\"vn\">29.</span> <b>keeping in touch with sb /</b>ˈkiːpɪŋ ɪn tʌtʃ wɪð/ (v.phr): giữ liên lạc với ai đó</div><div class=\"vi\"><span class=\"vn\">30.</span> <b>establish new friendships</b> <i class=\"ph\">/ɪˈstæblɪʃ njuː ˈfrendʃɪps/</i> (v.phr): thiết lập những tình bạn mới</div><div class=\"vi\"><span class=\"vn\">31.</span> <b>a wide circle of friends</b> <i class=\"ph\">/ə waɪd ˈsɜːkl əv frendz/</i> (n.phr): một vòng tròn bạn bè rộng lớn</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>colonise</b> <i class=\"ph\">/ˈkɒlənaɪz/</i> (v): chiếm cứ</div><div class=\"vi sub\"><b>– colonise a planet </b><i class=\"ph\">/ˈkɒlənaɪz ə ˈplænɪt/</i> (v.phr): chiếm cứ một hành tinh/lãnh thổ</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>robotic craft</b> <i class=\"ph\">/rəʊˈbɒtɪk krɑːft/</i> (n.phr): tàu/thiết bị robot không người lái</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>mine</b> <i class=\"ph\">/maɪn/</i> (v) = extract <i class=\"ph\">/ɪkˈstrækt/</i> (v): khai thác (khoáng sản)</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>exploit resources</b> <i class=\"ph\">/ɪkˈsplɔɪt rɪˈzɔːsɪz/</i> (v.phr): khai thác tài nguyên</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>machine intelligence</b> <i class=\"ph\">/məˈʃiːn ɪnˈtelɪdʒəns/</i> (n.phr): trí tuệ máy móc/nhân tạo</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>outstrip</b> <i class=\"ph\">/aʊtˈstrɪp/</i> (v): vượt qua, vượt trội hơn</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>advanced </b><i class=\"ph\">/ədˈvɑːnsɪz/</i> (adj): tiên tiến, hiện đại</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>reliability</b> <i class=\"ph\">/rɪˌlaɪəˈbɪləti/</i> (u.n): sự đáng tin cậy</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>flexibility</b> <i class=\"ph\">/ˌfleksəˈbɪləti/</i> (u.n): tính linh hoạt</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>personify</b> <i class=\"ph\">/pəˈsɒnɪfaɪ/</i> (v): nhân cách hóa (đồ vật vô tri)</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>inanimate objects</b> <i class=\"ph\">/ɪnˈænɪmət ˈɒbdʒɪkts/</i> (n.phr): vật vô tri vô giác</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>autonomous</b> <i class=\"ph\">/ɔːˈtɒnəməs/</i> (adj): tự động</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>futurologist</b> <i class=\"ph\">/ˌfjuːtʃəˈrɒlədʒɪst/</i> (c.n): nhà tương lai học</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>computer network</b> <i class=\"ph\">/kəmˈpjuːtər ˈnetwɜːk/</i> (n.phr): mạng lưới máy tính</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>computer virus</b> <i class=\"ph\">/kəmˈpjuːtər ˈvaɪrəs/</i> (n.phr): virus/phần mềm độc hại</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>malicious</b> <i class=\"ph\">/məˈlɪʃəs/</i> (adj): có ác ý, độc hại</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>misuse </b><i class=\"ph\">/ˌmɪsˈjuːz/</i> (c.n): sự sử dụng sai mục đích</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>restrict</b> <i class=\"ph\">/rɪˈstrɪkt/</i> (v): hạn chế (khả năng của robot)</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>supremacy</b> <i class=\"ph\">/suːˈpreməsi/</i> (u.n): quyền thống trị, ưu thế vượt trội</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>envisage</b> <i class=\"ph\">/ɪnˈvɪzɪdʒ/</i> (v) = <b>predict</b> <i class=\"ph\">/prɪˈdɪkt/</i> (v): tiên đoán, hình dung trước</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>dystopian</b> <i class=\"ph\">/dɪsˈtəʊpiən/</i> (adj): (thuộc) xã hội phản địa đàng</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>ethical</b> <i class=\"ph\">/ˈeθɪkl/</i> (adj): mang tính đạo đức</div>"}, {"t": "Speaking", "i": "IV. Vocabulary for Speaking (28 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>gadget</b> <i class=\"ph\">/ˈɡædʒɪt/</i> = <b>electronic device </b><i class=\"ph\">/ɪˌlekˈtrɒnɪk dɪˈvaɪs/</i> (c.n): thiết bị điện tử</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>technology-literate </b><i class=\"ph\">/tekˈnɒlədʒi ˈlɪtərət/</i> (adj): biết dùng công nghệ</div><div class=\"vi sub\"><b>– technological advancement</b> <i class=\"ph\">/ˌteknəˈlɒdʒɪkəl ədˈvɑːnsmənt/</i> (u.n): tiến bộ về công nghệ</div><div class=\"vi sub\"><span class=\"vn\">3.</span> <b>– tech-savvy </b><i class=\"ph\">/ˌtek ˈsævi/</i> (adj): am hiểu về công nghệ</div><div class=\"vi sub\"><span class=\"vn\">4.</span> <b>– high-tech </b><i class=\"ph\">/ˌhaɪ ˈtek/</i> (adj): công nghệ cao, tiên tiến</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>Virtual </b><i class=\"ph\">/ˈvɜːrtʃuəl/</i> = <b>digital </b><i class=\"ph\">/ˈdɪdʒɪtəl/</i> = <b>online </b><i class=\"ph\">/ˈɒnlaɪn/</i> (adj): ảo</div><div class=\"vi sub\"><b>– virtual friend </b><i class=\"ph\">/ˈvɜːrtʃuəl frend/</i> (c.n): bạn trên mạng</div><div class=\"vi sub\"><b>– virtual reality </b><i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i> (u.n): thực tế ảo</div><div class=\"vi sub\"><b>– digital era</b> <i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i> (c.n): kỉ nguyên số</div><div class=\"vi sub\"><b>– digital detox </b><i class=\"ph\">/ˌvɜːrtʃuəl riˈæləti/</i>(c.n): cai nghiện kỹ thuật số, hạn chế sử dụng công nghệ số</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>be exposed to sth</b> <i class=\"ph\">/bi ɪkˈspəʊzd tə/</i> (V.phr): được tiếp xúc</div><div class=\"vi sub\"><b>– heavy exposure to sth </b><i class=\"ph\">/ˌhevi ɪkˈspəʊʒər tə/</i> (u.n): sự tiếp xúc</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>sophisticated </b><i class=\"ph\">/səˈfɪstɪkeɪtɪd/</i> = <b>complex </b><i class=\"ph\">/ˈkɒmpleks/</i> = <b>complicated</b> <i class=\"ph\">/ˈkɒmplɪkeɪtɪd/</i>(adj): tinh vi, phức tạp, công phu</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>simple </b><i class=\"ph\">/ˈsɪmpəl/</i> = <b>straightforward </b><i class=\"ph\">/ˌstreɪtˈfɔːwəd/</i> (adj): đơn giản</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>Internet addict</b> <i class=\"ph\">/ˈɪntənet ˈædɪkt/</i>(c.n): người nghiện internet</div><div class=\"vi sub\"><b>– addiction</b> <i class=\"ph\">/əˈdɪkʃən/</i>(c.n): bệnh nghiện</div><div class=\"vi sub\"><b>– be addicted to sth </b><i class=\"ph\">/bi əˈdɪktɪd tə/</i> (V.phr): bị nghiện</div><div class=\"vi sub\"><b>– addictive</b> <i class=\"ph\">/əˈdɪktɪv/</i> (adj): gây nghiện</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>optimize </b><i class=\"ph\">/ˈɒptɪmaɪz/</i> (v): tối ưu hoá</div><div class=\"vi sub\"><b>– optimal</b> <i class=\"ph\">/ˈɒptɪməl/</i> (adj): tối ưu</div><div class=\"vi sub\"><b>– optimization </b><i class=\"ph\">/ˌɒptɪmaɪˈzeɪʃən/</i> (u.n): sự tối ưu hoá</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>innovate</b> <i class=\"ph\">/ˈɪnəveɪt/</i> (v): cải tiến, đổi mới, cách tân</div><div class=\"vi sub\"><b>– technological innovation </b><i class=\"ph\">/ˌteknəˈlɒdʒɪkəl ˌɪnəˈveɪʃən/</i> (c.n): đổi mới công nghệ</div><div class=\"vi sub\"><b>– innovative </b><i class=\"ph\">/ˈɪnəveɪtɪv/</i> (adj): cải tiến</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>cost-effective </b><i class=\"ph\">/ˌkɒst ɪˈfektɪv/</i> = <b>cost-efficient </b><i class=\"ph\">/ˌkɒst ɪˈfɪʃənt/</i> = <b>money-saving </b><i class=\"ph\">/ˈmʌni ˌseɪvɪŋ/</i> (adj): tiết kiệm chi phí</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>latest </b><i class=\"ph\">/ˈleɪtɪst/</i> = <b>newest </b><i class=\"ph\">/ˈnjuːɪst/</i> = <b>recent </b><i class=\"ph\">/ˈriːsənt/</i>(adj): gần đây, mới nhất</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>old-fashioned </b><i class=\"ph\">/ˌəʊld ˈfæʃənd/</i> = <b>obsolete </b><i class=\"ph\">/ˌɒbsəˈliːt/</i> = <b>outdated </b><i class=\"ph\">/ˌaʊtˈdeɪtɪd/</i>(adj): lỗi thời</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>take over </b><i class=\"ph\">/teɪk ˈəʊvə/</i>(phr.V) = <b>replace A with B </b><i class=\"ph\">/rɪˈpleɪs wɪð/</i>(v): tiếp quản, thay thế</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>user </b><i class=\"ph\">/ˈjuːzə/</i> (c.n): người dùng</div><div class=\"vi sub\"><b>– user-friendly </b><i class=\"ph\">/ˌjuːzə ˈfrendli/</i> (adj): dễ sử dụng</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>share / have a lot in common </b><i class=\"ph\">/ʃeə/</i> <i class=\"ph\">/hæv ə lɒt ɪn ˈkɒmən/</i>(v.phr): có nhiều điểm chung</div><div class=\"vi sub\"><b>–</b> <b>have nothing in common </b><i class=\"ph\">/hæv ˈnʌθɪŋ ɪn ˈkɒmən/</i>(v.phr): không có điểm chung</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>get to know sb</b> <i class=\"ph\">/ɡet tə nəʊ/</i>(v.phr): làm quen</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>enjoy one's company </b><i class=\"ph\">/ɪnˈdʒɔɪ ˈkʌmpəni/</i>(v.phr): thích ở bên cạnh</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>mutually </b><i class=\"ph\">/ˈmjuːtʃuəli/</i>(adv): qua lại, lẫn nhau</div><div class=\"vi sub\"><b>–</b> <b>mutual affection </b><i class=\"ph\">/ˌmjuːtʃuəl əˈfekʃən/</i> (u.n): sự yêu mến lẫn nhau</div><div class=\"vi sub\"><b>–</b> <b>mutual understanding </b><i class=\"ph\">/ˌmjuːtʃuəl ˌʌndəˈstændɪŋ/</i>(u.n): sự thấu hiểu lẫn nhau</div><div class=\"vi sub\"><b>–</b> <b>mutual respect </b><i class=\"ph\">/ˌmjuːtʃuəl rɪˈspekt/</i>(u.n): sự tôn trọng lẫn nhau</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>provide sb with support </b><i class=\"ph\">/prəˈvaɪd wɪð səˈpɔːt/</i>(v.phr): cung cấp hỗ trợ cho ai</div><div class=\"vi sub\"><b>–</b> <b>emotional support </b><i class=\"ph\">/ɪˈməʊʃənəl səˈpɔːt/</i>(u.n): hỗ trợ về mặt tinh thần</div><div class=\"vi sub\"><b>–</b> <b>financial support </b><i class=\"ph\">/faɪˈnænʃəl səˈpɔːt/</i>(u.n): hỗ trợ về mặt tài chính</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>bond </b><i class=\"ph\">/bɒnd/</i>(c.n): sự gắn kết, tình thân / (v): gắn kết</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>good / close / best friend </b><i class=\"ph\">/ɡʊd/</i> <i class=\"ph\">/kləʊs/</i> <i class=\"ph\">/best frend/</i>(c.n): bạn tốt</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>fall out with sb </b><i class=\"ph\">/fɔːl aʊt wɪð/</i>(v.phr): cãi vã, nghỉ chơi</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>cherish </b><i class=\"ph\">/ˈtʃerɪʃ/</i> = <b>value </b><i class=\"ph\">/ˈvæljuː/</i> = <b>appreciate </b><i class=\"ph\">/əˈpriːʃieɪt/</i>(v): trân trọng</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>family member </b><i class=\"ph\">/ˈfæməli ˌmembə/</i> (c.n): thành viên trong gia đình</div><div class=\"vi sub\"><b>– nuclear family </b><i class=\"ph\">/ˈnjuːkliə ˌfæməli/</i> (c.n): gia đình hai thế hệ (ba mẹ - con cái)</div><div class=\"vi sub\"><b>– extended family </b><i class=\"ph\">/ɪkˈstendɪd ˌfæməli/</i>(c.n): gia đình nhiều thế hệ</div><div class=\"vi sub\"><b>– close-knit family</b><i class=\"ph\">/ˌkləʊs ˈnɪt ˌfæməli/</i> (c.n): gia đình gắn bó, khăng khít</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>turn to sb (for advice) </b><i class=\"ph\">/tɜːn tə (fə ədˈvaɪs)/</i>(v.phr): tìm tới ai đó (khi gặp khó khăn để xin lời khuyên)</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>overcome personal hardships / challenges </b><i class=\"ph\">/ˌəʊvəˈkʌm ˈpɜːsənəl ˈhɑːdʃɪps/</i> <i class=\"ph\">/ˈtʃælɪndʒɪz/</i> (V.phr): vượt qua những khó khăn / thử thách cá nhân</div>"}, {"t": "Writing", "i": "V. Vocabulary for Writing (63 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>expand one’s social circle</b> <i class=\"ph\">/ɪkˈspænd ˌsəʊʃl ˈˈsɜːkl/</i> (v.phr): mở rộng mối quan hệ</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>(video) conferencing </b><i class=\"ph\">/ˈkɒnfərənsɪŋ/</i> (n.phr): đàm thoại (chỉ cuộc họp, cuộc gọi trực tuyến có camera)</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>forum </b><i class=\"ph\">/ˈfɔːrəm/</i> (c.n): diễn đàn (các trang mạng mà người dùng có thể tạo chủ đề thẻo luận hoặc bình luận chủ để mà người khác tạo)</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>social isolation </b><i class=\"ph\">/ˌsəʊʃl aɪsəˈleɪʃn/</i> (n.phr): cô lập xã hội</div><div class=\"vi sub\"><b>– socially isolated </b><i class=\"ph\">/ˌsəʊʃəli aɪsəˈleɪtɪd/</i> (n.phr): bị cô lập trong xã hội</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>alienation </b><i class=\"ph\">/ˌeɪliəˈneɪʃn/</i> (u.n): sự xa lánh</div><div class=\"vi sub\"><b>– sense / feeling of alienation </b>/sɛns/ˈfiːlɪŋ ɒv ˌeɪliəˈneɪʃn/ (n.phr) = <b>estrangement </b><i class=\"ph\">/ɪˈstreɪndʒmənt/</i> (u.n): cảm giác bị xa lánh</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>empathy </b><i class=\"ph\">/ˈempəθi/</i> = <b>compassion </b><i class=\"ph\">/kəmˈpæʃn/</i> (u.n): sự cảm thông</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>lower / remove / break down barriers</b> /ˈləʊə / rɪˈmuːv/ breɪk daʊn ˈbæriəz/ (v.phr): hạ thấp/xóa bỏ rào cản</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>misinformation</b> <i class=\"ph\">/ˌmɪs.ɪn.fɚˈmeɪ.ʃən/</i> (u.n): thông tin sai lệch (do vô tình hoặc chưa được kiểm chứng)</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>circulation</b> <i class=\"ph\">/ˌsɝː.kjəˈleɪ.ʃən/</i> (u.n): sự lưu hành, sự lan truyền</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>irrational</b> <i class=\"ph\">/ɪˈræʃ.ən.əl/</i> (adj): phi lý, không hợp lý</div><div class=\"vi sub\"><b>– irrational fear </b><i class=\"ph\">/ɪˈræʃnl fɪə/</i> (n.phr): lo lắng vô lý</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>engage / interact with sb </b><i class=\"ph\">/ɪnˈɡeɪʤ / ɪntərˈækt wɪð/</i> (v): giao lưu / tương tác với</div><div class=\"vi sub\"><b>– engage / participate in</b> <b>sth</b> /ɪnˈɡeɪʤ/pɑːˈtɪsɪpeɪt ɪn/ (v): tham gia vào</div><div class=\"vi sub\"><b>– engagement </b><i class=\"ph\">/ɪnˈɡeɪdʒmənt/</i> (u.n): sự tham gia, tương tác</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>online platform </b><i class=\"ph\">/ˈɒnˌlaɪn ˈplætfɔːm/</i> = <b>virtual space </b><i class=\"ph\">/ˈvɜːʧuəl speɪs/</i> (n.phr): nền tảng trực tuyến</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>(of) interests ˈ</b><i class=\"ph\">/ˈɪntrɛsts/</i> (n.phr): sở thích, (có) hứng thú</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>true intimacy / connection ˈ</b><i class=\"ph\">/ˈɪntɪməsi / kəˈnɛkʃn/</i> (n.phr): sự kết nối, gần gũi chân thật</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>approve of sth </b>/əˈpruːv əv / = <b>agree with sb</b> <i class=\"ph\">/əˈɡriː wɪð/</i> = <b>support</b> <i class=\"ph\">/səˈpɔːrt/</i> (v): tán thành, đồng ý, ủng hộ</div><div class=\"vi sub\"><b>– disapprove of sth </b>/ˌdɪsəˈpruːv əv / = <b>disagree</b> <b>with sth</b> <i class=\"ph\">/ˌdɪsəˈɡriː wɪð/</i> = <b>object to sth</b> <i class=\"ph\">/ˈɒbdʒɪkt tə/</i> (v): không tán thành, phản đối</div><div class=\"vi sub\"><b>– There are many reasons why people approve / disapprove of N. </b>(sentence): Có nhiều lý do tại sao mọi người tán thành / phản đối</div><div class=\"vi sub\"><b>– I am a supporter / an objector of the view that S + V. </b>(sentence): Tôi là người ủng hộ / phản đối</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>One of the key / primary reasons is</b> <b>S + V.</b> (sentence): Một trong những lí do chính là …</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>One more / Another possible reason is S + V.</b> (sentence): Một lời giải thích khả dĩ khác là …</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>accuracy </b><i class=\"ph\">/ˈæk.jə.rə.si/</i> (u.n): sự chính xác (về kĩ thuật thay vì thông tin)</div><div class=\"vi sub\">– <b>accurate</b> <i class=\"ph\">/ˈæk.jə.rət/</i> = <b>precise </b><i class=\"ph\">/prɪˈsaɪs/</i> = <b>exact </b><i class=\"ph\">/ɪɡˈzækt/</i> (adj): chính xác</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>consensus</b> <i class=\"ph\">/kənˈsensəs/</i> (u.n): sự đồng thuận, sự nhất trí chung</div><div class=\"vi sub\"><b>–</b> <b>The general consensus is that...: </b>Ý kiến đông cho rằng</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>data</b> <i class=\"ph\">/ˈdeɪtə/</i>, <i class=\"ph\">/ˈdætə/</i> (p.n): dữ liệu</div><div class=\"vi sub\"><b>–</b> <b>access data </b><i class=\"ph\">/ˈækses ˌdeɪtə/</i> (v.phr): truy cập dữ liệu</div><div class=\"vi sub\"><b>–</b> <b>retrieve data </b><i class=\"ph\">/rɪˈtriːv deɪtə/</i>: thu thập dữ liệu</div><div class=\"vi sub\"><b>–</b> <b>catalogue data</b> <i class=\"ph\">/ˈkætəlɒɡ deɪtə/</i> (v.phr): phân loại, lưu trữ dữ liệu</div><div class=\"vi sub\"><b>–</b> <b>data security </b><i class=\"ph\">/ˈdeɪtə sɪˌkjʊərəti/</i> (n.phr): bảo mật dữ liệu</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>labour </b><i class=\"ph\">/ˈleɪbə/</i> (u.n): lao động</div><div class=\"vi sub\"><b>– reduce labour cost</b> <i class=\"ph\">/ˈleɪbə kɒst/</i> (v.phr): giảmchi phí lao động</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>hazardous </b><i class=\"ph\">/ˈhæzədəs/</i> = <b>dangerous </b><i class=\"ph\">/ˈdeɪndʒərəs/</i> (adj): nguy hiểm, có nhiều rủi ro</div><div class=\"vi sub\">– <b>hazard </b><i class=\"ph\">/ˈhæzəd/</i> (c.n): mối nguy hiểm</div><div class=\"vi sub\">– <b>occupational hazard</b> <i class=\"ph\">/ˌɒkjəˈpeɪʃənəl ˈhæzəd/</i> (n.phr): mối nguy hiểm nghề nghiệp</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>productivity </b><i class=\"ph\">/ˌprɒdʌkˈtɪvəti/</i>= <b>efficiency </b><i class=\"ph\">/ɪˈfɪʃənsi/</i> = <b>performance </b><i class=\"ph\">/pəˈfɔːməns/</i> (u.n): năng suất, năng lực</div><div class=\"vi sub\"><b>– mass production</b> <i class=\"ph\">/ˌmæs prəˈdʌkʃən/</i> (n.phr): sản xuất hàng loạt</div><div class=\"vi sub\"><b>– perform commands / tasks</b> <i class=\"ph\">/pəˈfɔːm kəˈmɑːndz/</i> / <i class=\"ph\">/tɑːsks/</i> (v.phr): thực hiện mệnh lệnh / nhiệm vụ</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>resilient </b><i class=\"ph\">/rɪˈzɪliənt/</i> (adj): có khả năng phục hồi, chống chịu tốt</div><div class=\"vi sub\">– <b>resilience </b><i class=\"ph\">/rɪˈzɪliəns/</i> (u.n): khả năng chống chịu/phục hồi</div><div class=\"vi sub\">– <b>able to withstand </b><i class=\"ph\">/ˈeɪbəl tə wɪðˈstænd/</i> (phrase): có khả năng chống chịu (lực va đập, nhà sập, các điều kiện thời tiết, thiên tai...</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>rescue </b><i class=\"ph\">/ˈreskjuː/</i> (v/u.n): cứu hộ, sự cứu hộ</div><div class=\"vi sub\">– <b>rescue worker </b><i class=\"ph\">/ˈreskjuː ˌwɜːkə/</i> (n.phr): nhân viên cứu hộ</div><div class=\"vi sub\">– <b>rescue robot </b><i class=\"ph\">/ˈreskjuː ˌrəʊbɒt/</i> (n.phr): robot cứu hộ</div><div class=\"vi sub\">– <b>rescuer </b><i class=\"ph\">/ˈreskjuːə/</i> (c.n): người/thiết bị cứu hộ</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>emergency service </b><i class=\"ph\">/ɪˈmɜːdʒənsi sɜːvɪsɪz/</i> (n.phr): dịch vụ khẩn cấp
