ray along with an additional 100 ml of water.", "One the pulp is leveled, a wire mesh is placed directly over the ingredient.", "The provided map illustrates how recycled paper is made of used newspaper.", "After flipping the mesh and the tray, excess water drips downward, and the sheet is further flattened by a rolling pin."], "d": "", "z": [{"n": "Introduction (1 sentence)", "cap": 1, "a": [9]}, {"n": "Overview (1 sentence)", "cap": 1, "a": [4]}, {"n": "Body paragraph 1", "cap": 99, "a": [6, 5, 3, 7]}, {"n": "Body paragraph 2", "cap": 99, "a": [1, 8, 10, 2]}]}, {"t": "Exercise 10", "k": "i", "i": "Rewrite each sentence: type the missing word(s) in each gap (the first letter is a hint).", "d": "The diagram illustrates how chocolate is produced in a factory.|The diagram {13~d____________} how {25~t________________________} in a factory.|demonstrates;to produce chocolate\nWorkers assemble the components of the machine by hand.|The components of the machine are {13~m____________} assembled by workers.|manually\nThe factory manufactures about 1,000 cars every month.|The factory has a monthly {13~p____________} of {13~a____________} 1,000 cars.|production;around\nThe liquid evaporates during this stage of the diagram.|The {13~e____________} of the liquid occurs during this {13~s____________} of the {13~p____________}.|evaporation;step;process\nThe linear process includes four main steps from start to finish.|The linear process {13~c____________} four main {13~s____________} from start to finish.|consists of;stages\nThe system operates automatically using a computer.|The system operates {13~m____________} via a computer.|mechanically\nThe sequence of steps forms a closed loop.|The sequence of steps forms a {13~c____________} process.|cyclical\nThe process begins with the mixing of the ingredients.|The process {25~c________________________} the ingredients are mixed together.|commences when\nThe factory makes synthetic items instead of natural ones.|The factory {13~p____________} {13~a____________} items instead of natural ones.|produces;artificial\nThe cycle repeats itself continuously.|The process is a {25~c________________________} that repeats continuously.|closed loop\nThe process ends with the packaging of the final product.|The process {25~c________________________} the final product is packaged.|culminates when\nThen, they cool the mixture rapidly.|{13~S____________}, the mixture is cooled rapidly.|Subsequently\nDuring this phase, another reaction happens.|{25~A________________________}, another reaction happens.|At this stage\nThe raw coffee beans are crushed into small pieces. Afterwards, the mixture is heated in the evaporator to remove the liquid.|{55~O__________________________________________________}, the mixture is heated in the evaporator to remove the liquid.|Once the raw coffee beans are crushed into small pieces\nThe mechanical components of the device are assembled. Afterwards, a metal canister is installed to store the final product.|{58~W__________________________________________________}, a metal canister is installed to store the final product.|When the mechanical components of the device are assembled"}];

\"vi sub\"><b>–</b> <b>provide a new habitat for sth</b> <i class=\"ph\">/prəˈvaɪd ə njuː ˈhæbɪtæt fɔː/</i> (v.phr): tạo ra môi trường sống mới cho cái gì</div><div class=\"vi sub\"><b>–</b> <b>ecosystem / environmental degradation</b> <i class=\"ph\">/ˈiːkoʊsɪstəm ˌ/</i> ɪnˌvaɪrənˈmentəl deɡrəˈdeɪʃn/ (n.phr): sự suy thoái hệ sinh thái</div><div class=\"vi sub\"><b>–</b> <b>raise</b> <b>environmental awareness</b> <i class=\"ph\">/reɪz ɪnˌvaɪrənˈmentəl əˈwernəs/</i> (v.phr): nâng cao ý thức bảo vệ môi trường</div><div class=\"vi sub\"><b>– protect / preserve the environment </b><i class=\"ph\">/prəˈtekt / prɪˈzɜːv ði ɪnˈvaɪrənmənt/</i> (v.phr): bảo vệ / gìn giữ môi trường</div><div class=\"vi sub\"><b>– environmental protection / preservation / conservation </b><i class=\"ph\">/ɪnˌvaɪrənˈmentəl prəˈtekʃn / ˌprɪzəˈveɪʃn / ˌkɒnsəˈveɪʃn/</i> (n.phr): bảo vệ môi trường</div><div class=\"vi sub\"><b>– environmentalist </b><i class=\"ph\">/ɪnˌvaɪrənˈmentəlɪst/</i> =<b> conservationist</b> <i class=\"ph\">/ˌkɒnsəˈveɪʃənɪst/</i> (c.n): nhà môi trường học, nhà bảo tồn thiên nhiên</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>predator</b> <i class=\"ph\">/ˈpredətə/</i> (c.n): động vật săn mồi, thiên địch</div><div class=\"vi sub\"><b>–</b> <b>natural predators</b> <i class=\"ph\">/ˈnætʃrəl ˈpredətəz/</i> (n.phr): thiên địch tự nhiên</div><div class=\"vi sub\"><b>–</b> <b>prey</b> <i class=\"ph\">/preɪ/</i> (c.n): con mồi</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>threaten</b> <i class=\"ph\">/ˈθretən/</i>=<b> endanger </b><i class=\"ph\">/ɪnˈdeɪndʒər/</i> (v): đe dọa, gây nguy hiểm cho</div><div class=\"vi sub\"><b>–</b> <b>menace</b> <i class=\"ph\">/ˈmenəs/</i> = <b>threat</b> <i class=\"ph\">/θret/</i> = <b>nuisance</b> <i class=\"ph\">/ˈnjuːsns/</i> = <b>danger </b><i class=\"ph\">/ˈdeɪndʒər/</i> (c.n): mối đe dọa, thứ gây phiền toái</div><div class=\"vi sub\"><b>– pose a threat / risk / danger </b><i class=\"ph\">/pəʊz ə θret / rɪsk / ˈdeɪndʒər/</i> (v.phr): gây ra mối đe dọa / rủi ro / nguy hiểm</div><div class=\"vi sub\"><b>– in danger of sth </b><i class=\"ph\">/ɪn ˈdeɪndʒər əv/</i>(prep.phr): lâm vào cảnh nguy hiểm</div><div class=\"vi\"><b>threatened species </b><i class=\"ph\">/ˈθretnd ˈspiːʃiːz/</i>(n.phr): các loài bị đe dọa</div><div class=\"vi sub\"><b>– endangered species </b><i class=\"ph\">/ɪnˈdeɪndʒəd ˈspiːʃiːz/</i> (n.phr): các loài có nguy cơ tuyệt chủng</div><div class=\"vi sub\"><b>– critically endangered species </b><i class=\"ph\">/ˈkrɪtɪkli ɪnˈdeɪndʒəd ˈspiːʃiːz/</i> (n.phr): các loài cực kỳ nguy cấp (cấp độ nghiêm trọng nhất trong các mức độ đe dọa tuyệt chủng trong tự nhiên trước khi chính thức biến mất hoàn toàn)</div><div class=\"vi sub\"><b>– dangerous </b><i class=\"ph\">/ˈdeɪndʒərəs/</i>=<b> risky </b><i class=\"ph\">/ˈrɪski/</i> (adj): nguy hiểm, có rủi ro</div><div class=\"vi sub\"><b>–</b> <b>the dual menaces of A and B</b> <i class=\"ph\">/ðə ˈdjuːəl ˈmenəsɪz əv ... ənd .../</i> (n.phr): hai mối đe dọa kép của A và B</div><div class=\"vi\">= <b>dangers posed by sth</b> <i class=\"ph\">/ˈdeɪndʒəz pəʊzd baɪ/</i> (n.phr): những mối nguy do cái gì gây ra</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>decay</b> <i class=\"ph\">/dɪˈkeɪ/</i> = <b>decompose</b> <i class=\"ph\">/ˌdiːkəmˈpəʊz/</i> = <b>rot</b> <i class=\"ph\">/rɒt/</i> = <b>break down</b> <i class=\"ph\">/breɪk daʊn/</i> (phr.v) (v): phân hủy, mục nát</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>manure</b> <i class=\"ph\">/məˈnjʊə/</i> = <b>dung</b> <i class=\"ph\">/dʌŋ/</i> = <b>fertiliser</b> <i class=\"ph\">/ˈfɜːtɪlaɪzə/</i> (u.n): phân chuồng</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>generate</b> <i class=\"ph\">/ˈdʒenəreɪt/</i> = <b>produce</b> <i class=\"ph\">/prəˈdjuːs/</i> = <b>create</b> <i class=\"ph\">/kriˈeɪt/</i> (v): tạo ra, sản sinh, sản xuất</div><div class=\"vi sub\"><b>–</b> <b>manufacturing</b> <i class=\"ph\">/ˌmænjuˈfæktʃərɪŋ/</i> = <b>production </b><i class=\"ph\">/prəˈdʌkʃn/</i>(u.n): sự sản xuất, chế tạo</div><div class=\"vi sub\"><b>– boost / increase productivity </b><i class=\"ph\">/buːst / ɪnˈkriːs ˌprɒdʌkˈtɪvəti/</i> (v.phr): tăng năng suất, nâng cao hiệu suất làm việc</div><div class=\"vi sub\"><b>– reproductive</b> <i class=\"ph\">/ˌriːprəˈdʌktɪv/</i> (adj): thuộc về sinh sản</div><div class=\"vi sub\"><b>–</b> <b>reproduce</b> <i class=\"ph\">/ˌriːprəˈdjuːs/</i> (v): sinh sản</div><div class=\"vi sub\"><b>–</b> <b>reproduction</b> <i class=\"ph\">/ˌriːprəˈdʌkʃn/</i> (u.n): sự sinh sản</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>purify</b> <i class=\"ph\">/ˈpjʊərɪfaɪ/</i> = <b>filter (out)</b> / fɪltər aʊt/ (v): làm sạch, thanh lọc</div><div class=\"vi sub\">– <b>filter /</b>fɪltər/ (c.n): bộ lọc, cái lọc</div><div class=\"vi sub\"><b>–</b> <b>purification </b><i class=\"ph\">/ˌpjʊərɪfɪˈkeɪʃn/</i> (u.n): quá trình thanh lọc</div><div class=\"vi sub\"><b>–</b> <b>impurity</b> <i class=\"ph\">/ɪmˈpjʊərəti/</i> = <b>contaminant</b> <i class=\"ph\">/kənˈtæmɪnənt/</i> (c.n): chất bẩn, tạp chất</div><div class=\"vi sub\"><b>–</b> <b>remove impurities </b><i class=\"ph\">/rɪˈmuːv ɪmˈpjʊərətiz/</i> (v.phr): loại bỏ tạp chất</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>emit</b> <i class=\"ph\">/ɪˈmɪt/</i> = <b>release</b> <i class=\"ph\">/rɪˈliːs/</i> = <b>discharge</b> <i class=\"ph\">/dɪsˈtʃɑːdʒ/</i> (v) = <b>give off</b> <i class=\"ph\">/ɡɪv ɒf/</i> (v.phr): thải ra, phát ra (khí, ánh sáng...)</div><div class=\"vi sub\"><b>–</b> <b>gas emitted by the digester</b> <i class=\"ph\">/ɡæs ɪˈmɪtɪd baɪ ðə daɪˈdʒestə/</i> (n.phr): khí do thiết bị phân hủy thải ra</div><div class=\"vi sub\"><b>–</b> <b>carbon</b> <b>emissions</b> <i class=\"ph\">/ɪˈmɪʃn/</i> =<b> carbon footprint</b> <i class=\"ph\">/ˈkɑːrbən ˈfʊtprɪnt/</i> (u.n): lượng khí thải</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>investigate</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt/</i> = <b>examine</b> <i class=\"ph\">/ɪɡˈzæmɪn/</i> (v): tìm hiểu, nghiên cứu</div><div class=\"vi sub\"><b>–</b> <b>investigate the possibility of doing sth</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt ðə ˌpɒsəˈbɪləti əv ˈduːɪŋ/</i> (v.phr): nghiên cứu khả năng làm gì</div><div class=\"vi sub\">– <b>investigate the cause of sth</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt ðə kɔːz əv ˈsʌmθɪŋ/</i> (v.phr): điều tra nguyên nhân của việc gì</div><div class=\"vi sub\">– <b>investigation</b> <i class=\"ph\">/ɪnˌvestɪˈɡeɪʃn/</i> (c.n/u.n): cuộc điều tra</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>confirm</b> <i class=\"ph\">/kənˈfɜːm/</i> = <b>verify</b> <i class=\"ph\">/ˈverɪfaɪ/</i> = <b>prove</b> <i class=\"ph\">/pruːv/</i> (v): xác nhận, khẳng định</div><div class=\"vi sub\"><b>–</b> <b>confirm what sb has found</b> <i class=\"ph\">/kənˈfɜːm wɒt ... hæz faʊnd/</i> (v.phr): xác nhận điều ai đó đã tìm ra</div><div class=\"vi sub\"><b>–</b> <b>be proved to be sth</b> <i class=\"ph\">/biː pruːvd tuː biː/</i> (v.phr): được chứng minh là cái gì</div><div class=\"vi sub\"><b>–</b> <b>proof</b> <i class=\"ph\">/pruːf/</i> = <b>evidence </b><i class=\"ph\">/ˈevɪdəns/</i> (u.n): bằng chứng, chứng cứ</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>estimate</b> <i class=\"ph\">/ˈestɪmeɪt/</i> = <b>predict</b> <i class=\"ph\">/prɪˈdɪkt/</i> = <b>calculate</b> <i class=\"ph\">/ˈkælkjuleɪt/</i> (v): ước tính</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>renewable energy</b> <i class=\"ph\">/rɪˈnjuːəbl ˈenədʒi/</i> = <b>clean energy</b> <i class=\"ph\">/kliːn ˈenədʒi/</i> = <b>green energy</b> <i class=\"ph\">/ɡriːn ˈenədʒi/</i> (n.phr): năng lượng tái tạo</div><div class=\"vi sub\"><b>– non-renewable energy </b><i class=\"ph\">/ˌnɒn rɪˈnjuːəbl ˈenədʒi/</i> (u.n): năng lượng không tái tạo</div><div class=\"vi sub\"><b>– alternative energy sources</b><i class=\"ph\">/ɔːlˈtɜːnətɪv ˈenədʒi ˈsɔːsɪz/</i> (n): các nguồn năng lượng thay thế</div><div class=\"vi sub\"><b>– geothermal </b><i class=\"ph\">/ˌdʒiːəʊˈθɜːml ˈenədʒi/</i><b> /tidal energy </b><i class=\"ph\">/ˈtaɪdl ˈenədʒi/</i><b>/ biomass energy </b><i class=\"ph\">/ˈbaɪəʊmæs ˈenədʒi/</i>(u.n): năng lượng địa nhiệt / thủy triều / sinh khối</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>gold mine</b> <i class=\"ph\">/ɡəʊld maɪn/</i> = <b>treasure trove</b> <i class=\"ph\">/ˈtreʒə trəʊv/</i> = <b>bonanza</b> <i class=\"ph\">/bəˈnænzə/</i> (c.n): mỏ vàng, nguồn lợi lớn</div><div class=\"vi sub\"><b>–</b> <b>a renewable energy gold mine</b> <i class=\"ph\">/ə rɪˈnjuːəbl ˈenədʒi ɡəʊld maɪn/</i> (n.phr): một \"mỏ vàng\" năng lượng tái tạo</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>fuel </b><i class=\"ph\">/fjuːəl/</i> (n): nhiên liệu; (v): cung cấp nhiên liệu, tiếp nhiên liệu</div><div class=\"vi sub\"><b>–</b> <b>biofuel</b> <i class=\"ph\">/ˈbaɪəʊfjuːəl/</i> = <b>green fuel</b> <i class=\"ph\">/ɡriːn ˈfjuːəl/</i> (c.n/u.n): nhiên liệu sinh học</div><div class=\"vi sub\"><b>–</b> <b>biofuel gas</b> <i class=\"ph\">/ˈbaɪəʊfjuːəl ɡæs/</i> (n.phr): khí nhiên liệu sinh học</div><div class=\"vi sub\"><b>–</b> <b>solid fuel</b> <i class=\"ph\">/ˈsɒlɪd ˈfjuːəl/</i> (n.phr): nhiên liệu rắn (củi, than...)</div><div class=\"vi sub\"><b>–</b> <b>use solid fuels for cooking</b> <i class=\"ph\">/juːz ˈsɒlɪd ˈfjuːəlz fɔː ˈkʊkɪŋ/</i> (v.phr): dùng nhiên liệu rắn để nấu ăn</div><div class=\"vi sub\"><b>–</b> <b>dirty fuels</b> <i class=\"ph\">/ˈdɜːti ˈfjuːəlz/</i> (n.phr): nhiên liệu gây ô nhiễm</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>pollute</b> / pəˈluːt/= <b>contaminate </b><i class=\"ph\">/kənˈtæmɪneɪt/</i> (v): làm ô nhiễm, làm nhiễm bẩn</div><div class=\"vi sub\"><b>–</b> <b>air / water / soil pollution</b> <i class=\"ph\">/eər / ˈwɔːtər / sɔɪl pəˈluːʃən/</i> / (n.phr): ô nhiễm không khí / nước / đất</div><div class=\"vi sub\"><b>–</b> <b>increase indoor pollution</b> <i class=\"ph\">/ɪnˈkriːs ˈɪndɔː pəˈluːʃn/</i> (v.phr): làm tăng ô nhiễm trong nhà</div><div class=\"vi sub\"><b>–</b> <b>pollutant </b><i class=\"ph\">/pəˈluːtənt/</i> = <b>contaminant</b> <i class=\"ph\">/kənˈtæmɪnənt/</i> (c.n): tạp chất, chất ô nhiễm</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>discover</b> <i class=\"ph\">/dɪˈskʌvə/</i> = <b>uncover</b> <i class=\"ph\">/ʌnˈkʌvə/</i> = <b>detect</b> <i class=\"ph\">/dɪˈtekt/</i> = <b>explore</b> <i class=\"ph\">/ɪkˈsplɔː/</i> (v): khám phá, phát hiện</div><div class=\"vi sub\"><b>–</b> <b>discover new things</b> <i class=\"ph\">/dɪˈskʌvə njuː θɪŋz/</i> (v.phr): khám phá những điều mới</div><div class=\"vi sub\"><b>–</b> <b>discovery</b> <i class=\"ph\">/dɪˈskʌvəri/</i> (c.n/u.n): sự khám phá, phát hiện</div><div class=\"vi sub\"><b>–</b> <b>self-discovery</b> <i class=\"ph\">/ˌself dɪˈskʌvəri/</i> (u.n): sự khám phá bản thân, sự tự nhận thức về bản thân</div><div class=\"vi sub\"><b>–</b> <b>the process of discovery</b> <i class=\"ph\">/ðə ˈprəʊses əv dɪˈskʌvəri/</i> (n.phr): quá trình khám phá</div><div class=\"vi sub\"><b>–</b> <b>personal discovery</b> <i class=\"ph\">/ˈpɜːsənl dɪˈskʌvəri/</i> (n.phr): sự khám phá bản than</div><div class=\"vi sub\"><b>–</b> <b>deep-sea exploration</b> <i class=\"ph\">/ˌdiːp ˈsiː ˌekspləˈreɪʃn/</i> (n.phr): việc thám hiểm biển sâu</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>potential</b> <i class=\"ph\">/pəˈtenʃl/</i> = <b>possibility</b> <i class=\"ph\">/ˌpɒsəˈbɪləti/</i> = <b>prospect</b> <i class=\"ph\">/ˈprɒspekt/</i> (u.n/adj): tiềm năng</div><div class=\"vi sub\"><b>–</b> <b>explore its potential as sth</b> <i class=\"ph\">/ɪkˈsplɔː ɪts pəˈtenʃl æz/</i> (v.phr): tìm hiểu tiềm năng của … như là …</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>unknown</b> <i class=\"ph\">/ʌnˈnəʊn/</i> (adj/n): chưa được biết đến; điều chưa biết</div><div class=\"vi sub\"><b>–</b> <b>borders of the unknown</b> <i class=\"ph\">/ˈbɔːdəz əv ði ʌnˈnəʊn/</i> (n.phr): ranh giới của những điều chưa biết</div><div class=\"vi sub\"><b>–</b> <b>venture into the unknown</b> <i class=\"ph\">/ˈventʃə ˈɪntuː ði ʌnˈnəʊn/</i> (v.phr): mạo hiểm bước vào điều chưa biết</div><div class=\"vi sub\"><b>– explore the unknown </b><i class=\"ph\">/ɪkˈsplɔːr ði ʌnˈnəʊn/</i> (v.phr): khám phá những điều chưa biết</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>depleted</b> <i class=\"ph\">/dɪˈpliːtɪd/</i> = <b>exhausted</b> <i class=\"ph\">/ɪɡˈzɔːstɪd/</i> (adj): bị cạn kiệt, suy giảm</div><div class=\"vi sub\">– <b>depleted forests</b> <i class=\"ph\">/dɪˈpliːtɪd ˈfɒrɪsts/</i> (n.phr): những khu rừng bị suy giảm</div><div class=\"vi sub\">– <b>deplete / dry up natural resources</b> /dɪˈpliːt <i class=\"ph\">/draɪ ʌpˈnætʃrəl rɪˈzɔːsɪz/</i> (v.phr): làm cạn kiệt tài nguyên thiên nhiên</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>existence</b> <i class=\"ph\">/ɪɡˈzɪstəns/</i> = <b>survival</b> <i class=\"ph\">/səˈvaɪvl/</i> (u.n): sự tồn tại, sự sinh tồn</div><div class=\"vi sub\">– <b>maintain one’s existence</b> <i class=\"ph\">/meɪnˈteɪn wʌnz ɪɡˈzɪstəns/</i> (v.phr): duy trì sự tồn tại</div><div class=\"vi sub\">– <b>exist</b> <i class=\"ph\">/ɪɡˈzɪst/</i> (v): tồn tại</div><div class=\"vi sub\">– <b>co</b>-<b>exist</b> <i class=\"ph\">/ˌkəʊɪɡˈzɪst/</i> (v): cùng tồn tại, chung sống hòa thuận</div><div class=\"vi sub\">– <b>come into existence</b> <i class=\"ph\">/kʌm ˈɪntuː ɪɡˈzɪstəns/</i> (v.phr): ra đời, hình thành</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>instinct</b> <i class=\"ph\">/ˈɪnstɪŋkt/</i> = <b>intuition</b> <i class=\"ph\">/ˌɪntjuˈɪʃn/</i> (c.n/u.n): bản năng</div><div class=\"vi sub\">– <b>enquiring instinct</b> <i class=\"ph\">/ɪnˈkwaɪərɪŋ ˈɪnstɪŋkt/</i> (n.phr): bản năng ham tìm tòi</div><div class=\"vi sub\">– <b>survival instinct</b> <i class=\"ph\">/səˈvaɪvl ˈɪnstɪŋkt/</i> (n.phr): bản năng sinh tồn</div><div class=\"vi sub\">– <b>instinctive</b> <i class=\"ph\">/ɪnˈstɪŋktɪv/</i> (adj): theo bản năng</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>cultivation</b> <i class=\"ph\">/ˌkʌltɪˈveɪʃn/</i> = <b>harvest</b> <i class=\"ph\">/ˈhɑːvɪst/</i> = <b>farming</b> <i class=\"ph\">/ˈfɑːmɪŋ/</i> (u.n): sự trồng trọt, canh tác</div><div class=\"vi sub\"><b>–</b> <b>cultivate </b><i class=\"ph\">/ˈkʌltɪveɪt/</i> = <b>harvest</b> <i class=\"ph\">/ˈhɑːvɪst/</i> (v): trồng trọt, canh tác</div><div class=\"vi sub\"><b>–</b> <b>uncultivated</b> <i class=\"ph\">/ʌnˈkʌltɪveɪtɪd/</i> = <b>undeveloped</b> <i class=\"ph\">/ˌʌndɪˈveləpt/</i> = <b>wild</b> <i class=\"ph\">/waɪld/</i> (adj): chưa được canh tác, hoang hóa</div><div class=\"vi sub\"><b>–</b> <b>cultivate crops</b> <i class=\"ph\">/ˈkʌltɪveɪt krɒps/</i> (v.phr): trồng cây nông nghiệp</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>landscape</b> <i class=\"ph\">/ˈlændskeɪp/</i> = <b>terrain</b> <i class=\"ph\">/təˈreɪn/</i> (c.n/u.n): phong cảnh, cảnh quan</div><div class=\"vi sub\">– <b>use the landscape to suggest sth</b> <i class=\"ph\">/juːz ðə ˈlændskeɪp tə səˈdʒest ˈsʌmθɪŋ/</i> (v.phr): dùng cảnh quan để gợi lên điều gì</div><div class=\"vi sub\">– <b>a rural landscape</b> <i class=\"ph\">/ə ˈrʊərəl ˈlændskeɪp/</i> (n.phr): cảnh quan nông thôn</div><div class=\"vi\"><span class=\"vn\">27.</span> <b>bacteria</b> <i class=\"ph\">/bækˈtɪəriə/</i> = <b>germs</b> <i class=\"ph\">/dʒɜːmz/</i> (p.n): vi khuẩn</div><div class=\"vi sub\">– <b>bacterium</b> <i class=\"ph\">/bækˈtɪəriəm/</i> (s.n): một vi khuẩn</div><div class=\"vi sub\">– <b>harmful bacteria</b> <i class=\"ph\">/ˈhɑːmfl bækˈtɪəriə/</i> (n.phr): vi khuẩn có hại</div><div class=\"vi sub\">– <b>bacterial</b> <i class=\"ph\">/bækˈtɪəriəl/</i> (adj): thuộc về vi khuẩn</div><div class=\"vi\"><span class=\"vn\">28.</span> <b>ocean floor</b> <i class=\"ph\">/ˈəʊʃn flɔː/</i> = <b>seabed</b> <i class=\"ph\">/ˈsiːbed/</i> = <b>seafloor</b> <i class=\"ph\">/ˈsiːflɔː/</i> (c.n): đáy đại dương</div><div class=\"vi sub\">– <b>map the ocean floor</b> <i class=\"ph\">/mæp ði ˈəʊʃn flɔː/</i> (v.phr): lập bản đồ đáy đại dương</div><div class=\"vi\"><span class=\"vn\">29.</span> <b>scientist</b> <i class=\"ph\">/ˈsaɪəntɪst/</i> (c.n): nhà khoa học</div><div class=\"vi sub\">– <b>scientific research</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪk rɪˈsɜːtʃ/</i> (n.phr): nghiên cứu khoa học</div><div class=\"vi sub\">– <b>scientific breakthrough </b><i class=\"ph\">/ˌsaɪənˈtɪfɪk ˈbreɪkθruː/</i> (c.n): bước đột phá khoa học</div><div class=\"vi sub\">– <b>scientifically useful</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪkli ˈjuːsfl/</i> (a.phr): hữu ích về mặt khoa học</div><div class=\"vi sub\"><b>–</b> <b>conduct a science experiment /</b>kənˈdʌkt ə ˈsaɪəns ɪkˈsperɪmənt/ (v.phr): tiến hành một thí nghiệm khoa học</div><div class=\"vi sub\"><b>–</b> <b>scientific principle</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪk ˈprɪnsəpl/</i> (n.phr): nguyên lý khoa học</div><div class=\"vi\"><span class=\"vn\">30.</span> <b>findings</b> <i class=\"ph\">/ˈfaɪndɪŋz/</i> = <b>results</b> <i class=\"ph\">/rɪˈzʌlts/</i> = <b>conclusions</b> <i class=\"ph\">/kənˈkluːʒnz/</i> (c.n): kết quả nghiên cứu</div><div class=\"vi sub\"><b>–</b> <b>record one’s findings</b> <i class=\"ph\">/rɪˈkɔːd wʌnz ˈfaɪndɪŋz/</i> (v.phr): ghi lại kết quả nghiên cứu</div><div class=\"vi sub\"><b>–</b> <b>research findings</b> <i class=\"ph\">/rɪˈsɜːtʃ ˈfaɪndɪŋz/</i> (n.phr): kết quả nghiên cứu</div><div class=\"vi\"><span class=\"vn\">31.</span> <b>microbe</b> <i class=\"ph\">/ˈmaɪkrəʊb/</i> = <b>micro-organism</b> <i class=\"ph\">/ˌmaɪkrəʊˈɔːɡənɪzəm/</i> (c.n): vi sinh vật</div><div class=\"vi sub\"><b>–</b> <b>the habits of microbes</b> <i class=\"ph\">/ðə ˈhæbɪts əv ˈmaɪkrəʊbz/</i> (n.phr): tập tính của vi sinh vật</div><div class=\"vi\"><span class=\"vn\">32.</span> <b>behaviour</b> <i class=\"ph\">/bɪˈheɪvjə/</i> = <b>conduct</b> <i class=\"ph\">/ˈkɒndʌkt/</i> (u.n): hành vi, tập tính</div><div class=\"vi sub\"><b>–</b> <b>animal behaviour</b> <i class=\"ph\">/ˈænɪml bɪˈheɪvjə/</i> (n.phr): hành vi của động vật</div><div class=\"vi sub\"><b>–</b> <b>behave</b> <i class=\"ph\">/bɪˈheɪv/</i> (v): cư xử, hành xử</div><div class=\"vi sub\"><b>–</ \"><span class=\"vn\">65.</span> <b>produce </b><i class=\"ph\">/prəˈduːs/</i> =<b> manufacture </b><i class=\"ph\">/ˌmænjuˈfæktʃər/</i> =<b> make </b><i class=\"ph\">/meɪk/</i>(v): tạo ra, sản xuất</div><div class=\"vi sub\"><b>–</b> <b>manufacturing</b> <i class=\"ph\">/ˌmænjuˈfæktʃərɪŋ/</i> = <b>production </b><i class=\"ph\">/prəˈdʌkʃn/</i>(u.n): sự sản xuất, chế tạo</div><div class=\"vi sub\"><b>–</b> <b>end item</b> <i class=\"ph\">/ˈend ˈaɪtəm/</i> = <b>consumer good</b> <i class=\"ph\">/kənˈsuːmər ɡʊdz/</i> = <b>manufactured good</b> <i class=\"ph\">/ˌmænjuˈfæktʃərd ɡʊdz/</i> = <b>final product</b> <i class=\"ph\">/ˈfaɪnl ˈprɒdʌkts/</i> (n.phr): sản phẩm cuối cùng, hàng tiêu dùng, hàng hóa chế tạo, thành phẩm hoàn thiện</div><div class=\"vi\"><span class=\"vn\">66.</span> <b>process </b> <i class=\"ph\">/ˈprɑːses/</i>(c.n): quá trình</div><div class=\"vi sub\"><b>–</b> <b>linear</b> <b>process </b><i class=\"ph\">/ˈlɪniə(r) ˈprɑːses/</i> (n.phr): theo đường thẳng, tuyến tính (từ bắt đầu đến kết thúc theo một chiều)</div><div class=\"vi sub\"><b>–</b> <b>loop</b> <i class=\"ph\">/luːp/</i> = <b>cycle</b> <i class=\"ph\">/ˈsaɪkl/</i> (c.n) = <b>cyclical</b> <b>process </b><i class=\"ph\">/ˈsɪklɪkl ˈprɑːses/</i> (n.phr): vòng lặp, chu trình khép kín, quá trình tuần hoàn</div><div class=\"vi sub\"><b>–</b> <b>the loop repeats continuously </b><i class=\"ph\">/ðə luːp rɪˈpiːts kənˈtɪnjuəsli/</i> (sentence): vòng lặp lặp đi lặp lại một cách liên tục (dùng để diễn tả một quá trình khép kín tự vận hành không có điểm dừng)</div><div class=\"vi\"><span class=\"vn\">67.</span> <b>sequence</b> <i class=\"ph\">/ˈsiːkwəns/</i> (c.n): chuỗi, tiến trình, trình tự</div><div class=\"vi\"><span class=\"vn\">68.</span> <b>stage</b> <i class=\"ph\">/steɪdʒ/</i> = <b>step</b> <i class=\"ph\">/step/</i> (c.n): bước, giai đoạn</div><div class=\"vi\"><span class=\"vn\">69.</span> <b>require</b> <i class=\"ph\">/rɪˈkwaɪər/</i> (v): yêu cầu</div><div class=\"vi\"><span class=\"vn\">70 tences)<b>: </b>quá trình bắt đầu / kết thúc khi ...</div><div class=\"vi\"><span class=\"vn\">79.</span> <b>Afterwards</b> <i class=\"ph\">/ˈæftɝwɝdz/</i> = <b>Then</b> <i class=\"ph\">/ðen/</i> = <b>Subsequently</b> <i class=\"ph\">/ˈsʌbsɪkwəntli/</i>(adv) = <b>After + N/Ving, = Once S + V, = When S + V,</b> (sentence): Sau đó (để giới thiệu bước tiếp theo)</div><div class=\"vi\"><span class=\"vn\">80.</span> <b>During + N,</b> (prep) = <b>At this point,</b> = <b>It is also at this time that S + V.</b> (sentence) (connector): Trong lúc này (để giới thiệu chuyển xảy ra cùng lúc với bước đa nhắc)</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>botanical garden</b> <i class=\"ph\">/bəˈtænɪkl ˈɡɑːrdn/</i> (n.phr): vườn bách thảo</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>natural scenery</b> <i class=\"ph\">/ˈnætʃrəl ˈsiːnəri/</i> (n.phr): phong cảnh thiên nhiên</div><div class=\"vi sub\"><b>– spoil the natural beauty</b> <i class=\"ph\">/spɔɪl ðə ˈnætʃrəl ˈbjuːti/</i> (v.phr): làm hỏng vẻ đẹp tự nhiên</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>wild animal</b> <i class=\"ph\">/waɪld ˈænɪml/</i> (n.phr) = <b>wildlife</b> <i class=\"ph\">/ˈwaɪldlaɪf/</i> (u.n): động vật hoang dã</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>single-use plastic</b> <i class=\"ph\">/ˈsɪŋɡl juːs ˈplæstɪk/</i> (n.phr): nhựa sử dụng một lần</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>straw</b> <i class=\"ph\">/strɔː/</i> (c.n): ống hút</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>plastic waste / pollution</b> <i class=\"ph\">/ˈplæstɪk weɪst / pəˈluːʃn/</i> (u.n): rác thải nhựa / sự ô nhiễm nhựa</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>littered with trash</b> <i class=\"ph\">/ˈlɪtərd wɪð træʃ/</i> (adj.phr): tràn ngập rác, vương vãi rác</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>wash ashore</b> <i class=\"ph\">/wɑːʃ əˈʃɔːr/</i> (v.phr): tạt vào bờ, trôi dạt vào bờ (rác thải biển)</div><div class=\"vi sub\"><b>–</b> <b>write an abstract</b> <i class=\"ph\">/raɪt ən ˈæbstrækt/</i> (v.phr): viết bản tóm tắt</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>concise</b> <i class=\"ph\">/kənˈsaɪs/</i> (adj): ngắn gọn, súc tích</div><div class=\"vi sub\"><b>–</b> <b>short and concise</b> <i class=\"ph\">/ʃɔːt ənd kənˈsaɪs/</i> (a.phr): ngắn gọn và súc tích</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>overlook </b><i class=\"ph\">/ˌəʊvəˈlʊk/</i> (v): bỏ qua, bỏ sót</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>jot down</b> <i class=\"ph\">/dʒɒt daʊn/</i> (phr.v): ghi chép nhanh, ghi lại tóm tắt</div><div class=\"vi sub\"><b>–</b> <b>jot down whatever comes to mind</b> <i class=\"ph\">/dʒɒt daʊn wɒtˈevə kʌmz tuː maɪnd/</i> (v.phr): ghi lại bất cứ điều gì nảy ra trong đầu</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>draft </b><i class=\"ph\">/drɑːft/</i> (c.n): bản thảo</div><div class=\"vi sub\"><b>–</b> <b>final draft</b> <i class=\"ph\">/ˈfaɪnl drɑːft/</i> (n.phr): bản thảo cuối cùng</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>submission</b> <i class=\"ph\">/səbˈmɪʃn/</i> (u.n): sự nộp (bài, hồ sơ)</div><div class=\"vi sub\"><b>–</b> <b>submission process</b> <i class=\"ph\">/səbˈmɪʃn ˈprəʊses/</i> (n.phr): quy trình nộp bài</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>shortlist </b><i class=\"ph\">/ˈʃɔːtlɪst/</i> (c.n): danh sách rút gọn</div><div class=\"vi sub\"><b>–</b> <b>have a shortlist of sth</b> <i class=\"ph\">/hæv ə ˈʃɔːtlɪst əv/</i> (v.phr): có một danh sách rút gọn các cái gì</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>style guide</b> <i class=\"ph\">/staɪl ɡaɪd/</i> (n.phr): quy chuẩn định dạng bài viết</div><div class=\"vi sub\"><b>–</b> <b>match the style guide</b> <i class=\"ph\">/mætʃ ðə staɪl ɡaɪd/</i> (v.phr): khớp với quy chuẩn định dạng</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>copyright form</b> <i class=\"ph\">/ˈkɒpiraɪt fɔːm/</i> (n.phr): đơn xác nhận bản quyền</div><div class=\"vi sub\"><b>–</b> <b>sign the copyright form</b> <i class=\"ph\">/saɪn ðə ˈkɒpiraɪt fɔːm/</i> (v.phr): ký đơn xác nhận bản quyền</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>manuscript</b> <i class=\"ph\">/ˈmænjuskrɪpt/</i> (c.n): bản thảo tác phẩm/nghiên cứu</div><div class=\"vi sub\"><b>–</b> <b>process the manuscript</b> <i class=\"ph\">/ˈprəʊses ðə ˈmænjuskrɪpt/</i> (v.phr): xử lý bản thảo</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>peer review</b> <i class=\"ph\">/pɪə rɪˈvjuː/</i> (n.phr): sự thẩm định độc lập, phản biện khoa học</div><div class=\"vi sub\"><b>–</b> <b>undergo peer review</b> <i class=\"ph\">/ˌʌndəˈɡəʊ pɪə rɪˈvjuː/</i> (v.phr): trải qua quá trình phản biện khoa học</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>double-blind</b> <i class=\"ph\">/ˌdʌbl ˈblaɪnd/</i> (adj): ẩn danh hai chiều (phương pháp ẩn danh cả hai bên trong nghiên cứu)</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>conditional acceptance</b> <i class=\"ph\">/kənˈdɪʃənl əkˈseptəns/</i> (n.phr): sự chấp thuận có điều kiện</div><div class=\"vi sub\"><b>–</b> <b>get a conditional acceptance</b> <i class=\"ph\">/ɡet ə kənˈdɪʃənl əkˈseptəns/</i> (v.phr): nhận được sự chấp thuận có điều kiện</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>tweak</b> <i class=\"ph\">/twiːk/</i> (v): chỉnh sửa nhỏ, tinh chỉnh</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>revise &amp; resubmit</b> <i class=\"ph\">/rɪˈvaɪz ənd ˌriːsəbˈmɪt/</i> (v.phr): sửa chữa và nộp lại</div><div class=\"vi sub\"><b>–</b> <b>rework the paper</b> <i class=\"ph\">/ˌriːˈwɜːk ðə ˈpeɪpə/</i> (v.phr): làm lại/sửa lại bài báo khoa học</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>frustrated </b><i class=\"ph\">/frʌˈstreɪtɪd/</i> (adj): bực bội, nản lòng</div><div class=\"vi sub\"><b>–</b> <b>frustrated at their lack of interest </b><i class=\"ph\">/frʌˈstreɪtɪd æt ðeə læk əv ˈɪntrest/</i> (a.phr): nản lòng trước sự thiếu hứng thú của họ</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>reaction </b><i class=\"ph\">/riˈækʃn/</i> (c.n)</div><div class=\"vi sub\"><b>–</b> <b>react to sth </b><i class=\"ph\">/riˈækt tuː/</i> (v.phr): phản ứng với cái gì</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>obtain data </b><i class=\"ph\">/əbˈteɪn ˈdeɪtə/</i> (v.phr): thu thập/có được dữ liệu</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>permission </b><i class=\"ph\">/pəˈmɪʃn/</i> (u.n): sự cho phép, giấy phép</div><div class=\"vi sub\"><b>–</b> <b>get permission to do sth </b><i class=\"ph\">/ɡet pəˈmɪʃn tuː duː ˈsʌmθɪŋ/</i> (v.phr): xin phép làm gì</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>food intake </b><i class=\"ph\">/fuːd ˈɪnteɪk/</i> (n.phr): lượng thức ăn nạp vào</div><div class=\"vi sub\"><b>–</b> <b>control their food intake </b><i class=\"ph\">/kənˈtrəʊl ðeə fuːd ˈɪnteɪk/</i> (v.phr): kiểm soát lượng thức ăn nạp vào</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>supplement </b><i class=\"ph\">/ˈsʌplɪmənt/</i> (c.n): chất bổ sung, thực phẩm bổ sung</div><div class=\"vi sub\"><b>–</b> <b>food supplement </b><i class=\"ph\">/fuːd ˈsʌplɪmənt/</i> (n.phr): thực phẩm bổ sung</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>varying amounts of exercise </b><i class=\"ph\">/ˈveəriɪŋ əˈmaʊnts əv ˈeksəsaɪz/</i> (n.phr): các mức độ tập thể dục khác nhau</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>cage </b><i class=\"ph\">/keɪdʒ/</i> (c.n): cái lồng, cái chuồng</div><div class=\"vi sub\"><b>–</b> <b>separate cage </b><i class=\"ph\">/ˈseprət keɪdʒ/</i> (n.phr): lồng riêng biệt</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>commercial </b><i class=\"ph\">/kəˈmɜːʃl/</i> (adj): thương mại, sản xuất công nghiệp</div><div class=\"vi sub\"><b>–</b> <b>commercial mouse food </b><i class=\"ph\">/kəˈmɜːʃl maʊs fuːd/</i> (n.phr): thức ăn cho chuột sản xuất công nghiệp</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>weighing chamber </b><i class=\"ph\">/ˈweɪɪŋ ˈtʃeɪmbə/</i> (n.phr): buồng cân, hộp giữ vật nuôi khi cân</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>prevent escape </b><i class=\"ph\">/prɪˈvent ɪˈskeɪp/</i> (v.phr): ngăn chặn sự chạy trốn</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>calculation </b><i class=\"ph\">/ˌkælkjuˈleɪʃn/</i> (c.n): phép tính, sự tính toán</div><div class=\"vi sub\"><b>–</b> <b>do all necessary calculations </b><i class=\"ph\">/duː ɔːl ˈnesəsəri ˌkælkjuˈleɪʃnz/</i> (v.phr): thực hiện tất cả các tính toán cần thiết</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>practical teaching / teaching practice </b><i class=\"ph\">/ˈpræktɪkl ˈtiːtʃɪŋ/</i> (n.phr): thực tập giảng dạy</div><div class=\"vi sub\"><b>–</b> <b>get on with practical teaching </b><i class=\"ph\">/ɡet ɒn wɪð ˈpræktɪkl ˈtiːtʃɪŋ/</i> (v.phr): tiến hành việc thực tập giảng dạy</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>discipline </b><i class=\"ph\">/ˈdɪsəplɪn/</i> (u.n): kỷ luật</div><div class=\"vi sub\"><b>–</b> <b>discipline problems </b><i class=\"ph\">/ˈdɪsəplɪn ˈprɒbləmz/</i> (n.phr): các vấn đề về kỷ luật</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>engagement </b><i class=\"ph\">/ɪnˈɡeɪdʒmənt/</i> (u.n): sự chú ý, sự tương tác, sự tham gia</div><div class=\"vi sub\"><b>–</b> <b>real engagement </b><i class=\"ph\">/rɪəl ɪnˈɡeɪdʒmənt/</i> (n.phr): sự tương tác/gắn kết thực sự</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>methodology </b><i class=\"ph\">/ˌmeθəˈdɒlədʒi/</i> (u.n/c.n): phương pháp luận, quy trình nghiên cứu</div><div class=\"vi sub\"><b>–</b> <b>methodology involve sth </b><i class=\"ph\">/ˌmeθəˈdɒlədʒi ɪnˈvɒlv/</i> (v.phr): phương pháp nghiên cứu bao gồm cái gì</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>confidentiality </b><i class=\"ph\">/ˌkɒnfɪˌdenʃiˈæləti/</i> (u.n): tính bảo mật</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>straightforward </b><i class=\"ph\">/ˌstreɪtˈfɔːwəd/</i> (adj): đơn giản, dễ thực hiện</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>inevitable </b><i class=\"ph\">/ɪnˈevɪtəbl/</i> (adj): không thể tránh khỏi, tất yếu</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>variable </b><i class=\"ph\">/ˈveəriəbl/</i> (c.n): biến số (trong thí nghiệm)</div><div class=\"vi sub\"><b>–</b> <b>add another variable </b><i class=\"ph\">/æd əˈnʌðə ˈveəriəbl/</i> (v.phr): thêm một biến số khác</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>genetic structure </b><i class=\"ph\">/dʒəˈnetɪk ˈstrʌktʃə/</i> (n.phr): cấu trúc di truyền</div><div class=\"vi sub\"><b>–</b> <b>genetic strain / genetic structure </b><i class=\"ph\">/dʒəˈnetɪk streɪn/</i> (n.phr): dòng/giống di truyền</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>control group</b> <i class=\"ph\">/kənˈtrəʊl ɡruːp/</i> (n.phr): nhóm đối chứng (trong thí nghiệm)</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>dry pellets </b><i class=\"ph\">/draɪ ˈpelɪts/</i> (n.phr): thức ăn viên khô</div><div class=\"vi sub\"><b>–</b> <b>come in dry pellets </b><i class=\"ph\">/kʌm ɪn draɪ ˈpelɪts/</i> (v.phr): ở dạng viên khô</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>electronic scale / balance </b><i class=\"ph\">/ɪˌlekˈtrɒnɪk skeɪl/</i> (n.phr): cân điện tử</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>standard deviation </b><i class=\"ph\">/ˈstændəd ˌdiːviˈeɪʃn/</i> (n.phr): độ lệch chuẩn (thống kê)</div><div class=\"vi sub\"><b>–</b> <b>work out the standard deviation </b><i class=\"ph\">/wɜːk aʊt ðə ˈstændəd ˌdiːviˈeɪʃn/</i> (v.phr): tính toán độ lệch chuẩn</div>"}, {"t": "Reading", "i": "III. Vocabulary for Reading (55 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>aquatic</b> <i class=\"ph\">/əˈkwætɪk/</i> (adj): thuộc thủy sinh, sống dưới nước</div><div class=\"vi sub\"><b>–</b> <b>aquatic plant</b> <i class=\"ph\">/əˈkwætɪk plɑːnt/</i> (n.phr): thực vật thủy sinh</div><div class=\"vi sub\"><b>–</b> <b>aquatic weed</b> <i class=\"ph\">/əˈkwætɪk wiːd/</i> (n.phr): cỏ dại thủy sinh</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>native to sth</b> <i class=\"ph\">/ˈneɪtɪv tuː/</i> (a.phr): có nguồn gốc bản địa ở đâu</div><div class=\"vi sub\"><b>–</b> <b>native to South America</b> <i class=\"ph\">/ˈneɪtɪv tuː saʊθ əˈmerɪkə/</i> (a.phr): có nguồn gốc từ Nam Mỹ</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>spread</b> <i class=\"ph\">/spred/</i> (v/u.n): lan rộng; sự lan rộng</div><div class=\"vi sub\"><b>–</b> <b>the spread of sth</b> <i class=\"ph\">/ðə spred əv/</i> (n.phr): sự lan rộng của cái gì</div><div class=\"vi sub\"><b>– spread in the open water</b> <i class=\"ph\">/spred ɪn ði ˈəʊpən ˈwɔːtə/</i> (v.phr): lan rộng trên vùng nước thoáng</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>pond</b> <i class=\"ph\">/pɒnd/</i>(c.n): cái ao</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>downstream</b> <i class=\"ph\">/ˌdaʊnˈstriːm/</i> (adv/adj): về phía hạ lưu, xuôi dòng</div><div class=\"vi sub\"><b>– make its way downstream to sth</b> <i class=\"ph\">/meɪk ɪts weɪ ˌdaʊnˈstriːm tuː/</i> (v.phr): trôi xuôi dòng đến nơi nào đó</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>habitat</b> <i class=\"ph\">/ˈhæbɪtæt/</i> (c.n): môi trường sống</div><div class=\"vi sub\"><b>– provide a new habitat for sth</b> <i class=\"ph\">/prəˈvaɪd ə njuː ˈhæbɪtæt fɔː/</i> (v.phr): tạo ra môi trường sống mới cho cái gì</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>disease-carrying mosquitoes</b> <i class=\"ph\">/dɪˈziːz ˈkæriɪŋ məˈskiːtəʊz/</i> (n.phr): muỗi mang mầm bệnh</div><div class=\"vi sub\"><b>– disease-carrying</b> <i class=\"ph\">/dɪˈziːz ˈkæriɪŋ/</i> (adj): mang mầm bệnh</div><div class=\"vi sub\"><b>– mosquito</b> <i class=\"ph\">/məˈskiːtəʊ/</i> (c.n): con muỗi</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>predator</b> <i class=\"ph\">/ˈpredətə/</i> (c.n): động vật săn mồi, thiên địch</div><div class=\"vi sub\"><b>– natural predators</b> <i class=\"ph\">/ˈnætʃrəl ˈpredətəz/</i> (n.phr): thiên địch tự nhiên</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>obstruct</b> <i class=\"ph\">/əbˈstrʌkt/</i> = <b>block</b> <i class=\"ph\">/blɒk/</i> (v): cản trở, làm tắc nghẽn</div><div class=\"vi sub\"><b>– block fishing routes</b> <i class=\"ph\">/blɒk ˈfɪʃɪŋ ruːts/</i> (v.phr): chặn các tuyến đường đánh cá</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>menace</b> <i class=\"ph\">/ˈmenəs/</i> (c.n): mối đe dọa, thứ gây phiền toái</div><div class=\"vi sub\"><b>– the dual menaces of A and B</b> <i class=\"ph\">/ðə ˈdjuːəl ˈmenəsɪz əv ... ənd .../</i> (n.phr): hai mối đe dọa kép của A và B</div><div class=\"vi\">= <b>dangers posed by sth</b> <i class=\"ph\">/ˈdeɪndʒəz pəʊzd baɪ/</i> (n.phr): những mối nguy do cái gì gây ra</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>introduce</b> <i class=\"ph\">/ˌɪntrəˈdjuːs/</i> (v): đưa (một loài, một giống) vào nơi mới</div><div class=\"vi sub\"><b>– introduce sth as a decorative plant</b> <i class=\"ph\">/ˌɪntrəˈdjuːs ... æz ə ˈdekərətɪv plɑːnt/</i> (v.phr): đưa cái gì vào như một loại cây cảnh</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>remove</b> <i class=\"ph\">/rɪˈmuːv/</i> = <b>clear</b> <i class=\"ph\">/klɪə/</i> (v): loại bỏ, dọn đi</div><div class=\"vi sub\"><b>– remove water hyacinth from the lake</b> <i class=\"ph\">/rɪˈmuːv ˈwɔːtə ˈhaɪəsɪnθ frɒm ðə leɪk/</i> (v.phr): loại bỏ lục bình khỏi hồ</div><div class=\"vi sub\"><b>– take sth out of the water</b> <i class=\"ph\">/teɪk ... aʊt əv ðə ˈwɔːtə/</i> (v.phr): vớt cái gì ra khỏi mặt nước</div><div class=\"vi sub\"><b>– clear the water</b> <i class=\"ph\">/klɪə ðə ˈwɔːtə/</i> (v.phr): dọn sạch mặt nước</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>foliage</b> <i class=\"ph\">/ˈfəʊliɪdʒ/</i> (u.n): tán lá, cành lá</div><div class=\"vi sub\"><b>– leaves</b> <i class=\"ph\">/liːvz/</i> (c.n, số nhiều của \"leaf\"): những chiếc lá</div><div class=\"vi sub\"><b>– decaying waxy leaves</b> <i class=\"ph\">/dɪˈkeɪɪŋ ˈwæksi liːvz/</i> (n.phr): những chiếc lá phủ sáp đang phân hủy</div><div class=\"vi sub\"><b>– glossy leaves</b> <i class=\"ph\">/ˈɡlɒsi liːvz/</i> (n.phr): những cái lá bóng</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>decay</b> <i class=\"ph\">/dɪˈkeɪ/</i> (v): phân hủy, mục nát</div><div class=\"vi sub\"><b>– break down</b> <i class=\"ph\">/breɪk daʊn/</i> (phr.v): phân hủy, bị phân tách</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>fermentation</b> <i class=\"ph\">/ˌfɜːmenˈteɪʃn/</i> (u.n): sự lên men</div><div class=\"vi sub\"><b>– a fermentation process</b> <i class=\"ph\">/ə ˌfɜːmenˈteɪʃn ˈprəʊses/</i> (n.phr): quá trình lên men</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>ratio</b> <i class=\"ph\">/ˈreɪʃiəʊ/</i> (c.n): tỷ lệ</div><div class=\"vi sub\"><b>– a high ratio of A to B</b> <i class=\"ph\">/ə haɪ ˈreɪʃiəʊ əv ... tuː/</i> (n.phr): tỷ lệ A so với B cao</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>manure</b> <i class=\"ph\">/məˈnjʊə/</i> = <b>dung</b> <i class=\"ph\">/dʌŋ/</i> (u.n): phân chuồng</div><div class=\"vi sub\"><b>– chicken manure</b> <i class=\"ph\">/ˈtʃɪkɪn məˈnjʊə/</i> (n.phr): phân gà</div><div class=\"vi sub\"><b>– cow dung</b> <i class=\"ph\">/kaʊ dʌŋ/</i> (n.phr): phân bò</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>yield</b> <i class=\"ph\">/jiːld/</i> (c.n): sản lượng, lượng thu được</div><div class=\"vi sub\"><b>– better yields of biofuel gas</b> <i class=\"ph\">/ˈbetə jiːldz əv ˈbaɪəʊfjuːəl ɡæs/</i> (n.phr): sản lượng khí nhiên liệu sinh học cao hơn</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>convert</b> <i class=\"ph\">/kənˈvɜːt/</i> = <b>transform</b> <i class=\"ph\">/trænsˈfɔːm/</i> (v): chuyển đổi, biến đổi</div><div class=\"vi sub\"><b>– convert sth into sth</b> <i class=\"ph\">/kənˈvɜːt ˈɪntuː/</i> (v.phr): chuyển đổi cái gì thành cái gì</div><div class=\"vi sub\"><b>– convert the weed into gas</b> <i class=\"ph\">/kənˈvɜːt ðə wiːd ˈɪntuː ɡæs/</i> (v.phr): biến cỏ dại thành khí đốt</div><div class=\"vi sub\"><b>– transform a mix of A and B into biogas</b> <i class=\"ph\">/trænsˈfɔːm ə mɪks əv ... ˈɪntuː ˈbaɪəʊɡæs/</i> (v.phr): biến hỗn hợp A và B thành khí sinh học</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>generate</b> <i class=\"ph\">/ˈdʒenəreɪt/</i> = <b>produce</b> <i class=\"ph\">/prəˈdjuːs/</i> (v): tạo ra, sản sinh</div><div class=\"vi sub\"><b>– generate biogas</b> <i class=\"ph\">/ˈdʒenəreɪt ˈbaɪəʊɡæs/</i> (v.phr): tạo ra khí sinh học</div><div class=\"vi sub\"><b>– produce enough gas</b> <i class=\"ph\">/prəˈdjuːs ɪˈnʌf ɡæs/</i> (v.phr): sản xuất đủ lượng khí</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>purify</b> <i class=\"ph\">/ˈpjʊərɪfaɪ/</i> (v): làm sạch, tinh lọc</div><div class=\"vi sub\"><b>– purify water</b> <i class=\"ph\">/ˈpjʊərɪfaɪ ˈwɔːtə/</i> (v.phr): làm sạch nước</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>incubate</b> <i class=\"ph\">/ˈɪŋkjubeɪt/</i> (v): ấp (trứng)</div><div class=\"vi sub\">– <b>incubate chicks</b> <i class=\"ph\">/ˈɪŋkjubeɪt tʃɪks/</i> (v.phr): ấp gà con</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>emit</b> <i class=\"ph\">/ɪˈmɪt/</i> = <b>give off</b> <i class=\"ph\">/ɡɪv ɒf/</i> (v): thải ra, phát ra (khí, ánh sáng...)</div><div class=\"vi sub\">– <b>gas emitted by the digester</b> <i class=\"ph\">/ɡæs ɪˈmɪtɪd baɪ ðə daɪˈdʒestə/</i> (n.phr): khí do thiết bị phân hủy thải ra</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>explore</b> <i class=\"ph\">/ɪkˈsplɔː/</i> = <b>investigate</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt/</i> (v): khám phá, tìm hiểu, nghiên cứu</div><div class=\"vi sub\">– <b>explore its potential as sth</b> <i class=\"ph\">/ɪkˈsplɔː ɪts pəˈtenʃl æz/</i> (v.phr): tìm hiểu tiềm năng của nó như là cái gì</div><div class=\"vi sub\">– <b>investigate the possibility of doing sth</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt ðə ˌpɒsəˈbɪləti əv ˈduːɪŋ/</i> (v.phr): nghiên cứu khả năng làm gì</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>potential</b> <i class=\"ph\">/pəˈtenʃl/</i> = <b>possibility</b> <i class=\"ph\">/ˌpɒsəˈbɪləti/</i> (u.n/adj): tiềm năng; có tiềm năng</div><div class=\"vi sub\">– <b>its potential as a biofuel</b> <i class=\"ph\">/ɪts pəˈtenʃl æz ə ˈbaɪəʊfjuːəl/</i> (n.phr): tiềm năng của nó như một loại nhiên liệu sinh học</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>confirm</b> <i class=\"ph\">/kənˈfɜːm/</i> = <b>prove</b> <i class=\"ph\">/pruːv/</i> (v): xác nhận, khẳng định</div><div class=\"vi sub\">– <b>confirm what sb has found</b> <i class=\"ph\">/kənˈfɜːm wɒt ... hæz faʊnd/</i> (v.phr): xác nhận điều ai đó đã tìm ra</div><div class=\"vi sub\">– <b>be proved to be sth</b> <i class=\"ph\">/biː pruːvd tuː biː/</i> (v.phr): được chứng minh là cái gì</div><div class=\"vi\"><span class=\"vn\">27.</span> <b>estimate</b> <i class=\"ph\">/ˈestɪmeɪt/</i> = <b>predict</b> <i class=\"ph\">/prɪˈdɪkt/</i> (v/c.n): ước tính</div><div class=\"vi sub\">– <b>estimate that + clause</b> <i class=\"ph\">/ˈestɪmeɪt ðæt/</i> (v.phr): ước tính rằng...</div><div class=\"vi sub\">– <b>early research predicted that...</b> <i class=\"ph\">/ˈɜːli rɪˈsɜːtʃ prɪˈdɪktɪd ðæt/</i> (n.phr): nghiên cứu ban đầu dự đoán rằng...</div><div class=\"vi\"><span class=\"vn\">28.</span> <b>renewable energy</b> <i class=\"ph\">/rɪˈnjuːəbl ˈenədʒi/</i> (n.phr): năng lượng tái tạo</div><div class=\"vi sub\">– <b>clean burning gas</b> <i class=\"ph\">/kliːn ˈbɜːnɪŋ ɡæs/</i> (n.phr): khí đốt cháy sạch</div><div class=\"vi\"><span class=\"vn\">29.</span> <b>gold mine</b> <i class=\"ph\">/ɡəʊld maɪn/</i> (c.n): mỏ vàng; nguồn lợi lớn</div><div class=\"vi sub\">– <b>a renewable energy gold mine</b> <i class=\"ph\">/ə rɪˈnjuːəbl ˈenədʒi ɡəʊld maɪn/</i> (n.phr): một \"mỏ vàng\" năng lượng tái tạo</div><div class=\"vi\"><span class=\"vn\">30.</span> <b>biofuel</b> <i class=\"ph\">/ˈbaɪəʊfjuːəl/</i>(c.n/u.n): nhiên liệu sinh học</div><div class=\"vi sub\">– <b>its potential as a biofuel</b> <i class=\"ph\">/ɪts pəˈtenʃl æz ə ˈbaɪəʊfjuːəl/</i> (n.phr): tiềm năng của nó như một loại nhiên liệu sinh học</div><div class=\"vi sub\">– <b>biofuel gas</b> <i class=\"ph\">/ˈbaɪəʊfjuːəl ɡæs/</i> (n.phr): khí nhiên liệu sinh học</div><div class=\"vi\"><span class=\"vn\">31.</span> <b>biogas</b> <i class=\"ph\">/ˈbaɪəʊɡæs/</i> (u.n): khí sinh học</div><div class=\"vi sub\">– <b>biogas digesters</b> <i class=\"ph\">/ˈbaɪəʊɡæs daɪˈdʒestəz/</i> (n.phr): thiết bị/lò phân hủy tạo khí sinh học</div><div class=\"vi sub\">– <b>biogas stoves</b> <i class=\"ph\">/ˈbaɪəʊɡæs stəʊvz/</i> (n.phr): bếp dùng khí sinh học</div><div class=\"vi sub\">– <b>transform A into biogas for cooking</b> <i class=\"ph\">/trænsˈfɔːm ... ˈɪntuː ˈbaɪəʊɡæs fɔː ˈkʊkɪŋ/</i> (v.phr): biến A thành khí sinh học để nấu ăn</div><div class=\"vi\"><span class=\"vn\">32.</span> <b>solid fuel</b> <i class=\"ph\">/ˈsɒlɪd ˈfjuːəl/</i> (n.phr): nhiên liệu rắn (củi, than...)</div><div class=\"vi sub\">– <b>use solid fuels for cooking</b> <i class=\"ph\">/juːz ˈsɒlɪd ˈfjuːəlz fɔː ˈkʊkɪŋ/</i> (v.phr): dùng nhiên liệu rắn để nấu ăn</div><div class=\"vi sub\">– <b>dirty fuels</b> <i class=\"ph\">/ˈdɜːti ˈfjuːəlz/</i> (n.phr): nhiên liệu gây ô nhiễm</div><div class=\"vi\"><span class=\"vn\">33.</span> <b>air pollution</b> <i class=\"ph\">/eə pəˈluːʃn/</i> (n.phr): ô nhiễm không khí</div><div class=\"vi sub\">– <b>indoor air pollution</b> <i class=\"ph\">/ˈɪndɔː eə pəˈluːʃn/</i> (n.phr): ô nhiễm không khí trong nhà</div><div class=\"vi sub\">– <b>increase indoor pollution</b> <i class=\"ph\">/ɪnˈkriːs ˈɪndɔː pəˈluːʃn/</i> (v.phr): làm tăng ô nhiễm trong nhà</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>discover</b> <i class=\"ph\">/dɪˈskʌvə/</i> (v): khám phá, phát hiện</div><div class=\"vi sub\">– <b>discover new things</b> <i class=\"ph\">/dɪˈskʌvə njuː θɪŋz/</i> (v.phr): khám phá những điều mới</div><div class=\"vi sub\">– <b>discovery</b> <i class=\"ph\">/dɪˈskʌvəri/</i> (c.n / u.n): sự khám phá, phát hiện</div><div class=\"vi sub\">– <b>self–discovery</b> <i class=\"ph\">/ˌself dɪˈskʌvəri/</i> (u.n): sự khám phá bản thân, sự tự nhận thức về bản thân</div><div class=\"vi sub\">– <b>the process of discovery</b> <i class=\"ph\">/ðə ˈprəʊses əv dɪˈskʌvəri/</i> (n.phr): quá trình khám phá</div><div class=\"vi sub\">– <b>personal discovery</b> <i class=\"ph\">/ˈpɜːsənl dɪˈskʌvəri/</i> (n.phr): sự khám phá bản thân</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>species</b> <i class=\"ph\">/ˈspiːʃiːz/</i> (c.n): loài (sinh vật)</div><div class=\"vi sub\">– <b>our species</b> <i class=\"ph\">/aʊə ˈspiːʃiːz/</i> (n.phr): loài người chúng ta</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>investigate</b> <i class=\"ph\">/ɪnˈvestɪɡeɪt/</i> = <b>explore</b> <i class=\"ph\">/ɪkˈsplɔː/</i> (v): điều tra, nghiên cứu, tìm hiểu</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>unknown</b> <i class=\"ph\">/ʌnˈnəʊn/</i> (adj/n): chưa được biết đến; điều chưa biết</div><div class=\"vi sub\">– <b>borders of the unknown</b> <i class=\"ph\">/ˈbɔːdəz əv ði ʌnˈnəʊn/</i> (n.phr): ranh giới của những điều chưa biết</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>spread</b> <i class=\"ph\">/spred/</i> (v): lan rộng, phát tán</div><div class=\"vi sub\">– <b>spread around the globe</b> <i class=\"ph\">/spred əˈraʊnd ðə ɡləʊb/</i> (v.phr): lan rộng khắp toàn cầu</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>depleted</b> <i class=\"ph\">/dɪˈpliːtɪd/</i> (adj): bị cạn kiệt, suy giảm</div><div class=\"vi sub\">– <b>depleted forests</b> <i class=\"ph\">/dɪˈpliːtɪd ˈfɒrɪsts/</i> (n.phr): những khu rừng bị suy giảm</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>existence</b> <i class=\"ph\">/ɪɡˈzɪstəns/</i> (u.n): sự tồn tại, sự sinh tồn</div><div class=\"vi sub\">– <b>maintain one’s existence</b> <i class=\"ph\">/meɪnˈteɪn wʌnz ɪɡˈzɪstəns/</i> (v.phr): duy trì sự tồn tại</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>instinct</b> <i class=\"ph\">/ˈɪnstɪŋkt/</i> (c.n / u.n): bản năng</div><div class=\"vi sub\">– <b>enquiring instinct</b> <i class=\"ph\">/ɪnˈkwaɪərɪŋ ˈɪnstɪŋkt/</i> (n.phr): bản năng ham tìm tòi</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>marine biologist</b> <i class=\"ph\">/məˈriːn baɪˈɒlədʒɪst/</i> (c.n): nhà sinh vật học biển</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>astronomer</b> <i class=\"ph\">/əˈstrɒnəmə/</i> (c.n): nhà thiên văn học</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>uncultivated</b> <i class=\"ph\">/ʌnˈkʌltɪveɪtɪd/</i> (adj): chưa được canh tác, hoang hóa</div><div class=\"vi sub\">– <b>uncultivated land</b> <i class=\"ph\">/ʌnˈkʌltɪveɪtɪd lænd/</i> (n.phr): đất hoang</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>landscape</b> <i class=\"ph\">/ˈlændskeɪp/</i> (c.n / u.n): phong cảnh, cảnh quan</div><div class=\"vi sub\">– <b>use the landscape to suggest sth</b> <i class=\"ph\">/juːz ðə ˈlændskeɪp tə səˈdʒest ˈsʌmθɪŋ/</i> (v.phr): dùng cảnh quan để gợi lên điều gì</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>remote</b> <i class=\"ph\">/rɪˈməʊt/</i> = <b>isolated</b> <i class=\"ph\">/ˈaɪsəleɪtɪd/</i> (adj): xa xôi, hẻo lánh</div><div class=\"vi sub\">– <b>remote places</b> <i class=\"ph\">/rɪˈməʊt ˈpleɪsɪz/</i> (n.phr): những nơi xa xôi, hẻo lánh</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>decline</b> <i class=\"ph\">/dɪˈklaɪn/</i> = <b>decrease</b> <i class=\"ph\">/ˈdiːkriːs/</i> (n): sự suy giảm, sự giảm sút</div><div class=\"vi sub\">– <b>on the decline</b> <i class=\"ph\">/ɒn ðə dɪˈklaɪn/</i> (prep.phr): đang suy giảm</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>bacteria</b> <i class=\"ph\">/bækˈtɪəriə/</i> (c.n): vi khuẩn (số nhiều)</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>ocean floor</b> <i class=\"ph\">/ˈəʊʃn flɔː/</i> (c.n): đáy đại dương</div><div class=\"vi sub\">– <b>map the ocean floor</b> <i class=\"ph\">/mæp ði ˈəʊʃn flɔː/</i> (v.phr): lập bản đồ đáy đại dương</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>scientist</b> <i class=\"ph\">/ˈsaɪəntɪst/</i> (c.n): nhà khoa học</div><div class=\"vi sub\">– <b>scientifically useful</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪkli ˈjuːsfl/</i> (a.phr): hữu ích về mặt khoa học</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>findings</b> <i class=\"ph\">/ˈfaɪndɪŋz/</i> (c.n): kết quả nghiên cứu</div><div class=\"vi sub\">– <b>record one’s findings</b> <i class=\"ph\">/rɪˈkɔːd wʌnz ˈfaɪndɪŋz/</i> (v.phr): ghi lại kết quả nghiên cứu</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>expedition</b> <i class=\"ph\">/ˌekspɪˈdɪʃn/</i> = <b>voyage</b> <i class=\"ph\">/ˈvɔɪɪdʒ/</i> (c.n): chuyến thám hiểm</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>microbe</b> <i class=\"ph\">/ˈmaɪkrəʊb/</i> (c.n): vi sinh vật</div><div class=\"vi sub\">– <b>the habits of microbes</b> <i class=\"ph\">/ðə ˈhæbɪts əv ˈmaɪkrəʊbz/</i> (n.phr): tập tính của vi sinh vật</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>behaviour</b> <i class=\"ph\">/bɪˈheɪvjə/</i> (u.n): hành vi, tập tính</div><div class=\"vi sub\"><b>–</b> <b>the grazing behaviour of buffalo</b> <i class=\"ph\">/ðə ˈɡreɪzɪŋ bɪˈheɪvjər əv ˈbʌfələʊ/</i> (n.phr): tập tính gặm cỏ của trâu rừng</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>deep sea</b> <i class=\"ph\">/ˌdiːp ˈsiː/</i> (n.phr): biển sâu</div>"}, {"t": "Speaking", "i": "IV. Vocabulary for Speaking (25 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>demonstration</b> <i class=\"ph\">/ˌdemənˈstreɪʃn/</i> (c.n): sự thuyết minh, sự biểu diễn, sự chứng minh</div><div class=\"vi sub\"><b>–</b> <b>demonstrate</b> <i class=\"ph\">/ˈdemənstreɪt/</i> (v): minh họa, chứng minh, biểu diễn</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>theoretical</b> <i class=\"ph\">/ˌθiːəˈretɪkl/</i> (adj): mang tính lý thuyết</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>practical </b><i class=\"ph\">/ˈpræktɪkl/</i> = <b>pragmatic</b> <i class=\"ph\">/præɡˈmætɪk/</i> (adj): thực tế, thực dụng, có tính thực tiễn cao</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>documentary</b> <i class=\"ph\">/ˌdɑːkjəˈmentəri/</i> (c.n): phim tài liệu</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>STEM</b> <i class=\"ph\">/stem/</i> (u.n): Khoa học, Công nghệ, Kỹ thuật và Toán học</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>equipment</b> <i class=\"ph\">/ɪˈkwɪpmənt/</i> (u.n): thiết bị, trang thiết bị</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>outer space</b> <i class=\"ph\">/ˈaʊtər speɪs/</i> = <b>the universe</b> <i class=\"ph\">/ðə ˈjuːnɪvɜːrs/</i> (n.phr): không gian vũ trụ, vũ trụ</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>scientific</b> <b>breakthrough</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪk ˈbreɪkθruː/</i> (n.phr): bước đột phá khoa học</div><div class=\"vi sub\"><b>–</b> <b>conduct a science experiment /</b>kənˈdʌkt ə ˈsaɪəns ɪkˈsperɪmənt/ (v.phr): tiến hành một thí nghiệm khoa học</div><div class=\"vi sub\"><b>–</b> <b>scientific principle</b> <i class=\"ph\">/ˌsaɪənˈtɪfɪk ˈprɪnsəpl/</i> (n.phr): nguyên lý khoa học</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>leave a strong impression on sb</b> <i class=\"ph\">/liːv ə strɔːŋ ɪmˈpreʃn ɒn ˈsʌmbədi/</i> (v.phr): để lại ấn tượng mạnh mẽ đối với ai đó</div><div class=\"vi sub\"><b>–</b> <b>deeply impressed</b> <i class=\"ph\">/ˈdiːpli ɪmˈprest/</i> (adj): ấn tượng sâu sắc</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>chemistry lab</b> <i class=\"ph\">/ˈkemɪstri læb/</i> (n.phr): phòng thí nghiệm hóa học</div><div class=\"vi sub\"><b>–</b> <b>chemical reaction</b> <i class=\"ph\">/ˈkemɪkl riˈækʃn/</i> (n.phr): phản ứng hóa học</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>observe a phenomenon</b> <i class=\"ph\">/əbˈzɜːrv ə fəˈnɑːmɪnən/</i> (v.phr): quan sát một hiện tượng</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>fascinate</b> <i class=\"ph\">/ˈfæsɪneɪt/</i> (v): làm mê hoặc, thu hút sự chú ý của ai</div><div class=\"vi sub\"><b>–</b> <b>be fascinated by sth</b> <i class=\"ph\">/ˈfæsɪneɪtɪd baɪ/</i> (adj.phr): bị mê hoặc, vô cùng thích thú bởi cái gì</div><div class=\"vi sub\"><b>–</b> <b>fascinating</b> <i class=\"ph\">/ˈfæsɪneɪtɪŋ/</i> (adj): hấp dẫn, cực kỳ thú vị</div><div class=\"vi sub\"><b>–</b> <b>fascinating visual effect</b> <i class=\"ph\">/ˈfæsɪneɪtɪŋ ˈvɪʒuəl ɪˈfekt/</i> (n.phr): hiệu ứng thị giác cực kỳ thú vị</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>spark one's curiosity</b> <i class=\"ph\">/spɑːrk ˌkjʊriˈɑːsəti/</i> (v.phr): khơi dậy sự tò mò của ai đó</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>hands-on experience</b> <i class=\"ph\">/ˌhændz ˈɑːn ɪkˈspɪriəns/</i> (n.phr): trải nghiệm thực tế / thực hành trực tiếp</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>botanical garden</b> <i class=\"ph\">/bəˈtænɪkl ˈɡɑːrdn/</i> (n.phr): vườn bách thảo</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>natural scenery</b> <i class=\"ph\">/ˈnætʃrəl ˈsiːnəri/</i> (n.phr): phong cảnh thiên nhiên</div><div class=\"vi sub\"><b>– spoil the natural beauty</b> <i class=\"ph\">/spɔɪl ðə ˈnætʃrəl ˈbjuːti/</i> (v.phr): làm hỏng vẻ đẹp tự nhiên</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>wild animal</b> <i class=\"ph\">/waɪld ˈænɪml/</i> (n.phr) = <b>wildlife</b> <i class=\"ph\">/ˈwaɪldlaɪf/</i> (u.n): động vật hoang dã</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>single-use plastic</b> <i class=\"ph\">/ˈsɪŋɡl juːs ˈplæstɪk/</i> (n.phr): nhựa sử dụng một lần</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>straw</b> <i class=\"ph\">/strɔː/</i> (c.n): ống hút</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>plastic waste / pollution</b> <i class=\"ph\">/ˈplæstɪk weɪst / pəˈluːʃn/</i> (u.n): rác thải nhựa / sự ô nhiễm nhựa</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>littered with trash</b> <i class=\"ph\">/ˈlɪtərd wɪð træʃ/</i> (adj.phr): tràn ngập rác, vương vãi rác</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>wash ashore</b> <i class=\"ph\">/wɑːʃ əˈʃɔːr/</i> (v.phr): tạt vào bờ, trôi dạt vào bờ (rác thải biển)</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>ecosystem / environmental degradation</b> <i class=\"ph\">/ˈiːkoʊsɪstəm ˌ/</i> ɪnˌvaɪrənˈmentəl deɡrəˈdeɪʃn/ (n.phr): sự suy thoái hệ sinh thái</div><div class=\"vi sub\"><b>–</b> <b>environmental awareness</b> <i class=\"ph\">/ɪnˌvaɪrənˈmentəl əˈwernəs/</i> (u.n): ý thức bảo vệ môi trường</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>disheartening sight</b> <i class=\"ph\">/dɪsˈhɑːrtnɪŋ saɪt/</i> (n.phr): cảnh tượng nản lòng, đau lòng</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>take immediate action</b> <i class=\"ph\">/teɪk ɪˈmiːdiət ˈækʃn/</i> (v.phr): hành động ngay lập tức</div>"}, {"t": "Writing", "i": "V. Vocabulary for Writing (59 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><div class=\"vi\"><span class=\"vn\">1.</span> <b>diagram</b> <i class=\"ph\">/ˈdaɪəɡræm/</i> (c.n): sơ đồ, biểu đồ</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>explain </b><i class=\"ph\">/ɪkˈspleɪn/</i> =<b> demonstrate </b><i class=\"ph\">/ˈdemənstreɪt/</i> = <b>exhibit </b><i class=\"ph\">/ɪɡˈzɪbɪt/</i> =<b> display </b><i class=\"ph\">/dɪˈspleɪ/</i> =<b> illustrate </b><i class=\"ph\">/ˈɪləstreɪt/</i> (v): giải thích, trình bày, thể hiện, cho thấy</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>how to V0</b>: cách làm gì</div><div class=\"vi sub\"><b>–</b>
