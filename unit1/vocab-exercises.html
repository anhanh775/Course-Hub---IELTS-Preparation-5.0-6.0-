n a single weekend without taking any break.|chill out|immerse herself in|wind down|watch slowly|3\nThe protagonist is a very complex [[character]] with both inspiring traits and deep personal flaws.|novice|real person|beginner|instrument|1\nI have always [[had a soft spot for]] classic acoustic music because it brings back fond childhood memories.|been fond of|developed a keen interest in|strongly disliked|been impressed by|2\nUsing [[an electronic device]] right before bedtime can negatively affect your sleep quality.|non-digital equipment|streaming platform|interactive media|digital tool|0"}, {"t": "Exercise 2", "k": "m", "i": "Choose the correct answer.", "d": "After four years of hard work, John is going to ________ Harvard University next month.|major in|graduate from|attend an extra class|excel at|0\nEnglish and Mathematics are ________ subjects in high school, so every student must take them.|optional|efficient|compulsory|excellent|2\nStudying for the medical entrance exam was an ________ that required years of dedication.|arduous process|optional subject|extra class|effective message|0\nInstead of traditional teaching, the school encourages ________ so students can learn from one another.|peer-to-peer learning|physical activity|soft spot|streaming service|0\nSarah always shows great ________ for studying; she is always eager to learn new things.|flop|lecture|zeal|character|2\nIf you want to finish your degree on time, you need to learn how to spend your time ________.|mandatorily|optionally|distractedly|productively|3\nHe decided to ________ Computer Science because he has a strong interest in technology.|lose focus|major in|let his hair down|binge watch|1\nNoise in the library caused her to ________ and fail to complete her assignment.|excel in|stay in shape|lose focused|get distracted|3\nArt and Music are ________; you can choose them if you like, but they are not required.|mandatory|obligatory|optional|arduous|2\nTo master a new language ________, students should combine grammar practice with daily conversation.|compulsorily|arduously|physically|efficiently|3\nShe was unable to ________ her homework because of the loud noise outside.|focus on|binge watch|wind down|pump up|0\nMinh always manages to ________ Mathematics thanks to his sharp logical thinking.|get distracted|lose focus|excel at|graduate from|2\nAll students are expected to ________ on American History this afternoon in the main hall.|take up a habit|attend a lecture|engage in physical activity|break a habit|1\nAttendance at the orientation meeting is ________ for all new freshmen before classes begin.|optional|distracted|efficient|mandatory|3\nStudying different subjects at school can really broaden my ________ by exposing me to new ideas and different ways of thinking.|horizons|mindset|thinking|ability|0"}, {"t": "Exercise 3", "k": "w", "i": "Solve the crossword, using the clues below. (Dấu gạch ngang đã điền sẵn.)", "w": [["literate", 0, 25, "D", 1], ["outweigh", 2, 23, "A", 2], ["character", 5, 15, "A", 3], ["addiction", 5, 19, "D", 4], ["zeal", 5, 28, "D", 5], ["award-winning", 7, 3, "D", 6], ["detrimental", 7, 19, "A", 7], ["excellent", 9, 17, "A", 8], ["aptitude", 10, 1, "D", 9], ["comprehensive", 10, 12, "D", 10], ["versatile", 10, 15, "D", 11], ["concerned", 11, 5, "D", 12], ["benefit", 11, 14, "A", 13], ["accomplishment", 13, 7, "A", 14], ["beginner-friendly", 17, 0, "A", 15]], "cl": ["<div style=\"margin:3px 0\">2. to be greater or more important than something else</div><div style=\"margin:3px 0\">3. a person in a novel, play, or movie; or the particular combination of qualities in a person</div><div style=\"margin:3px 0\">7. causing harm or damage</div><div style=\"margin:3px 0\">8. extremely good or outstanding</div><div style=\"margin:3px 0\">13. an advantage or something that helps you</div><div style=\"margin:3px 0\">14. something that has been achieved successfully</div><div style=\"margin:3px 0\">15. easy to use or understand for someo  concentrate on your studies, show a zeal for learning, and manage your schedule effectively.|gain success|achieve/achieve success/attain/reach\nThe school offers a mixed-ability environment where students are encouraged to make an aptitude for arts, engage in peer-to-peer learning, and attend lectures regularly.|make an aptitude|show/show an aptitude/develop/develop an aptitude\nModern digital connectivity allows students to reap the benefits of online resources, but excessive screen time can make more harm than good to their eyes and mental health.|make more harm|do/do more harm\nMy brother chose to major at Software Engineering because he wants to excel at coding and enjoy a flexible working schedule after he graduates from university.|major at|in/major in\nDeveloping the habit of reading daily can leave a lasting impression on a child's literacy skills, helping them achieve an achievement in school and blow off some steam after arduous processes of studying.|achieve an achievement|make/make an achievement/gain/gain an achievement/earn\nJoining student clubs is an optional subject where students can let their hair down and pump up their spirits after class.|optional subject|optional activity/an optional activity/optional club/extracurricular activity/activity\nI deeply believe that the benefits of interactive media outweigh its drawbacks, provided that users learn how to break a bad habit and avoid digital obesity.|deeply believe|firmly/strongly/firmly believe/strongly believe\nThe award-winning movie was praised for its ability to convey a positive message on kindness and compassion to viewers around the world.|message on|about/to/of/message about"}, {"t": "Exercise 6 (P1)", "k": "b", "box": "broaden our horizons/compulsory/concentrate on my studies/critical thinking/excel at/intellectually stimulating/lose focus/optional subject/spend time productively/supportive", "i": "Fill in the blank with the correct word from the box.", "d": "<b>What do you usually do aft hape/wind down/work out", "i": "Fill in the blank with the correct word from the box.", "d": "<b>Do you listen to music when you want to relax?</b><br>Yes. I usually listen to music in the evening to _____ after a long day.|wind down\n<b>Do you have a favorite singer or band?</b><br>Yes, I'm _____ this singer because I love the way they write emotional songs.|a big fan of\n<b>What kind of music do you like?</b><br>I tend to listen to pop music because I can _____ in it and forget about my daily worries.|immerse myself\n<b>Do you think music can influence people's mood?</b><br>Definitely. Upbeat music can really _____ when I'm feeling tired or stressed.|cheer me up\n<b>Is there any type of music you don't like?</b><br>Heavy metal is _____ because I find it a little too loud for my taste.|not my cup of tea\n<b>Do you play any sports?</b><br>Yes. I regularly _____ because I want to stay healthy and maintain a good level of fitness.|work out\n<b>Why do you think people enjoy playing sports?</b><br>For me, exercising helps me unwind and keeps me _____ throughout the day.|energized\n<b>Do you prefer watching or playing sports?</b><br>I prefer playing sports because I can _____ while hanging out with my friends and forget about my studies for a while.|stay in shape\n<b>Is there a sport that is popular in your country?</b><br>Yes, football is definitely _____ among young people, and you can see people playing it almost everywhere.|all the rage\n<b>Do you think sports can have a positive impact on people?</b><br>Absolutely. Regular physical activity can _____ a positive message and also teach people how to work as a team.|convey"}, {"t": "Exercise 7 (P1)", "k": "m", "i": "Choose the correct answer.", "d": "I found the subject __________ because we were constantly challenged to think, discuss and come up with our own ideas.|compulsory|practical and useful|intellectually stimulating|efficient|2\nMy English teacher was __________, so she was quite demanding but always willing to help us when we had difficulties.|optional|strict but supportive|arduous|a peer|1\nStudying English helped me __________, especially when I had to communicate with people from other countries.|attend an ardous lecture|broaden my speaking horizons|improve my communication skills|lose immediate focus|2\nInstead of simply giving us the answers, she would __________ and let us discuss different ideas.|graduate with honors|provide useful answers|spend time productively|encourage students to ask questions|3\nThe subject also taught me to __________ instead of simply memorising information.|give practical examples|make lessons engaging|solve problems logically|attend a class|2\nI particularly enjoyed the classes because my teacher knew how to __________ through discussions, games and group activities.|excel at study|understand how things work|concentrate on lessons|make lessons engaging|3\nReading about different cultures and topics helped me __________ and see the world from different perspectives.|attend a lecture|lose focus|broaden my horizons|major in biology|2\nOne thing I particularly valued was being able to __________, for example, when travelling or talking to foreign friends.|apply what I learned in real life|spend time productively|develop critical thinking skills|get distracted from class|0\nShe exceled at __________, so even complicated grammar rules were easy for us to understand.|solving problems logically|explaining things clearly|giving practical examples|skipping a class|1\nI enjoyed the subject because my teacher would __________ instead of relying only on textbooks.|give practical examples|develop writing skills|excel at study|lose focus|0"}, {"t": "Exercise 7 (P1) – Match", "k": "x", "i": "Match each sentence (with its correct answer filled in) with the correct category.", "a": "CABABCBCAC", "p": "Describe the teacher / How they taught the subject\nWhat you actually learnt\nWhy you liked it", "d": "I found the subject <b>intellectually stimulating</b g hợp gu mình</div><div class=\"vi\"><span class=\"vn\">44.</span> <b>convey / spread a positive message about sth </b><i class=\"ph\">/kənˈveɪ / spred ə ˈpɒzətɪv ˈmesɪdʒ/</i> (v.phr): truyền bá thông điệp tích cực</div><div class=\"vi\"><span class=\"vn\">45.</span> <b>concentrate on sth </b><i class=\"ph\">/ˈkɒnsntreɪt ɒn/</i> = <b>focus on sth</b> <i class=\"ph\">/ˈfəʊkəs ɒn/</i> (v): tập trung vào</div><div class=\"vi sub\"><b>– lose focus </b><i class=\"ph\">/luːz ˈfəʊkəs/</i>= <b>get distracted</b> <i class=\"ph\">/ɡet dɪˈstræktɪd/</i> (v.phr): mất tập trung</div><div class=\"vi\"><span class=\"vn\">46.</span> <b>pump sb up </b><i class=\"ph\">/pʌmp ʌp/</i>= <b>cheer sb up </b><i class=\"ph\">/tʃɪə ʌp/</i> (phr.v): làm ai đó vui</div><div class=\"vi\"><span class=\"vn\">47.</span> <b>down in the dumps /</b>daʊn ɪn ðə dʌmps/ = <b>bored</b> <b>to death </b><i class=\"ph\">/bɔːd tə deθ/</i>(idm): buồn chán</div><div class=\"vi\"><span class=\"vn\">48.</span> <b>win an award </b><i class=\"ph\">/wɪn ən əˈwɔːd/</i> (v.phr): thắng giải</div><div class=\"vi sub\"><b>– award-winning </b><i class=\"ph\">/əˈwɔːd ˌwɪnɪŋ/</i> (adj): thắng được giải</div><div class=\"vi\"><span class=\"vn\">49.</span> <b>all the rage </b><i class=\"ph\">/ɔːl ðə reɪdʒ/</i> (idm): rất nổi</div><div class=\"vi\"><span class=\"vn\">50.</span> <b>have a soft spot for sb / sth </b><i class=\"ph\">/hæv ə sɒft spɒt fə(r)/</i> (idm): có cảm tình đặc biệt</div><div class=\"vi\"><span class=\"vn\">51.</span> <b>immerse myself in sth </b><i class=\"ph\">/ɪˈmɜːs maɪˈself ɪn/</i> (v.phr): đắm chìm (vào một cuốn sách / bộ phim)</div><div class=\"vi\"><span class=\"vn\">52.</span> <b>take up a habit </b><i class=\"ph\">/teɪk ʌp ə ˈhæbɪt/</i> (v.phr): tập thành thói quen (mới)</div><div class=\"vi\"><span class=\"vn\">53.</span> <b>break / get rid of a habit</b> <i class=\"ph\">/breɪk / ɡet rɪd əv ə ˈhæbɪt/</i> (v.phr): bỏ thói quen (xấu)</div><div class=\"vi\"><span class=\"vn\">54.</span> <b>keep me energized </b><i class=\"ph\">/kiːp mi ˈenədʒaɪzd/</i> (v.phr): giúp tôi tràn đầy năng lượng, duy trì năng lượng</div><div class=\"vi\"><span class=\"vn\">55.</span> <b>a complete waste of time</b> <i class=\"ph\">/ə kəmˈpliːt weɪst əv taɪm/</i> (n.phr): một sự lãng phí thời gian hoàn toàn</div><div class=\"vi\"><span class=\"vn\">56.</span> <b>live up to my expectations</b> <i class=\"ph\">/lɪv ʌp tə maɪ ˌekspekˈteɪʃnz/</i> (v.phr): đáp ứng được kỳ vọng của tôi</div><div class=\"vi\"><span class=\"vn\">57.</span> <b>lack originality</b> <i class=\"ph\">/læk əˌrɪdʒəˈnæləti/</i> (v.phr): thiếu tính sáng tạo / độc đáo</div><div class=\"vi\"><span class=\"vn\">58.</span> <b>a predictable storyline</b> <i class=\"ph\">/ə prɪˈdɪktəbl ˈstɔːrilaɪn/</i> (n.phr): một cốt truyện dễ đoán</div><div class=\"vi\"><span class=\"vn\">59.</span> <b>a complicated plot</b> <i class=\"ph\">/ə ˈkɒmplɪkeɪtɪd plɒt/</i> (n.phr): một cốt truyện phức tạp/rắc rối</div><div class=\"vi\"><span class=\"vn\">60.</span> <b>broaden my horizons</b> /ˈbrɔːdn maɪ <i class=\"ph\">/həˈraɪzənz/</i> (v.phr): mở rộng kiến thức, tầm nhìn</div><div class=\"vi\"><span class=\"vn\">61.</span> <b>develop critical thinking skills</b> <i class=\"ph\">/dɪˈveləp ˈkrɪtɪkl ˈθɪŋkɪŋ skɪlz/</i> (v.phr): phát triển kỹ năng tư duy phản biện</div><div class=\"vi\"><span class=\"vn\">62.</span> <b>solve problems logically</b> <i class=\"ph\">/sɒlv ˈprɒbləmz ˈlɒdʒɪkli/</i> (v.phr): giải quyết các vấn đề một cách logic</div><div class=\"vi\"><span class=\"vn\">63.</span> <b>intellectually stimulating</b> <i class=\"ph\">/ˌɪntəˈlektʃuəli ˈstɪmjuleɪtɪŋ/</i> (adj.phr): kích thích trí tuệ, gây hứng thú về mặt trí óc</div><div class=\"vi\"><span class=\"vn\">64.</span> <b>practical and useful</b> <i class=\"ph\">/ˈpræktɪkl ænd ˈjuːsfl/</i> (adj.phr): thực tế và hữu ích</div><div class=\"vi sub\"><b>– give practical examples</b> <i class=\"ph\">/ɡɪv ˈpræktɪkl ɪɡˈzɑːmplz/</i> (v.phr): đưa ra các ví dụ thực tế</div><div class=\"vi\"><span class=\"vn\">65.</span> <b>strict but supportive teacher</b> <i class=\"ph\">/ə strɪkt bət səˈpɔːtɪv ˈtiːtʃə(r)/</i> (n.phr): một giáo viên nghiêm khắc nhưng luôn hỗ trợ học sinh</div><div class=\"vi\"><span class=\"vn\">66.</span> <b>explain things clearly</b> <i class=\"ph\">/ɪkˈspleɪn θɪŋz ˈklɪəli/</i> (v.phr): giải thích mọi thứ một cách rõ ràng</div><div class=\"vi\"><span class=\"vn\">67.</span> <b>make lessons engaging</b> <i class=\"ph\">/meɪk ˈlesnz ɪnˈɡeɪdʒɪŋ/</i> (v.phr): làm cho bài học trở nên lôi cuốn/hấp dẫn</div><div class=\"vi\"><span class=\"vn\">68.</span> <b>outweigh</b> ˌ/aʊtˈweɪ/ (v): áp đảo, vượt trội hơn</div><div class=\"vi\"><span class=\"vn\">69.</span> <b>deeply convinced</b> <i class=\"ph\">/ˈdiːpli kənˈvɪnst/</i> (adj.phr) = <b>firmly believe</b> (v): hoàn toàn tin tưởng, bị thuyết phục</div><div class=\"vi\"><span class=\"vn\">70.</span> <b>do more harm than good</b> <i class=\"ph\">/duː mɔː hɑːm ðən ɡʊd/</i> (idm): hại nhiều hơn lợi</div><div class=\"vi sub\"><b>– do more good than harm</b> <i class=\"ph\">/duː mɔː ɡʊd ðən hɑːm/</i> (idm): lợi nhiều hơn hại</div><div class=\"vi\"><span class=\"vn\">71.</span> <b>For example</b> <i class=\"ph\">/fər ɪɡˈzɑːmpl/</i> = <b>For instance</b> <i class=\"ph\">/fər ˈɪnstəns/</i> = <b>To illustrate</b> <i class=\"ph\">/tə ˈɪləstreɪt/</i> (adv.phr): ví dụ</div><div class=\"vi\"><span class=\"vn\">72.</span> <b>Therefore </b><i class=\"ph\">/ˈðeəfɔː(r)/</i>= <b>Consequently </b><i class=\"ph\">/ˈkɒnsɪkwəntli/</i> = <b>Thus </b><i class=\"ph\">/ðʌs/</i>(adv): do đó, vì vậy, vậy nên</div><div class=\"vi\"><span class=\"vn\">73.</span> <b>First and foremost </b><i class=\"ph\">/ˌfɜːst ənd ˈfɔːməʊst/</i> = <b>To begin with </b><i class=\"ph\">/tə bɪˈɡɪn wɪð/</i> = <b>First of all</b> <i class=\"ph\">/ˌfɜːst əv ˈɔːl/</i> (adv.phr): đầu tiên</div><div class=\"vi\"><span class=\"vn\">74.</span> <b>Not to mention </b><i class=\"ph\">/ˌfɜːðəˈmɔː(r)/</i>= <b>What is more </b><i class=\"ph\">/wɒt ɪz mɔː(r)/</i> = <b>In addition</b> <i class=\"ph\">/ɪn əˈdɪʃn/</i> (adv.phr): ngoài ra</div><div class=\"vi\"><span class=\"vn\">75.</span> <b>However </b><i class=\"ph\">/haʊˈevə(r)/</i> (adv) = <b>In contrast</b> <i class=\"ph\">/ɪn ˈkɒntrɑːst/</i> = <b>On the other hand</b> <i class=\"ph\">/ɒn ði ˈʌðə hænd/</i> (adv.phr): tuy nhiên</div><div class=\"vi\"><span class=\"vn\">76.</span> <b>attention to sth </b><i class=\"ph\">/əˈtenʃn/</i> (u.n): sự chú ý đến cái gì</div><div class=\"vi sub\"><b>– pay attention </b><i class=\"ph\">/peɪ əˈtenʃn/</i> (v.phr): chú ý (đến cái gì)</div><div class=\"vi sub\"><b>– hold / command sb’s attention </b><i class=\"ph\">/həʊld / kəˈmɑːnd ˈsʌmbədiz əˈtenʃn/</i> (v.phr): giữ chú ý của ai</div><div class=\"vi\"><span class=\"vn\">77.</span> <b>personal screen</b> <i class=\"ph\">/ˈpɜːsənl skriːn/</i> = <b>computer monitor</b> <i class=\"ph\">/kəmˈpjuːtə ˈmɒnɪtə(r)/</i> (n.phr): màn hình cá nhân (máy tính, điện thoại, máy tính bảng)</div><div class=\"vi\"><span class=\"vn\">78.</span> <b>educator</b> <i class=\"ph\">/ˈedʒukeɪtə(r)/</i> = <b>lecturer</b> <i class=\"ph\">/ˈlektʃərə(r)/</i> (c.n): nhà giáo dục / giảng viên</div><div class=\"vi\"><span class=\"vn\">79.</span> <b>fall behind in</b> <b>sth</b> <i class=\"ph\">/fɔːl bɪˈhaɪnd ɪn/</i> (v.phr): tụt hậu, theo không kịp (trong học tập)</div><div class=\"vi\"><span class=\"vn\">80.</span> <b>keep up with</b> <b>sb</b> / <b>sth</b> <i class=\"ph\">/kiːp ʌp wɪð/</i> (v.phr): theo kịp, duy trì cùng tốc độ với</div>"}, {"t": "Listening", "i": "II. Vocabulary for Listening (34 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>enrol</b> <i class=\"ph\">/ɪnˈrəʊl/</i> (v): đăng ký chính thức</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>registration</b> <i class=\"ph\">/ˌredʒɪˈstreɪʃn/</i> (u.n): việc đăng ký, sự đăng ký</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>leaflet</b> <i class=\"ph\">/ˈliːflət/</i> (c.n): tờ rơi thông tin</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>fill up</b> <b>fast</b> <i class=\"ph\">/fɪl ʌp fɑːst/</i> (v.phr): nhanh chóng hết chỗ</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>taken</b> <i class=\"ph\">/ˈteɪkən/</i> (adj): đã có người đăng ký, hết chỗ</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>waiting</b> <b>list</b> <i class=\"ph\">/ˈweɪtɪŋ lɪst/</i> (c.n): danh sách chờ</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>extra</b> <b>charge</b> <i class=\"ph\">/ˈekstrə tʃɑːdʒ/</i> (c.n): phí phụ thu, chi phí bổ sung</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>recommended</b> <i class=\"ph\">/ˌrekəˈmendɪd/</i> (adj): được khuyên dùng, được tiến cử</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>ingredient</b> <i class=\"ph\">/ɪnˈɡriːdiənt/</i> (c.n): nguyên liệu</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>herb</b> <i class=\"ph\">/hɜːb/</i> (c.n): thảo mộc, rau gia vị</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>candle</b> <i class=\"ph\">/ˈkændl/</i> (c.n): cây nến</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>natural</b> <b>product</b> <i class=\"ph\">/ˈnætʃrəl ˈprɒdʌkt/</i> (c.n): sản phẩm từ thiên nhiên</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>silk</b> <b>painting</b> <i class=\"ph\">/sɪlk ˈpeɪntɪŋ/</i> (u.n): tranh lụa</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>dye</b> <i class=\"ph\">/daɪ/</i> (c.n): màu nhuộm dye / (v): nhuộm</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>apron</b> <i class=\"ph\">/ˈeɪprən/</i> (c.n): tạp dề</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>stain</b> <i class=\"ph\">/steɪn/</i> (c.n): vết dính màu, vết bẩn / (v): làm bẩn, làm dính màu</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>DIY</b> <i class=\"ph\">/ˌdiː aɪ ˈwaɪ/</i> (u.n): tự làm, sửa chữa gia đình</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>basic</b> <b>tool</b> <i class=\"ph\">/ˈbeɪsɪk tuːl/</i> (c.n): dụng cụ cơ bản</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>surname</b> <i class=\"ph\">/ˈsɜːneɪm/</i> = <b>last name = family name</b> (c.n): họ (tên họ)</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>coordinator</b> <i class=\"ph\">/kəʊˈɔːdɪneɪtə(r)/</i> (c.n): người điều phối, quản lý</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>beginner</b> <i class=\"ph\">/bɪˈɡɪnə(r)/</i>(c.n): người mới bắt đầu</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>reassuring</b> <i class=\"ph\">/ˌriːəˈʃʊərɪŋ/</i> (adj): làm an tâm, giải tỏa lo lắng</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>hopeless</b> <i class=\"ph\">/ˈhəʊpləs/</i> (adj): rất kém, vụng về</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>instrument</b> <i class=\"ph\">/ˈɪnstrəmənt/</i> (c.n): nhạc cụ</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>second-hand</b> <i class=\"ph\">/ˌsekənd ˈhænd/</i> (adj): đồ cũ, đã qua sử dụng</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>plectrum</b> <i class=\"ph\">/ˈplektrəm/</i> (c.n): miếng gảy đàn</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>recording</b> <i class=\"ph\">/rɪˈkɔːdɪŋ/</i> (c.n): bản ghi âm</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>tune</b> <i class=\"ph\">/tjuːn/</i> (v): chỉnh dây (nhạc cụ)</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>by ear</b> <i class=\"ph\">/baɪ ɪə(r)/</i> (idm): nghe trực tiếp bằng tai (chơi nhạc không cần nốt)</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>strumming</b> <i class=\"ph\">/ˈstrʌmɪŋ/</i> (u.n): việc gảy, búng dây đàn</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>chord</b> <i class=\"ph\">/kɔːd/</i> (c.n): hợp âm</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>finger picking</b> <i class=\"ph\">/ˈfɪŋɡə pɪkɪŋ/</i> (u.n): kỹ thuật gảy từng dây đơn, móc dây</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>clapping</b> <i class=\"ph\">/ˈklæpɪŋ/</i> (u.n): việc vỗ tay (giữ nhịp)</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>impressive</b> <i class=\"ph\">/ɪmˈpresɪv/</i> (adj): gây ấn tượng mạnh</div>"}, {"t": "Reading", "i": "III. Vocabulary for Reading (47 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>digital consumption</b> <i class=\"ph\">/ˌdɪdʒɪtl kənˈsʌmpʃn/</i> (n.phr): mức độ tiêu thụ kỹ thuật số</div><div class=\"vi sub\"><b>– consumption</b> <i class=\"ph\">/kənˈsʌmpʃn/</i> (u.n): sự tiêu thụ, tiêu dùng</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>eye-opening</b> <i class=\"ph\">/ˈaɪ ˌəʊpənɪŋ/</i> (adj): gây bất ngờ, mở mang tầm mắt</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>electronic device </b><i class=\"ph\">/ɪˌlekˈtrɒnɪk dɪˈvaɪs/</i> (n.phr): thiết bị điện tử</div><div class=\"vi sub\"><b>– device</b> <i class=\"ph\">/dɪˈvaɪs/</i> (c.n): thiết bị</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>media</b> <i class=\"ph\">/ˈmiːdiə/</i> (n): phương tiện truyền thông, giới truyền thông</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>addiction</b> <i class=\"ph\">/əˈdɪkʃn/</i> (u.n): sự nghiện</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>pass-back effect</b> <i class=\"ph\">/ˈpɑːs bæk ɪˈfekt/</i> (n.phr): \"hiệu ứng chuyền tay\" - việc người lớn đưa điện thoại/thiết bị cho trẻ nhỏ dùng</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>digital connectivity</b> <i class=\"ph\">/ˌdɪdʒɪtl kəˌnektɪvəti/</i> (n.phr): kết nối kỹ thuật số</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>communication technology</b> <i class=\"ph\">/kəˌmjuːnɪˈkeɪʃn tekˈnɒlədʒi/</i> (n.phr): công nghệ truyền thông</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>digital overload</b> <i class=\"ph\">/ˌdɪdʒɪtl ˈəʊvələʊd/</i> (n.phr): quá tải kỹ thuật số (tiếp nhận quá nhiều thông tin số)</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>benefit</b> <i class=\"ph\">/ˈbenɪfɪt/</i> (c.n): lợi ích</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>interactive media</b> <i class=\"ph\">/ˌɪntərˈæktɪv ˈmiːdiə/</i> (n.phr): phương tiện truyền thông tương tác</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>manipulate</b> <i class=\"ph\">/məˈnɪpjuleɪt/</i> (v): thao túng, lợi dụng</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>concern</b> <i class=\"ph\">/kənˈsɜːn/</i> (c.n): mối lo ngại</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>over-exertion</b> <i class=\"ph\">/ˌəʊvər ɪɡˈzɜːʃn/</i> (n): sự gắng sức/hoạt động quá mức</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>responsible gaming</b> <i class=\"ph\">/rɪˈspɒnsəbl ˈɡeɪmɪŋ/</i> (n.phr): chơi game có trách nhiệm, kiểm soát</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>dialogue</b> <i class=\"ph\">/ˈdaɪəlɒɡ/</i> (n): cuộc đối thoại, trò chuyện, trao đổi</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>set rules</b> <i class=\"ph\">/set ruːlz/</i> (v.phr): đặt ra quy tắc</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>regulate</b> <i class=\"ph\">/ˈreɡjuleɪt/</i> (v): điều chỉnh, quản lý, kiểm soát</div><div class=\"vi sub\"><b>– self-regulate</b> <i class=\"ph\">/ˌself ˈreɡjuleɪt/</i> (v): tự điều chỉnh, tự quản lý (không cần luật)</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>internet safety</b> <i class=\"ph\">/ˈɪntənet ˈseɪfti/</i> (n.phr): an toàn khi sử dụng internet</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>protect one's privacy</b> <i class=\"ph\">/prəˈtekt ˈprɪvəsi/</i> (v.phr): bảo vệ quyền riêng tư</div><div class=\"vi sub\"><b>– privacy</b> <i class=\"ph\">/ˈprɪvəsi/</i> (u.n): quyền riêng tư</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>digital obesity</b> <i class=\"ph\">/ˌdɪdʒɪtl əʊˈbiːsəti/</i> (n.phr): \"béo phì kỹ thuật số\" - tình trạng nghiện công nghệ số</div><h3>PRACTICE 2</h3><div class=\"vi\"><b>THE CASE FOR MIXED-ABILITY CLASSES</b></div><div class=\"vi\"><span class=\"vn\">1.</span> <b>mixed-ability</b> <i class=\"ph\">/ˌmɪkst əˈbɪləti/</i> (adj): đa dạng về năng lực, trình độ không đồng đều (trong một lớp)</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>literacy demands</b> <i class=\"ph\">/ˈlɪtərəsi dɪˈmɑːndz/</i> (n.phr): yêu cầu về khả năng đọc viết</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>textual evidence</b> <i class=\"ph\">/ˈtekstʃuəl ˈevɪdəns/</i> (n.phr): bằng chứng/dẫn chứng từ văn bản</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>streaming</b> <i class=\"ph\">/ˈstriːmɪŋ/</i> (n): sự phân luồng, xếp lớp theo năng lực</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>tracking</b> <i class=\"ph\">/ˈtrækɪŋ/</i> (n): cách gọi khác của streaming (thường dùng ở mỹ) - phân loại học sinh theo năng lực</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>diagnose</b> <i class=\"ph\">/ˈdaɪəɡnəʊz/</i> (v): chẩn đoán, đánh giá (trình độ, năng lực)</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>attainment</b> <i class=\"ph\">/əˈteɪnmənt/</i> (n): trình độ, thành tích đạt được</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>selective</b> <i class=\"ph\">/sɪˈlektɪv/</i> (adj): chọn lọc, có tuyển chọn đầu vào</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>comprehensive school</b> <i class=\"ph\">/ˌkɒmprɪˈhensɪv skuːl/</i> (n.phr): trường công lập không chọn lọc đầu vào (anh)</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>stakeholder</b> <i class=\"ph\">/ˈsteɪkhəʊldə/</i> (n): bên liên quan</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>scaffolding</b> <i class=\"ph\">/ˈskæfəldɪŋ/</i> (n): sự hỗ trợ tạm thời trong quá trình học (giàn giáo)</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>autonomous</b> <i class=\"ph\">/ɔːˈtɒnəməs/</i> (adj): tự chủ, độc lập</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>on the same hike</b> (idiom): (ẩn dụ) cùng đi trên một hành trình/theo cùng một chuẩn mực như nhau</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>aptitude</b> <i class=\"ph\">/ˈæptɪtjuːd/</i> (n): năng khiếu, năng lực bẩm sinh</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>empirical evidence</b> <i class=\"ph\">/ɪmˈpɪrɪkl ˈevɪdəns/</i> (n.phr): bằng chứng thực nghiệm</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>representation</b> <i class=\"ph\">/ˌreprɪzenˈteɪʃn/</i> (n): sự đại diện, tỉ lệ hiện diện</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>clever</b> <i class=\"ph\">/ˈklevə/</i> (adj): thông minh, lanh lợi</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>achievement</b> <i class=\"ph\">/əˈtʃiːvmənt/</i> (n): thành tích, thành tựu</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>capable of</b> <i class=\"ph\">/ˈkeɪpəbl ɒv/</i> (adj.phr): có khả năng làm gì</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>flexible</b> <i class=\"ph\">/ˈfleksəbl/</i> (adj): linh hoạt</div><div class=\"vi\"><span class=\"vn\">21.</span> <b>peer-to-peer learning</b> <i class=\"ph\">/ˌpɪə tə ˈpɪə ˈlɜːnɪŋ/</i> (n.phr): học tập giữa các bạn cùng lứa/trình độ</div><div class=\"vi\"><span class=\"vn\">22.</span> <b>aspect</b> <i class=\"ph\">/ˈæspekt/</i> (n): khía cạnh</div><div class=\"vi\"><span class=\"vn\">23.</span> <b>zeal</b> <i class=\"ph\">/ziːl/</i> (n): sự nhiệt huyết, hăng hái</div><div class=\"vi\"><span class=\"vn\">24.</span> <b>ability </b><i class=\"ph\">/əˈbɪləti/</i> (n): năng lực, khả năng</div><div class=\"vi\"><span class=\"vn\">25.</span> <b>collaborative learning environment</b> <i class=\"ph\">/kəˈlæbərətɪv ˈlɜːnɪŋ ɪnˈvaɪrənmənt/</i> (n.phr): môi trường học tập hợp tác</div><div class=\"vi\"><span class=\"vn\">26.</span> <b>flourish</b> <i class=\"ph\">/ˈflʌrɪʃ/</i> (v): phát triển mạnh mẽ, phát triển rực rỡ</div>"}, {"t": "Speaking", "i": "III. Vocabulary for Speaking (25 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>broaden my horizons</b> /ˈbrɔːdn maɪ <i class=\"ph\">/həˈraɪzənz/</i> (v.phr): mở rộng kiến thức, tầm nhìn</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>develop critical thinking skills</b> <i class=\"ph\">/dɪˈveləp ˈkrɪtɪkl ˈθɪŋkɪŋ skɪlz/</i> (v.phr): phát triển kỹ năng tư duy phản biện</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>solve problems logically</b> <i class=\"ph\">/sɒlv ˈprɒbləmz ˈlɒdʒɪkli/</i> (v.phr): giải quyết các vấn đề một cách logic</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>understand how things work</b> <i class=\"ph\">/ˌʌndəˈstænd haʊ θɪŋz wɜːk/</i> (v.phr): hiểu cách mọi thứ vận hành/hoạt động</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>improve my communication skills</b> <i class=\"ph\">/ɪmˈpruːv maɪ kəˌmjuːnɪˈkeɪʃn skɪlz/</i> (v.phr): cải thiện/nâng cao kỹ năng giao tiếp của tôi</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>apply what I learned in real life</b> <i class=\"ph\">/əˈplaɪ wɒt aɪ lɜːnt ɪn ˌrɪəl ˈlaɪf/</i> (v.phr): áp dụng những gì đã học vào thực tế cuộc sống</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>intellectually stimulating</b> <i class=\"ph\">/ˌɪntəˈlektʃuəli ˈstɪmjuleɪtɪŋ/</i> (adj.phr): kích thích trí tuệ, gây hứng thú về mặt trí óc</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>practical and useful</b> <i class=\"ph\">/ˈpræktɪkl ænd ˈjuːsfl/</i> (adj.phr): thực tế và hữu ích</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>a strict but supportive teacher</b> <i class=\"ph\">/ə strɪkt bət səˈpɔːtɪv ˈtiːtʃə(r)/</i> (n.phr): một giáo viên nghiêm khắc nhưng luôn hỗ trợ học sinh</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>explain things clearly</b> <i class=\"ph\">/ɪkˈspleɪn θɪŋz ˈklɪəli/</i> (v.phr): giải thích mọi thứ một cách rõ ràng</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>make lessons engaging</b> <i class=\"ph\">/meɪk ˈlesnz ɪnˈɡeɪdʒɪŋ/</i> (v.phr): làm cho bài học trở nên lôi cuốn/hấp dẫn</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>encourage students to ask questions</b> <i class=\"ph\">/ɪnˈkʌrɪdʒ ˈstjuːdnts tə ɑːsk ˈkwestʃənz/</i> (v.phr): khuyến khích học sinh đặt câu hỏi</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>give practical examples</b> <i class=\"ph\">/ɡɪv ˈpræktɪkl ɪɡˈzɑːmplz/</i> (v.phr): đưa ra các ví dụ thực tế</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>on a streaming platform</b> <i class=\"ph\">/ɒn ə ˈstriːmɪŋ ˈplætfɔːm/</i> (prep.phr): trên nền tảng xem phim trực tuyến</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>at the cinema</b> <i class=\"ph\">/æt ðə ˈsɪnəmɑː/</i> (prep.phr): tại rạp chiếu phim</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>a predictable storyline</b> <i class=\"ph\">/ə prɪˈdɪktəbl ˈstɔːrilaɪn/</i> (n.phr): một cốt truyện dễ đoán</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>a complicated plot</b> <i class=\"ph\">/ə ˈkɒmplɪkeɪtɪd plɒt/</i> (n.phr): một cốt truyện phức tạp/rắc rối</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>poorly developed characters</b> <i class=\"ph\">/ˈpɔːli dɪˈveləpt ˈkærəktəz/</i> (n.phr): các nhân vật được xây dựng mờ nhạt/kém phát triển</div><div class=\"vi sub\"><b>– relate to the characters</b> <i class=\"ph\">/aɪ ˈkʊdnt rɪˈleɪt tə ðə ˈkærəktəz/</i> (sent): đồng cảm, tìm thấy sự kết nối với các nhân vật</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>a complete waste of time</b> <i class=\"ph\">/ə kəmˈpliːt weɪst əv taɪm/</i> (n.phr): một sự lãng phí thời gian hoàn toàn</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>a disappointing</b> <b>ending </b>/ ə ˌdɪsəˈpɔɪntɪŋ ˈendɪŋ/ (n.phr): cái kết gây thất vọng</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>live up to my expectations</b> <i class=\"ph\">/lɪv ʌp tə maɪ ˌekspekˈteɪʃnz/</i> (v.phr): nó không đáp ứng được kỳ vọng của tôi</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>lack originality</b> <i class=\"ph\">/læk əˌrɪdʒəˈnæləti/</i> (v.phr): thiếu tính sáng tạo / độc đáo</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>take / do exercise</b> <i class=\"ph\">/teɪk / duː ˈreɡjələ(r) ˈeksəsaɪz/</i> = <b>work out</b> <i class=\"ph\">/wɜːk aʊt/</i> = <b>engage in physical activity</b> <i class=\"ph\">/ɪnˈɡeɪdʒ ɪn ˈfɪzɪkl ækˈtɪvəti/</i> (v.phr): tập thể dục</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>keep fit</b> <i class=\"ph\">/kiːp fɪt/</i> = <b>get lean</b> <i class=\"ph\">/ɡet liːn/</i> = <b>stay in shape</b> <i class=\"ph\">/steɪ ɪn ʃeɪp/</i> (v.phr): giữ dáng</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>keep me energized </b><i class=\"ph\">/kiːp mi ˈenədʒaɪzd/</i> (v.phr): giúp tôi tràn đầy năng lượng, duy trì năng lượng</div>"}, {"t": "Writing", "i": "IV. Vocabulary for Writing (54 mục)", "v": "<input type=\"text\" placeholder=\"Tìm từ vựng… (gõ tiếng Anh hoặc tiếng Việt)\" oninput=\"F(this.value)\" style=\"margin:0 0 12px\"><h3>PRACTICE 1</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>discuss </b><i class=\"ph\">/dɪˈskʌs/</i> = <b>examine </b><i class=\"ph\">/ɪɡˈzæmɪn/</i> = <b>mention </b><i class=\"ph\">/ˈmenʃn/</i> (v): đề cập, nhắc tới (dùng ở mở bài để giới thiệu các ý sẽ được viết ở thân bài)</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>drawback </b><i class=\"ph\">/ˈdrɔːbæk/</i> = <b>disadvantage </b><i class=\"ph\">/ˌdɪsədˈvɑːntɪdʒ/</i> = <b>limitation </b><i class=\"ph\">/ˌlɪmɪˈteɪʃn/</i> (c.n): khuyết điểm</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>For example</b> <i class=\"ph\">/fər ɪɡˈzɑːmpl/</i> (adv.phr): ví dụ như</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>Therefore </b>/ˈðeəfɔː(r(adv): do đó, vì vậy, vậy nên</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>First and foremost </b><i class=\"ph\">/ˌfɜːst ənd ˈfɔːməʊst/</i> (adv.phr): đầu tiên</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>Not to mention </b><i class=\"ph\">/ˌfɜːðəˈmɔː(r)/</i> (adv.phr): ngoài ra</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>However </b><i class=\"ph\">/haʊˈevə(r)/</i> (adv): tuy nhiên</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>benefit</b> <i class=\"ph\">/ˈbenɪfɪt/</i> = <b>advantage </b><i class=\"ph\">/ədˈvɑːntɪdʒ/</i> = <b>merit </b><i class=\"ph\">/ˈmerɪt/</i> (c.n): lợi ích</div><div class=\"vi sub\"><b>– benefit from sth</b> (v.phr): được lợi từ cái gì</div><div class=\"vi sub\"><b>– reap the benefits </b><i class=\"ph\">/riːp ðə ˈbenɪfɪts/</i> = <b>enjoy the advantages</b> <i class=\"ph\">/ɪnˈdʒɔɪ ðə ədˈvɑːntɪdʒɪz/</i> (v.phr): thu hưởng lợi ích</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>online platform </b><i class=\"ph\">/ˌɒnˈlaɪn ˈplætfɔːm/</i> = <b>digital learning tool</b> <i class=\"ph\">/ˈdɪdʒɪtl ˈlɜːnɪŋ tuːl/</i> = <b>e-learning websites </b><i class=\"ph\">/iː lɜːnɪŋ ˈwebsaɪt/</i>(n.phr): nền tảng / công cụ học trực tuyến</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>attention to sth </b><i class=\"ph\">/əˈtenʃn/</i> (u.n): sự chú ý đến cái gì</div><div class=\"vi sub\"><b>– pay attention </b>(v.phr)<b>: </b>chú ý (đến cái gì)</div><div class=\"vi sub\"><b>– hold sb’s attention </b>(v.phr)<b>: </b>giữ chú ý của ai</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>addicted to sth </b><i class=\"ph\">/əˈdɪktɪd/</i> (adj): bị nghiện cái gì</div><div class=\"vi sub\"><b>– addiction to sth </b><i class=\"ph\">/əˈdɪkʃn/</i> (u.n):sự nghiện ngập</div><div class=\"vi\"><span class=\"vn\">12.</span> <b>interact with </b><i class=\"ph\">/ˌɪntərˈækt/</i> (v): tương tác (giao tiếp qua các giác quan khi chơi, học, hoặc gặp người khác</div><div class=\"vi sub\"><b>– interaction </b><i class=\"ph\">/əˈdɪkʃn/</i> (u.n):sự tương tác</div><div class=\"vi sub\"><b>– interactive whiteboard </b><i class=\"ph\">/ˌɪntərˈæktɪv ˈwaɪtbɔːd/</i> (c.n): bảng tương tác thông minh</div><div class=\"vi sub\"><b>– interactive classroom </b><i class=\"ph\">/ˌɪntərˈæktɪv ˈklɑːsruːm/</i> (c.n): lớp học có sự tương tác (ứng dụng công nghệ hoặc phương pháp giảng dạy hai chiều)</div><div class=\"vi sub\"><b>– interactive game </b><i class=\"ph\">/ˌɪntərˈæktɪv ɡeɪm/</i> (c.n): trò chơi tương tác</div><div class=\"vi\"><span class=\"vn\">13.</span> <b>consume</b> <i class=\"ph\">/kənˈsjuːm/</i> (v): tiêu thụ.</div><div class=\"vi sub\"><b>– consumption</b> <i class=\"ph\">/kənˈsʌmpʃn/</i> (u.n): sự tiêu thụ, sự hấp thụ (thông tin, năng lượng, thức ăn).</div><div class=\"vi\"><span class=\"vn\">14.</span> <b>interface</b> <i class=\"ph\">/ˈɪntəfeɪs/</i> (c.n): giao diện (những thứ thấy được trên điện thoại, máy tính, ứng dụng...)</div><div class=\"vi sub\"><b>– ICT interface</b> / aɪ siː ˈtiː ˈɪntəfeɪs/ (c.n):giao diện công nghệ thông tin và truyền thông</div><div class=\"vi\"><span class=\"vn\">15.</span> <b>equip sb with sth </b><i class=\"ph\">/ɪˈkwɪp/</i>= <b>provide sb with sth </b><i class=\"ph\">/prəˈvaɪd/</i>= <b>create sth for sb</b> <i class=\"ph\">/kriˈeɪt/</i> (v.phr): cho ai cái gì</div><div class=\"vi\"><span class=\"vn\">16.</span> <b>a variety of</b> <i class=\"ph\">/ə vəˈraɪəti əv/</i> = <b>a large number of</b> <i class=\"ph\">/ə lɑːdʒ ˈnʌmbər əv/</i> (adj.phr)* *= <b>various</b> <i class=\"ph\">/ˈveəriəs/</i> (adj): đa dạng, nhiều loại khác nhau</div><div class=\"vi\"><span class=\"vn\">17.</span> <b>get familiar with sth </b><i class=\"ph\">/ɡet fəˈmɪliə(r) wɪð/</i> = <b>get accustomed to sth</b> <i class=\"ph\">/ɡet əˈkʌstəmd tə/</i> (adj): làm quen với cái gì, trở nên thành thạo cái gì</div><div class=\"vi\"><span class=\"vn\">18.</span> <b>information overload </b>/ ˌɪnfəˈmeɪʃn ˌəʊvəˈləʊd/ (n.phr): quá tải thông tin</div><div class=\"vi\"><span class=\"vn\">19.</span> <b>gamify</b> <i class=\"ph\">/ˈɡeɪmɪfaɪ/</i> (verb): trò chơi hóa (biến một hoạt động học tập/làm việc thành một trò chơi cho vui).</div><div class=\"vi sub\"><b>– gamification</b> <i class=\"ph\">/ˌɡeɪmɪfɪˈkeɪʃn/</i> (noun): sự trò chơi hóa.</div><div class=\"vi\"><span class=\"vn\">20.</span> <b>deliver</b> <i class=\"ph\">/dɪˈlɪvər/</i> (verb): truyền tải, phát biểu</div><div class=\"vi sub\"><b>– deliver a lesson </b><i class=\"ph\">/dɪˈlɪvər ə ˈlesn/</i><b> / deliver information </b><i class=\"ph\">/dɪˈlɪvə(r) ˌɪnfəˈmeɪʃn/</i>(v.phr): truyền tải bài học / truyền tải thông tin</div><h3>PRACTICE 2</h3><div class=\"vi\"><span class=\"vn\">1.</span> <b>outweigh</b> ˌ/aʊtˈweɪ/ (v): áp đảo, vượt trội hơn</div><div class=\"vi\"><span class=\"vn\">2.</span> <b>firmly believe</b> (v): hoàn toàn tin tưởng, bị thuyết phục</div><div class=\"vi\"><span class=\"vn\">3.</span> <b>do more harm than good</b> <i class=\"ph\">/duː mɔː hɑːm ðən ɡʊd/</i> (idm): hại nhiều hơn lợi</div><div class=\"vi sub\"><b>– do more good than harm</b> <i class=\"ph\">/duː mɔː ɡʊd ðən hɑːm/</i> (idm): lợi nhiều hơn hại</div><div class=\"vi\"><span class=\"vn\">4.</span> <b>For instance</b> <i class=\"ph\">/fər ˈɪnstəns/</i> (adv.phr): ví dụ như</div><div class=\"vi\"><span class=\"vn\">5.</span> <b>Consequently </b><i class=\"ph\">/ˈkɒnsɪkwəntli/</i>(adv): do đó, vì vậy, vậy nên</div><div class=\"vi\"><span class=\"vn\">6.</span> <b>To begin with </b><i class=\"ph\">/tə bɪˈɡɪn wɪð/</i> (adv.phr): đầu tiên</div><div class=\"vi\"><span class=\"vn\">7.</span> <b>What is more </b><i class=\"ph\">/wɒt ɪz mɔː(r)/</i> (adv.phr): ngoài ra</div><div class=\"vi\"><span class=\"vn\">8.</span> <b>In contrast</b> <i class=\"ph\">/ɪn ˈkɒntrɑːst/</i> (adv.phr): tuy nhiên</div><div class=\"vi\"><span class=\"vn\">9.</span> <b>pace</b> <i class=\"ph\">/peɪs/</i> (n): tốc độ, nhịp độ (học tập/phát triển)</div><div class=\"vi\"><span class=\"vn\">10.</span> <b>bridge the gap between … and …</b> <i class=\"ph\">/brɪdʒ ðə ɡæp bɪˈtwiːn … ænd …/</i> (v.phr): thu hẹp khoảng cách</div><div class=\"vi\"><span class=\"vn\">11.</span> <b>categorize
